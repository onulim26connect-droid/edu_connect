 // [이중 채널 2] 학교별 공용 마스터 채널 읽기 (5초 주기 자동 갱신 · 학교별 완벽 분리)
 async function pullSharedSchoolRoster(silent = true, targetSchoolOverride = ""){
  if(sharedLockRef.current) return;
  sharedLockRef.current = true;
  try {
   const cfg = getSupabaseClientConfig();
   const activeSchoolName = targetSchoolOverride || currentUser?.school || selectedSchool || live.current?.profile?.school || "광영고등학교";
   const channelCode = await getSchoolChannelCode(activeSchoolName);
   const r = await rpc(cfg, "read", { p_code: channelCode });
   if(r && r.version && r.version !== sharedVersionRef.current && isObj(r.data)){
    sharedVersionRef.current = r.version;
    const shared = r.data;
    const incomingSwaps = Array.isArray(shared.swapRequests) ? shared.swapRequests : [];
    swapRequestsRef.current = incomingSwaps;
    setSwapRequests(incomingSwaps);
    if(isText(shared.notice)){
     schoolNoticeRef.current = shared.notice;
     setSchoolNotice(shared.notice);
    }

    const myName = cleanMasterLabel(currentUser?.name || live.current?.profile?.teacher || "");
    const nextMasterData = isObj(shared.schoolMasterData) ? shared.schoolMasterData : (live.current?.schoolMasterData || {teachers:{},classTimetables:{},homeroomRosters:{},electiveRosters:{},homeroomTeachers:{},electiveRooms:{},updatedAt:""});

    update(d => {
     const hrTeachers = nextMasterData?.homeroomTeachers || {};
     const assignedDept = myName ? Object.keys(hrTeachers).find(dept => cleanMasterLabel(hrTeachers[dept]) === myName) : "";
     let myGrade = Number(currentUser?.grade) || d.profile.grade || 1;
     let myClassroom = Number(currentUser?.classroom) || d.profile.classroom || 1;
     let myHomeroomFlag = currentUser?.homeroom !== undefined ? !!currentUser.homeroom : d.profile.homeroom;
     if(assignedDept && /^[1-3]-\d+$/.test(assignedDept)){
      const [g, c] = assignedDept.split("-").map(Number);
      myGrade = g;
      myClassroom = c;
      myHomeroomFlag = true;
     } else if(Object.keys(hrTeachers).length > 0 && myName && !assignedDept){
      myHomeroomFlag = false;
     }

     const myDept = `${myGrade}-${myClassroom}`;
     const nextMatrix = isObj(shared.electiveMatrix) ? shared.electiveMatrix : d.electiveMatrix;

     const sharedHomeroomList = nextMasterData?.homeroomRosters?.[myDept];
     const myClassStudents = Array.isArray(sharedHomeroomList) && sharedHomeroomList.length > 0
      ? sharedHomeroomList
      : (Array.isArray(nextMatrix?.rows) ? nextMatrix.rows.filter(row => row.dept === myDept).sort((a,b)=>a.number - b.number) : []);

     const nextStudents = myHomeroomFlag
      ? (myClassStudents.length >= 1
         ? myClassStudents.map((s, idx) => {
            const old = d.students.find(x => x.name === s.name || x.number === s.number);
            return old ? {...old, number:s.number || (idx+1), name:s.name, dept:myDept} : {id:s.id||uid(), number:s.number||(idx+1), dept:myDept, name:s.name, phone:s.phone||"", parentPhone:s.parentPhone||"", memo:s.memo||"", submitted:false};
           })
         : d.students)
      : [];

     const myHomeroom = {
      id: "homeroom",
      name: `우리반 (${myGrade}학년 ${myClassroom}반 담임 명렬)`,
      subject: "학급",
      room: myHomeroomFlag ? myDept : "",
      students: nextStudents
     };

     const classMap = new Map();
     (d.subjectClasses||[]).filter(c => c.id !== "homeroom" && !/^cls-hr-1-\d+/.test(c.id)).forEach(c => classMap.set(c.id, c));
     Object.entries(nextMasterData?.homeroomRosters || {}).sort(([a],[b])=>a.localeCompare(b,"ko",{numeric:true})).forEach(([deptKey, stuArr]) => {
      if(/^1-\d+$/.test(deptKey) && Array.isArray(stuArr) && stuArr.length > 0){
       const cNum = deptKey.split("-")[1];
       const uId = `cls-grade1-${deptKey}`;
       if(!classMap.has(uId)){
        classMap.set(uId, { id: uId, name: `1학년 ${cNum}반 (${deptKey})`, subject: "1학년 학급", room: deptKey, students: stuArr });
       }
      }
     });

     const nextTimetable = {...(d.timetable||{})};
     incomingSwaps.filter(req => req.status === "approved").forEach(req => {
      if(req.fromClassId && req.fromClassId !== "homeroom" && Array.isArray(req.fromStudents) && req.fromStudents.length){
       if(!classMap.has(req.fromClassId)) classMap.set(req.fromClassId, {id:req.fromClassId, name:req.fromClassName||req.fromClassId, subject:"교체·보강", room:"", students:req.fromStudents});
      }
      if(req.toClassId && req.toClassId !== "homeroom" && Array.isArray(req.toStudents) && req.toStudents.length){
       if(!classMap.has(req.toClassId)) classMap.set(req.toClassId, {id:req.toClassId, name:req.toClassName||req.toClassId, subject:"교체·보강", room:"", students:req.toStudents});
      }
      if(req.type === "perm_swap" && myName && !appliedPermSwapsRef.current.has(req.id)){
       if(req.fromTeacher === myName){
        nextTimetable[`${req.fromDay}-${req.fromPeriod}`] = req.toClassId || "";
        if(req.toDay && req.toPeriod) nextTimetable[`${req.toDay}-${req.toPeriod}`] = req.fromClassId || "";
        appliedPermSwapsRef.current.add(req.id);
       } else if(req.toTeacher === myName){
        if(req.toDay && req.toPeriod) nextTimetable[`${req.toDay}-${req.toPeriod}`] = req.fromClassId || "";
        nextTimetable[`${req.fromDay}-${req.fromPeriod}`] = req.toClassId || "";
        appliedPermSwapsRef.current.add(req.id);
       }
      }
     });

     // 안전하게 내부에서 선택과목 수업장소(electiveRooms)를 조회하는 인라인 헬퍼
     const elRoomsMap = isObj(nextMasterData?.electiveRooms) ? nextMasterData.electiveRooms : {};
     const findRoomSafe = (subjStr, tStr, fallbackStr) => {
      if(Object.keys(elRoomsMap).length === 0) return fallbackStr;
      const normS = String(subjStr || "").replace(/\(\s*\d+\s*명?\s*\)/g, "").replace(/\(원\)/g, "").replace(/Ⅰ/g, "I").replace(/Ⅱ/g, "II").replace(/[∙·・\s_\-~]/g, "").trim();
      if(!normS || /^(자율|진로|동아리|봉사|자습|공강|공통국어|공통영어|공통수학|통합사회|통합과학|과학탐구실험)/.test(normS)) return fallbackStr;
      const normSNoZero = normS.replace(/([A-Z])0$/i, "$1");
      const normSBase = normSNoZero.replace(/[A-N]$/i, "");
      const cleanT = cleanMasterLabel(String(tStr || "").replace(/\(원\)/g, "").trim());
      if(cleanT){
       if(elRoomsMap[`${normS}|${cleanT}`]) return elRoomsMap[`${normS}|${cleanT}`];
       if(elRoomsMap[`${normSNoZero}|${cleanT}`]) return elRoomsMap[`${normSNoZero}|${cleanT}`];
       for(const [k, v] of Object.entries(elRoomsMap)){
        if(!v || !k.includes("|")) continue;
        const [ks, kt] = k.split("|");
        const normKs = String(ks || "").replace(/\(\s*\d+\s*명?\s*\)/g, "").replace(/\(원\)/g, "").replace(/Ⅰ/g, "I").replace(/Ⅱ/g, "II").replace(/[∙·・\s_\-~]/g, "").trim().replace(/([A-Z])0$/i, "$1");
        if((normKs === normSNoZero || normKs.replace(/[A-N]$/i, "") === normSBase) && cleanMasterLabel(kt) === cleanT) return v;
       }
      }
      if(elRoomsMap[normS]) return elRoomsMap[normS];
      if(elRoomsMap[normSNoZero]) return elRoomsMap[normSNoZero];
      return fallbackStr;
     };

     const syncedClasses = Array.from(classMap.values()).map(cls => {
      const safeName = String(cls?.name || "");
      const cleanSubj = String(cls?.subject || safeName).trim();
      const roomMatch = safeName.match(/\(([^)]+)\)$/) || safeName.match(/\(([1-3]-\d+)\)/) || safeName.match(/^([1-3]-\d+)\s+/);
      const baseRoomStr = isText(cls?.room) && cls.room ? cls.room : (roomMatch ? roomMatch[1] : "");
      const overriddenRoom = findRoomSafe(cleanSubj, myName, baseRoomStr);
      const matchedEl = matchElectiveRosterFromMaster(cleanSubj, overriddenRoom, nextMasterData?.electiveRosters);
      const finalRoom = overriddenRoom || matchedEl?.room || baseRoomStr || "";
      const isElCard = safeName.includes("타임]") || safeName.includes("[선택]") || String(cls?.id || "").startsWith("cls-el-");
      const updatedName = (finalRoom && isElCard && !safeName.includes(`(${finalRoom})`))
       ? `${safeName.replace(/\s*\([^)]+\)\s*$/, "").trim()} (${finalRoom})`
       : safeName;

      if(matchedEl && Array.isArray(matchedEl.students) && matchedEl.students.length > 0){
       return { ...cls, name: updatedName, room: finalRoom, students: matchedEl.students };
      }
      const hrMatch = safeName.match(/^([1-3]-\d+)\s+/) || safeName.match(/\(([1-3]-\d+)\)/);
      if(hrMatch){
       const hrPool = getHomeroomStudentsFromMaster(hrMatch[1], nextMasterData, d);
       if(hrPool.length > 0) return { ...cls, room: finalRoom || hrMatch[1], students: hrPool };
      }
      return { ...cls, name: updatedName, room: finalRoom };
     });

     const incomingSharedAtt = isObj(shared.sharedPeriodAtt) ? shared.sharedPeriodAtt : {};
     const sharedQSets = Array.isArray(shared.sharedQuestionSets) ? shared.sharedQuestionSets : [];
     const localQSets = d.questionBank?.sets || [];
     const qSetMap = new Map();
     localQSets.forEach(s => qSetMap.set(s.id, s));
     sharedQSets.forEach(s => qSetMap.set(s.id, s));

     const sharedAcadList = Array.isArray(shared.sharedAcademicEvents) ? shared.sharedAcademicEvents : [];
     const existingEvKeys = new Set((d.events || []).map(ev => `${ev.date}_${ev.title}`));
     const mergedEvents = [
      ...(d.events || []),
      ...sharedAcadList.filter(ev => ev && validDate(ev.date) && hasText(ev.title) && !existingEvKeys.has(`${ev.date}_${ev.title}`))
     ];

     return {
      ...d,
      events: mergedEvents,
      profile: {
       ...d.profile,
       school: activeSchoolName || d.profile.school,
       teacher: myName || d.profile.teacher,
       grade: myGrade,
       classroom: myClassroom,
       homeroom: myHomeroomFlag
      },
      students: nextStudents,
      subjectClasses: [myHomeroom, ...syncedClasses],
      timetable: nextTimetable,
      electiveMatrix: nextMatrix,
      schoolMasterData: nextMasterData,
      questionBank: {
       ...(d.questionBank || {sets:[], usedHistory:{}}),
       sets: Array.from(qSetMap.values())
      },
      classAttendance: {
       ...(d.classAttendance || {}),
       __sharedPeriod: {
        ...(d.classAttendance?.__sharedPeriod || {}),
        ...incomingSharedAtt
       }
      }
     };
    });
    setSharedSyncStatus(`${activeSchoolName} 공용 채널 연동됨 (v${r.version})`);
    if(!silent) notify(`[${activeSchoolName}] 공용 명단·공지·문제은행 및 수업 교체 현황을 최신 상태로 갱신했습니다.`);
   }
  } catch {
   // 최초에 해당 학교 공용 채널이 아직 생성되지 않은 경우 무시
  } finally {
   sharedLockRef.current = false;
  }
 }

 // [이중 채널 2] 학교별 공용 마스터 채널 쓰기 (충돌 시 최대 3회 자동 재시도 병합 보장)
 async function pushSharedSchoolRoster(customPayload = null, targetSchoolOverride = ""){
  try {
   const cfg = getSupabaseClientConfig();
   const activeSchoolName = targetSchoolOverride || currentUser?.school || selectedSchool || live.current?.profile?.school || "광영고등학교";
   const channelCode = await getSchoolChannelCode(activeSchoolName);

   for(let attempt = 0; attempt < 3; attempt++){
    const cur = live.current;
    let existingShared = {};
    let curVersion = 0;
    try {
     const curServer = await rpc(cfg, "read", { p_code: channelCode });
     existingShared = isObj(curServer?.data) ? curServer.data : {};
     curVersion = curServer.version || 1;
    } catch {}

    const mergedSharedAtt = {
     ...(existingShared.sharedPeriodAtt || {}),
     ...(cur.classAttendance?.__sharedPeriod || {}),
     ...(customPayload?.sharedPeriodAtt || {})
    };

const payload = {
      ...existingShared,
      schoolName: activeSchoolName,
      sharedAcademicEvents: customPayload?.sharedAcademicEvents !== undefined ? customPayload.sharedAcademicEvents : (existingShared.sharedAcademicEvents || []),
      notice: customPayload?.notice !== undefined ? customPayload.notice : (schoolNoticeRef.current || existingShared.notice || ""),
     electiveMatrix: customPayload?.electiveMatrix !== undefined ? customPayload.electiveMatrix : cur.electiveMatrix,
     schoolMasterData: customPayload?.schoolMasterData !== undefined ? customPayload.schoolMasterData : (cur.schoolMasterData || existingShared.schoolMasterData || {}),
     subjectClasses: customPayload?.subjectClasses !== undefined ? customPayload.subjectClasses : (cur.subjectClasses || []).filter(c => c.id !== "homeroom"),
     periodTimes: FIXED_PERIOD_TIMES,
     swapRequests: swapRequestsRef.current || existingShared.swapRequests || [],
     sharedPeriodAtt: mergedSharedAtt,
     sharedQuestionSets: customPayload?.sharedQuestionSets !== undefined ? customPayload.sharedQuestionSets : (cur.questionBank?.sets || existingShared.sharedQuestionSets || []),
     ...(customPayload || {}),
     updatedBy: cleanMasterLabel(currentUser?.name || cur.profile.teacher || "교사"),
     updatedAt: new Date().toISOString()
    };

    if(Array.isArray(payload.swapRequests)){
     swapRequestsRef.current = payload.swapRequests;
     setSwapRequests(payload.swapRequests);
    }
    if(isText(payload.notice)){
     schoolNoticeRef.current = payload.notice;
     setSchoolNotice(payload.notice);
    }

    if(curVersion > 0){
     const w = await rpc(cfg, "write", { p_code: channelCode, p_version: curVersion, p_data: payload });
     if(w?.conflict){
      await new Promise(res => setTimeout(res, 180 * (attempt + 1)));
      continue;
     }
     if(w?.version) sharedVersionRef.current = w.version;
     break;
    } else {
     await rpc(cfg, "create", { p_code: channelCode, p_data: payload });
     sharedVersionRef.current = 1;
     break;
    }
   }
   setSharedSyncStatus(`${activeSchoolName} 공용 동기화 완료`);
  } catch(e) {
   setError("학교 공용 채널 서버 반영 실패: " + e.message);
  }
 }

 // 담임교사가 선택한 특정 교시들(예: 1~4교시)에 특정 학생(또는 전체 학생)의 출결을 동시 반영하는 함수
 function applyStudentAttToSelectedPeriods(dateStr, periodsArray, stuList, statusVal, nextHrDayMap){
  const cur = live.current;
  const myDept = `${cur.profile.grade}-${cur.profile.classroom}`;
  const teacherName = cleanMasterLabel(currentUser?.name || cur.profile.teacher || "담임교사");
  const nextSharedByDate = { ...(cur.classAttendance?.__sharedPeriod?.[dateStr] || {}) };
  const nextHomeroomPeriodAtt = { ...(cur.classAttendance?.homeroom || {}) };
  const targetPeriods = Array.isArray(periodsArray) && periodsArray.length > 0 ? periodsArray : [];

  targetPeriods.forEach(p => {
   const rKey = `${dateStr}_${p}교시`;
   const pMap = { ...(nextHomeroomPeriodAtt[rKey] || {}) };
   const sharedPMap = { ...(nextSharedByDate[p] || {}) };
   stuList.forEach(st => {
    pMap[st.id] = statusVal;
    if(statusVal === "미기록"){
     delete sharedPMap[`${myDept}|${st.name}`];
    } else {
     sharedPMap[`${myDept}|${st.name}`] = {
      status: statusVal,
      subject: `담임지정(${p}교시)`,
      teacher: teacherName,
      updatedAt: new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})
     };
    }
   });
   nextHomeroomPeriodAtt[rKey] = pMap;
   nextSharedByDate[p] = sharedPMap;
  });

  update(d => ({
   ...d,
   attendance: { ...d.attendance, [dateStr]: nextHrDayMap },
   classAttendance: {
    ...(d.classAttendance || {}),
    homeroom: nextHomeroomPeriodAtt,
    ...(targetPeriods.length > 0 ? {
     __sharedPeriod: {
      ...(d.classAttendance?.__sharedPeriod || {}),
      [dateStr]: nextSharedByDate
     }
    } : {})
   }
  }));
  if(targetPeriods.length > 0){
   setTimeout(() => pushSharedSchoolRoster({ sharedPeriodAtt: { [dateStr]: nextSharedByDate } }), 120);
  }
 }

 async function createSwapOrSubRequest(reqObj){
  const nextList = [...(swapRequestsRef.current || []), reqObj];
  swapRequestsRef.current = nextList;
  setSwapRequests(nextList);

 }

 async function handleSwapDecision(reqId, decision, approverClassId = ""){
  const targetReq = (swapRequestsRef.current || []).find(r => r.id === reqId);
  if(!targetReq) return;

  const myName = cleanMasterLabel(currentUser?.name || data.profile.teacher || "교사");
  const isAdminRole = ["master","subadmin"].includes(currentUser?.role);

  // 권한 검증: 영구 교체(perm_swap)는 반드시 마스터/중간관리자만 승인 가능, 일시교체/보강은 당사자 교사끼리 승인 가능
  if(targetReq.type === "perm_swap" && !isAdminRole){
   notify("정규 시간표가 변경되는 '영구 수업 교체'는 마스터 또는 학교 관리자만 승인할 수 있습니다.");
   return;
  }
  if(targetReq.type !== "perm_swap" && targetReq.toTeacher !== myName && !isAdminRole){
   notify(`이 요청은 상대 선생님(${targetReq.toTeacher})이 직접 승인하실 수 있습니다.`);
   return;
  }

  const targetSlotClass = approverClassId ? resolveClassInfo(approverClassId, data) : null;
  const updatedReq = {
   ...targetReq,
   status: decision,
   approvedBy: myName,
   approvedAt: new Date().toISOString(),
   ...(targetSlotClass ? {
    toClassId: targetSlotClass.id,
    toClassName: targetSlotClass.name,
    toStudents: targetSlotClass.students
   } : {})
  };

  const nextList = (swapRequestsRef.current || []).map(r => r.id === reqId ? updatedReq : r);
  swapRequestsRef.current = nextList;
  setSwapRequests(nextList);

  // 영구 교체(perm_swap)가 정식 승인된 경우: 학교 공용 마스터 시간표(schoolMasterData.teachers)에도 영구 반영
  let nextMasterData = live.current.schoolMasterData;
  if(decision === "approved" && updatedReq.type === "perm_swap" && isObj(nextMasterData?.teachers)){
   const nextTeachers = { ...nextMasterData.teachers };
   const fromT = updatedReq.fromTeacher;
   const toT = updatedReq.toTeacher;
   if(Array.isArray(nextTeachers[fromT]) || Array.isArray(nextTeachers[toT])){
    const fromSlots = [...(nextTeachers[fromT] || [])];
    const toSlots = [...(nextTeachers[toT] || [])];
    const fIdx = fromSlots.findIndex(s => s.day === updatedReq.fromDay && Number(s.period) === Number(updatedReq.fromPeriod));
    const tIdx = toSlots.findIndex(s => s.day === updatedReq.toDay && Number(s.period) === Number(updatedReq.toPeriod));
    const fSlotObj = fIdx >= 0 ? { ...fromSlots[fIdx] } : { day: updatedReq.fromDay, period: Number(updatedReq.fromPeriod), subject: updatedReq.fromClassName, room: "" };
    const tSlotObj = tIdx >= 0 ? { ...toSlots[tIdx] } : { day: updatedReq.toDay, period: Number(updatedReq.toPeriod), subject: updatedReq.toClassName, room: "" };

    if(fIdx >= 0) fromSlots[fIdx] = { ...tSlotObj, day: updatedReq.fromDay, period: Number(updatedReq.fromPeriod) };
    else fromSlots.push({ ...tSlotObj, day: updatedReq.fromDay, period: Number(updatedReq.fromPeriod) });

    if(tIdx >= 0) toSlots[tIdx] = { ...fSlotObj, day: updatedReq.toDay, period: Number(updatedReq.toPeriod) };
    else toSlots.push({ ...fSlotObj, day: updatedReq.toDay, period: Number(updatedReq.toPeriod) });

    nextTeachers[fromT] = fromSlots;
    nextTeachers[toT] = toSlots;
    nextMasterData = { ...nextMasterData, teachers: nextTeachers, updatedAt: new Date().toISOString() };
    update(d => ({ ...d, schoolMasterData: nextMasterData }));
   }
  }

  await pushSharedSchoolRoster({ swapRequests: nextList, schoolMasterData: nextMasterData });
  await pullSharedSchoolRoster(true);
 }

 // 교사 계정 및 다중 학교 목록 불러오기
 async function loadAccountsChannel(){
  const cfg = getSupabaseClientConfig();
  try {
   const r = await rpc(cfg, "read", { p_code: AUTH_ACCOUNTS_CHANNEL_CODE });
   const rawList = Array.isArray(r.data?.accounts) ? r.data.accounts : [];
   const rawSchools = Array.isArray(r.data?.schools) && r.data.schools.length ? r.data.schools : DEFAULT_SCHOOLS;
   let dirty = false;
   const list = rawList.map(a => {
    const cleanedName = cleanMasterLabel(a.name);
    const school = isText(a.school) && a.school.trim() ? a.school.trim() : "광영고등학교";
    if(cleanedName !== a.name || school !== a.school){ dirty = true; return { ...a, name: cleanedName, school }; }
    return a;
   });
   const mergedSchools = Array.from(new Set([...DEFAULT_SCHOOLS, ...rawSchools, ...list.map(a=>a.school).filter(Boolean)]));
   setAccountsList(list);
   setSchoolsList(mergedSchools);
   if(dirty){
    try { await rpc(cfg, "write", { p_code: AUTH_ACCOUNTS_CHANNEL_CODE, p_version: r.version, p_data: { accounts: list, schools: mergedSchools } }); } catch {}
   }
   return { version: r.version, accounts: list, schools: mergedSchools };
  } catch {
   const defaultMasterPassHash = await sha256Hex("admin1234!");
   const masterRoomCode = await sha256Hex("gyomusil-personal-room-admin-master");
   const seed = [{
    username: "admin",
    name: "마스터",
    school: "광영고등학교",
    email: "",
    passwordHash: defaultMasterPassHash,
    role: "master",
    approved: true,
    roomCode: masterRoomCode,
    grade: 1,
    classroom: 6,
    createdAt: new Date().toISOString()
   }];
   try {
    await rpc(cfg, "create", { p_code: AUTH_ACCOUNTS_CHANNEL_CODE, p_data: { accounts: seed, schools: DEFAULT_SCHOOLS } });
   } catch {}
   setAccountsList(seed);
   setSchoolsList(DEFAULT_SCHOOLS);
   return { version: 1, accounts: seed, schools: DEFAULT_SCHOOLS };
  }
 }

 // 계정 채널 및 학교 목록 저장 (충돌 시 자동 재시도 보강)
 async function saveAccountsChannel(nextAccounts, prevVersion, nextSchoolsOverride = null){
  const cfg = getSupabaseClientConfig();
  const sanitized = nextAccounts.map(a => ({ ...a, name: cleanMasterLabel(a.name), school: isText(a.school)&&a.school.trim()?a.school.trim():"광영고등학교" }));
  const nextSchools = Array.from(new Set([...DEFAULT_SCHOOLS, ...(nextSchoolsOverride || schoolsList), ...sanitized.map(a=>a.school)]));
  for(let attempt = 0; attempt < 3; attempt++){
   try {
    const cur = await rpc(cfg, "read", { p_code: AUTH_ACCOUNTS_CHANNEL_CODE });
    const w = await rpc(cfg, "write", { p_code: AUTH_ACCOUNTS_CHANNEL_CODE, p_version: cur.version || prevVersion || 1, p_data: { accounts: sanitized, schools: nextSchools } });
    if(w?.conflict){
     await new Promise(res => setTimeout(res, 150 * (attempt + 1)));
     continue;
    }
    break;
   } catch {
    await rpc(cfg, "create", { p_code: AUTH_ACCOUNTS_CHANNEL_CODE, p_data: { accounts: sanitized, schools: nextSchools } });
    break;

 // [4번 기능] 수능·모의고사 기출 PDF 업로드 및 AI 지문·문항 세트 자동 분해 추출
 async function readQuestionBankPDF(file){
  if(!file) return;
  try {
   if(file.size > 15 * 1024 * 1024) throw Error("기출 PDF는 15MB 이하만 지원합니다.");
   const bytes = new Uint8Array(await file.arrayBuffer());
   let binary = "";
   for(let i = 0; i < bytes.length; i += 32768) binary += String.fromCharCode(...bytes.subarray(i, i + 32768));
   setQbPdf({ name: file.name, base64: btoa(binary) });
   notify(`[${file.name}] 기출 PDF를 준비했습니다. 아래 [AI 기출 지문·문항 자동 추출] 버튼을 눌러주세요.`);
  } catch(e) {
   setError(e.message);
  }
 }

 // qbPdf 전용 Gemini Vision 직접 호출로 기출 세트 추출 및 학교 공용 문제은행/구글 드라이브 저장
 function runExtractQuestionBankPDF(){

   const chosen = models.find(m => m.id === model);
   const gen = {
    temperature: 0.15,
    maxOutputTokens: chosen?.outputLimit ? Math.min(16000, chosen.outputLimit) : 16000,
    responseMimeType: "application/json",
    responseSchema: responseSchema(TEMPLATES.examSet)
   };
   if(model === "gemini-2.5-flash") gen.thinkingConfig = { thinkingBudget: 0 };

   const prompt = `당신은 한국 수능 및 평가원·교육청 모의고사 기출문제 DB 구축 전문가입니다.
첨부된 기출 PDF에서 지문 세트와 문항들을 정밀하게 분해하여 추출하세요.
- 기본 정보: 연도(${qbMeta.year}), 시험명(${qbMeta.examType}), 대상학년(${qbMeta.grade}), 교과(${qbMeta.subject}), 기본영역(${qbMeta.defaultCategory})
- 국어(독서)는 category를 [인문, 사회, 과학, 기술, 예술, 주제통합] 중에서 자동 판별해 태깅하세요.
- 국어(문학)는 category를 [현대시, 고전시가, 현대소설, 고전소설, 극·수필, 갈래복합] 중에서 자동 판별해 태깅하세요.
- 윤리(생활과 윤리, 윤리와 사상)는 category를 단원 핵심 주제로 태깅하세요.
- 지문 공유형 세트 문제는 passage에 지문 전문을 그대로 보존하고 items 배열에 소속 문항들을 모두 담으세요.
- <보기>나 박스 제시문이 있으면 box 필드에 담고, 5지선다 선택지(options 5개), 정답 번호(answer 1~5), 난이도(상/중/하), 상세 해설(explanation)을 빠짐없이 작성하세요.`;

   const parts = [

   const raw = v.candidates?.[0]?.content?.parts?.filter(p => isText(p.text) && !p.thought).map(p => p.text).join("") || "";
   const parsed = JSON.parse(raw.slice(raw.indexOf("{"), raw.lastIndexOf("}") + 1));

   const newSets = parsed.sets.map((s, idx) => ({

 // [4번 기능] 이미 출력한 문제는 자동으로 제외(비중복)하고 랜덤 시험지를 조합하는 함수
 function generateNonDuplicateExamPaper(){
  const allSets = data.questionBank?.sets || [];
  const usedList = data.questionBank?.usedHistory?.[qbFilter.targetKey] || [];
  const usedSet = new Set(usedList);
  const manualSet = new Set(qbFilter.includeManualIds || []);

  // 1) 수동으로 반드시 포함하도록 체크한 지문 세트
  const forcedSets = allSets.filter(s => manualSet.has(s.id));

  // 2) 조건에 맞는 후보 풀 필터링 (기출제 제외 옵션이 켜져 있으면 usedSet에 없는 문제만 추출)
  const candidatePool = allSets.filter(s => {
   if(manualSet.has(s.id)) return false;
   if(qbFilter.subject !== "전체" && s.subject !== qbFilter.subject) return false;
   if(qbFilter.categories.length > 0 && !qbFilter.categories.includes(s.category)) return false;
   if(qbFilter.excludeUsed && usedSet.has(s.id)) return false;
   return true;
  });

  // 3) 피셔-예이츠 랜덤 셔플
  const shuffled = [...candidatePool];
  for(let i = shuffled.length - 1; i > 0; i--){
   const j = Math.floor(Math.random() * (i + 1));
   [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }

  const needCount = Math.max(0, (Number(qbFilter.setCount) || 2) - forcedSets.length);
  const pickedSets = [...forcedSets, ...shuffled.slice(0, needCount)];

  if(!pickedSets.length){
   notify("조건에 맞는 미출제 문제가 없습니다! 기출제 제외 옵션을 끄거나 출제 이력을 리셋해 주세요.");
   return;
  }

  setGeneratedPaper({
   id: "paper-" + uid(),
   title: qbFilter.paperTitle || `${qbFilter.subject} 실전 기출 모의고사`,
   subject: qbFilter.subject,
   targetClass: qbFilter.targetKey,
   sets: pickedSets,
   createdAt: day(),
   confirmedUsed: false
  });
  notify(`미출제 문제 풀에서 중복 없이 총 ${pickedSets.length}개 세트(${pickedSets.reduce((a,b)=>a+b.items.length,0)}문항)를 랜덤 추출했습니다!`);
 }

 // 시험지 인쇄 확정 시 출제 이력(usedHistory)에 기록하여 다음번 추출 시 중복 방지
 function confirmAndMarkPaperUsed(printMode = "student"){
  if(!generatedPaper) return;
  const targetKey = generatedPaper.targetClass || qbFilter.targetKey || "우리반 (기본)";
  const pickedIds = generatedPaper.sets.map(s => s.id);
  update(d => {
   const prevUsed = d.questionBank?.usedHistory?.[targetKey] || [];
   const nextUsed = Array.from(new Set([...prevUsed, ...pickedIds]));
   return {
    ...d,
    questionBank: {
     ...(d.questionBank || { sets: [] }),
     usedHistory: {
      ...(d.questionBank?.usedHistory || {}),
      [targetKey]: nextUsed
     }
    }
   };
  });
  setGeneratedPaper(prev => prev ? { ...prev, confirmedUsed: true } : prev);
  if(printMode){
   print(buildExamPaperHTML(generatedPaper, data.profile.school, printMode));
  }
  notify(`[${targetKey}] 출제 완료 이력에 ${pickedIds.length}개 세트를 기록했습니다. 다음 랜덤 추출부터 자동 제외됩니다!`);
 }

   if(idx === -1) throw Error("입력하신 아이디와 이메일 주소가 일치하는 교사 계정을 찾을 수 없습니다.");

   const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789!@#";
   const randBytes = new Uint8Array(10);
   crypto.getRandomValues(randBytes);
   const tempPassword = Array.from(randBytes, b => chars[b % chars.length]).join("");
   const newHash = await sha256Hex(tempPassword);

   const nextAccounts = accounts.map((a, i) => i === idx ? { ...a, passwordHash: newHash } : a);
   await saveAccountsChannel(nextAccounts, version);

   const targetGas = (gasUrl || DEFAULT_GAS_URL).trim();
   let emailed = false;
   if(targetGas){
    try {
     const res = await fetch(targetGas, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
       action: "sendTempPassword",
       email: accounts[idx].email,
       name: accounts[idx].name,
       username: accounts[idx].username,
       tempPassword
      }),
      redirect: "follow"
     });
     if(res.ok) emailed = true;
    } catch {}
   }
   setAuthMode("login");
   setAuthNotice(emailed
    ? `[${accounts[idx].email}] 메일로 무작위 임시 비밀번호를 발송했습니다! 메일함을 확인해 로그인하세요.`
    : `이메일 서버 응답 지연으로 화면에 임시 비밀번호를 안내합니다: [ ${tempPassword} ] 복사 후 로그인하세요.`);
  } catch(err) {
   setAuthError(err.message);
  } finally {
   setAuthBusy(false);
  }
 }

 function sanitizeNewsContent(raw, fallbackDate) {
  const c = isObj(raw?.content) ? raw.content : (isObj(raw) ? raw : {});

  const paragraphs = (rawParas.length ? rawParas : ["본문 문단 내용을 확인하세요."]).slice(0, 5);
  const pLen = paragraphs.length;
  const rawNotes = Array.isArray(c.paragraphNotes) ? c.paragraphNotes.map(x => str(x, "")).filter(Boolean) : [];
  const paragraphNotes = Array.from({ length: pLen }, (_, i) => rawNotes[i] || `${i + 1}문단 핵심 중심 생각`);
  const vocabRaw = Array.isArray(c.vocabulary) ? c.vocabulary : [];
  const vocabulary = vocabRaw.map((w, i) => ({
   word: str(w?.word, `핵심어휘 ${i + 1}`),
   hanja: str(w?.hanja, "해당 없음"),
   part: str(w?.part, "명사"),

   example: str(w?.example, "실생활 적용 예시 문장")
  })).slice(0, 8);
  while (vocabulary.length < 4) {
   const idx = vocabulary.length + 1;
   vocabulary.push({ word: `보충어휘 ${idx}`, hanja: "해당 없음", part: "명사", definition: "지문에서 주요 개념어를 찾아 뜻을 적어 보세요.", context: "본문 문맥 참고", example: "예문을 직접 만들어 보세요." });
  }
  const mcqRaw = Array.isArray(c.multipleChoice) ? c.multipleChoice : [];
  const multipleChoice = [0, 1].map(i => {
   const q = mcqRaw[i] || {};
   const opts = Array.isArray(q.options) ? q.options.map((o, j) => str(o, `선택지 ${j + 1}`)) : [];
   while (opts.length < 4) opts.push(`선택지 ${opts.length + 1}`);
   const ans = Number(q.answer);
   return {

 async function fetchFromDrive(silent = false) {
  const targetUrl = gasUrl.trim();
  if(!targetUrl) {
   if(!silent) { setShowDriveConfig(true); setError("구글 앱스 스크립트 웹 앱 URL을 먼저 입력해 주세요."); }
   return;
  }
  setBusy("구글 드라이브 '문해력_창고' 폴더에서 활동지를 동기화하는 중입니다...");
  setError("");
  try {
   const sep = targetUrl.includes("?") ? "&" : "?";
   const r = await fetch(`${targetUrl}${sep}t=${Date.now()}`, { method: "GET", redirect: "follow" });
   if(!r.ok) throw Error(`서버 응답 오류 (HTTP ${r.status})`);
   const v = await r.json();
   if(v.error) throw Error(v.error);
   if(!Array.isArray(v.items)) throw Error("올바른 활동지 목록 형식(items 배열)이 아닙니다.");

   const existingMap = new Map((live.current.liveLiteracy?.items || []).map(x => [x.id, x]));
   const parsedItems = [];

   for(const item of v.items) {
    if(!isObj(item)) continue;
    const rawName = String(item.name || "").replace(/\.json$/i, "").trim();
    const parts = rawName.split("_").map(s => s.trim());

    let itemDate = day();
    const dateMatch = (parts[0] || "").match(/^(\d{4})[-.]?(\d{2})[-.]?(\d{2})$/);
    if(dateMatch) {
     const dStr = `${dateMatch[1]}-${dateMatch[2]}-${dateMatch[3]}`;
     if(validDate(dStr)) itemDate = dStr;
    } else if(validDate(item.date)) {
     itemDate = item.date;
    } else if(validDate(item.content?.articleDate)) {
     itemDate = item.content.articleDate;
    }

    const foundLevel = parts.find(p => LEVELS.includes(p)) || (LEVELS.includes(item.level) ? item.level : (LEVELS.includes(item.content?.level) ? item.content.level : "고등"));
    const foundCat = parts.find(p => CATEGORIES.includes(p)) || item.category || item.content?.category || parts[3] || "사회";

    const cleanContent = sanitizeNewsContent(item.content || item, itemDate);
    if(parts[1] && cleanContent.title === "시사 문해력 탐구 활동지") cleanContent.title = parts[1];
    if(!valid("news", cleanContent)) continue;

    const id = String(item.id || rawName || uid());
    const prev = existingMap.get(id);
    const rawSources = Array.isArray(item.sources) ? item.sources : (Array.isArray(item.content?.sources) ? item.content.sources : []);
    const cleanSources = rawSources.filter(s => isObj(s) && safeURL(s.url)).map(s => ({ title: hasText(s.title) ? s.title : "원문·참고 링크", url: safeURL(s.url) }));

    parsedItems.push({
     id,
     fileName: item.name || `${itemDate}_${cleanContent.title}_${foundLevel}_${foundCat}.json`,
     date: itemDate,
     level: foundLevel,
     category: foundCat,
     range: { start: itemDate, end: itemDate },
     content: cleanContent,
     sources: cleanSources,
     checks: prev && Array.isArray(prev.checks) && prev.checks.length === 4 ? prev.checks : [false, false, false, false],
     model: item.model || "Gemini (문해력_창고 연동)"
    });
   }

   parsedItems.sort((a, b) => (b.date + b.fileName).localeCompare(a.date + a.fileName));
   update(d => ({ ...d, liveLiteracy: { items: parsedItems } }));
   localStorage.setItem("gyomusil-gas-url", targetUrl);
   setShowDriveConfig(false);
   if(!silent) notify(`'문해력_창고' 폴더에서 총 ${parsedItems.length}편의 활동지를 불러왔습니다.`);
  } catch(e) {
   if(!silent) setError("드라이브 연결 실패: " + e.message);
  } finally {
   setBusy("");
  }
 }

 function generateStudio(targetKind){

  if(kind!=="analysis"&&!lesson){setStep(1);setError("단원을 분석하고 차시를 선택하세요.");return;}

   }

 async function readPDF(file){
  if(!file)return;const id=++fileSeq.current;setFileBusy(true);setPdf(null);setPdfConsent(false);
  try{
   if(file.size>12*1024*1024)throw Error("PDF는 12MB 이하만 지원합니다.");
   const bytes=new Uint8Array(await file.arrayBuffer());if(!new TextDecoder().decode(bytes.slice(0,1024)).includes("%PDF-"))throw Error("유효한 PDF가 아닙니다.");
   let binary="";for(let i=0;i<bytes.length;i+=32768)binary+=String.fromCharCode(...bytes.subarray(i,i+32768));
   if(id===fileSeq.current)setPdf({name:file.name,base64:btoa(binary)});
  }catch(e){setError(e.message);}finally{if(id===fileSeq.current)setFileBusy(false);}
 }

 async function rpc(c,name,args){
  const a=new AbortController(),t=setTimeout(()=>a.abort(),20000);
  try{const r=await fetch(c.url+"/rest/v1/rpc/gyomusil_"+name,{method:"POST",headers:{apikey:c.key,"Content-Type":"application/json"},body:JSON.stringify(args),signal:a.signal});const v=await r.json();if(!r.ok)throw Error(v.message||"서버 설정을 확인하세요.");return v;}finally{clearTimeout(t);}
 }
 async function connect(create){
  if(cloudBusy||syncLock.current||aiLock.current)return;setCloudBusy(true);setCloudError("");
  try{
   const u=new URL(cloudURL.trim()),key=cloudKey.trim();
   if(u.protocol!=="https:"||!u.hostname.endsWith(".supabase.co"))throw Error("Supabase HTTPS 프로젝트 URL을 입력하세요.");
   if(!key||key.startsWith("sb_secret_"))throw Error("공개 키만 사용할 수 있습니다.");
   if(key.split(".").length===3){let claims;try{const p=key.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");claims=JSON.parse(atob(p.padEnd(Math.ceil(p.length/4)*4,"=")));}catch{}if(claims?.role==="service_role")throw Error("service_role 비밀 키는 사용하지 마세요.");}
   let secret=code.trim().toLowerCase();
   if(create){const b=new Uint8Array(32);crypto.getRandomValues(b);secret=Array.from(b,x=>x.toString(16).padStart(2,"0")).join("");}
   if(!/^[0-9a-f]{64}$/.test(secret))throw Error("64자리 연결 코드를 입력하세요.");
   if(!create&&!confirm("현재 기기 자료를 서버 자료로 바꿉니다. 백업했나요?"))return;
   const c={url:u.origin,key,code:secret,version:0,last:"",active:true};
   if(create){
    const serialized=JSON.stringify(live.current);if(new Blob([serialized]).size>2900000)throw Error("동기화 자료는 약 3MB 이하여야 합니다.");
    const r=await rpc(c,"create",{p_code:secret,p_data:live.current});c.version=r.version;c.last=serialized;
   }else{const r=await rpc(c,"read",{p_code:secret}),v=normalize(r.data);c.version=r.version;c.last=JSON.stringify(v);live.current=v;setData(v);}
   cloud.current=c;setConnected(true);setConflict(false);setCode(secret);setCloudStatus("연결됨 · 자동 동기화");
   try{localStorage.setItem("gyomusil-cloud-config",JSON.stringify({url:c.url,key}));}catch{}
  }catch(e){setCloudError(e.message);}finally{setCloudBusy(false);}
 }
 async function syncTick(){
  const c=cloud.current;if(!c?.active||c.conflict||syncLock.current||aiLock.current)return;syncLock.current=true;
  try{
   const serialized=JSON.stringify(live.current);
   if(serialized!==c.last){
    if(Date.now()-editTime.current<1200)return;
    if(new Blob([serialized]).size>2900000)throw Error("동기화 용량 초과입니다. 백업 후 자료를 줄이세요.");
    const r=await rpc(c,"write",{p_code:c.code,p_version:c.version,p_data:live.current});if(cloud.current!==c)return;
    if(r.conflict){c.conflict=true;setConflict(true);setCloudStatus("동시 수정 확인 필요");return;}c.version=r.version;c.last=serialized;
   }else{
    const r=await rpc(c,"read",{p_code:c.code});if(cloud.current!==c)return;
    if(r.version!==c.version){if(aiLock.current||JSON.stringify(live.current)!==c.last)return;const v=normalize(r.data);c.version=r.version;c.last=JSON.stringify(v);live.current=v;setData(v);}
   }
   setCloudStatus("개인 사물함 최신 연결됨");setCloudError("");
  }catch(e){if(cloud.current===c){setCloudStatus("연결 확인 필요 · 로컬 보관");setCloudError(e.message);}}
  finally{syncLock.current=false;}
 }
 async function resolveConflict(){
  const c=cloud.current;if(!c||cloudBusy||aiLock.current)return;
  if(!confirm("내 자료를 백업한 뒤 서버 최신 자료로 교체할까요?"))return;setCloudBusy(true);
  try{download("교무실_충돌전_백업.json",JSON.stringify(live.current,null,2),"application/json");const r=await rpc(c,"read",{p_code:c.code}),v=normalize(r.data);if(cloud.current!==c)return;c.version=r.version;c.last=JSON.stringify(v);c.conflict=false;live.current=v;setData(v);setConflict(false);setCloudStatus("서버 자료로 갱신됨");}

     {classTab==="📍 이동수업 실시간 위치" && data.profile.homeroom && (()=>{

      const myDept = `${data.profile.grade}-${data.profile.classroom}`;
      const dayNames = ["일","월","화","수","목","금","토"];
      const selDateObj = validDate(attDate) ? new Date(attDate+"T12:00:00Z") : new Date();
      const selDayName = dayNames[selDateObj.getDay()];
      const curKey = `${selDayName}-${activePeriod}`;

      // 학급별 시간표(classTimetables)에 현재 요일·교시에 배정된 과목이 있으면 그 과목의 타임 알파벳(A~M)을 자동 추론
      const classSlotInfo = data.schoolMasterData?.classTimetables?.[myDept]?.[curKey];
      const inferredSlotFromTimetable = (()=>{
       if(!classSlotInfo?.subject) return "";
       const m = String(classSlotInfo.subject).replace(/\(원\)/g,"").trim().match(/([A-N])0?$/i);
       return m ? m[1].toUpperCase() : "";
      })();
      const availableHeaders = (em.headers && em.headers.length > 0) ? em.headers : ["A","B","C","D"];
      const activeSlot = em.periodSlotMap?.[curKey] || (inferredSlotFromTimetable && availableHeaders.includes(inferredSlotFromTimetable) ? inferredSlotFromTimetable : availableHeaders[0]);

      // 우리 반 학생 명렬을 기준으로 각 학생의 현재 교시 이동수업 과목·장소·담당교사·실시간 출결 상태를 결합

      const homeroomTodayAtt = data.attendance?.[attDate] || {};
      const elRoomsMap = data.schoolMasterData?.electiveRooms || {};
      const masterTeachersMap = data.schoolMasterData?.teachers || {};

      // 과목명으로 담당 교사와 수업 장소를 찾는 헬퍼
      const findCourseMeta = (subjName) => {
       if(!subjName || subjName === "-" || /본반|공강|자습/.test(subjName)){
        return { subject: classSlotInfo?.subject || "본반 수업", room: myDept, teacher: classSlotInfo?.teacher || data.profile.teacher || "담임" };
       }
       const normTarget = cleanElectiveSubjToken(subjName).replace(/([A-Z])0$/i, "$1");
       let foundTeacher = "";
       let foundRoom = resolveElectiveRoomOverride(subjName, "", "", elRoomsMap);

       for(const [tName, slots] of Object.entries(masterTeachersMap)){
        const matchedSlot = (slots || []).find(s => {
         const normS = cleanElectiveSubjToken(s.subject).replace(/([A-Z])0$/i, "$1");
         return normS === normTarget && (s.day === selDayName && Number(s.period) === Number(activePeriod));
        }) || (slots || []).find(s => cleanElectiveSubjToken(s.subject).replace(/([A-Z])0$/i, "$1") === normTarget);
        if(matchedSlot){
         foundTeacher = tName;
         if(!foundRoom && matchedSlot.room) foundRoom = matchedSlot.room;
         break;
        }
       }
       if(!foundRoom && foundTeacher){
        foundRoom = resolveElectiveRoomOverride(subjName, foundTeacher, "", elRoomsMap);
       }
       return {
        subject: subjName,
        room: foundRoom || "장소 미지정",
        teacher: foundTeacher || "담당교사"
       };
      };

      const studentMovementList = (data.students || []).map(st => {
       const mxRow = (em.rows || []).find(r => r.dept === myDept && (r.name === st.name || Number(r.number) === Number(st.number)));
       const rawChoice = mxRow?.choices?.[activeSlot] || mxRow?.choices?.[`${activeSlot}타임`] || "";
       const meta = findCourseMeta(rawChoice);

       // 실시간 교과 출결 조회
       const sharedRec = sharedPeriodMap[`${myDept}|${st.name}`];
       let periodStatus = sharedRec?.status || data.classAttendance?.homeroom?.[localPeriodKey]?.[st.id] || "";
       let recordedBy = sharedRec?.teacher || "";

        for(const cls of (data.subjectClasses || []).filter(c => c.id !== "homeroom")){

         if(mStu){
          const stVal = data.classAttendance?.[cls.id]?.[localPeriodKey]?.[mStu.id];

        periodStatus: periodStatus || "미체크",
        hrStatus,
        recordedBy

        </tr>
       `).join("");
       return printDocument(`${className} 이동수업 위치 분산표`, `<section class="doc">
        <div>
         <p class="small" style="font-weight:700">고교학점제 · 선택과목 이동수업 및 실시간 출결 현황표</p>
         <h1>${esc(className)} 이동수업 교실별 분산표 (${activePeriod}교시 · ${esc(activeSlot)}타임)</h1>

    {classTab==="🪑 자리배치·모둠" && (()=>{
     const st = data.seating || {};
     const students = data.students || [];
     const totalSeats = Math.max(students.length, Number(st.totalSeats) || students.length || 12);
     const pairMode = st.pairMode || "pair"; // "pair"(2명씩 짝꿍), "single"(짝 없이 1인 1열), "group4"(4인 모둠)
     const pairBundan = Number(st.pairBundan) || 3; // 짝꿍 모드일 때 분단 수 (1분단=2열)
     const singleCols = Number(st.singleCols) || 5; // 1인 1열 모드일 때 가로 열 수
     const cols = pairMode === "pair" ? pairBundan * 2 : pairMode === "group4" ? 4 : singleCols;
     const frontMaxRow = Number(st.frontMaxRow) || 1; // 앞자리 배려 줄 수 (1줄 또는 2줄)
     const frontRules = isObj(st.frontRules) ? st.frontRules : {}; // { [studentId]: "center" | "side" | "any" }

     // 좌석 인덱스(0 ~ totalSeats-1)가 중앙 앞자리인지, 사이드 앞자리인지 판별
     const isCenterCol = c => {
      if(cols <= 2) return true;
      return c > 0 && c < cols - 1;
     };
     const isSideCol = c => c === 0 || c === cols - 1;

     const shuffle = arr => {
      const a = [...arr];
      for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
      return a;
     };

     const shuffleSeats = () => {
      const avoidRules = (st.avoidPairs||"").split(",").map(p=>p.trim().split(/[-~·/\s]+/).map(x=>x.trim()).filter(Boolean)).filter(p=>p.length>=2);

      const centerFrontStus = students.filter(s => frontRules[s.id] === "center");
      const sideFrontStus = students.filter(s => frontRules[s.id] === "side");
      const anyFrontStus = students.filter(s => frontRules[s.id] === "any");
      const normalStus = students.filter(s => !frontRules[s.id]);

      let bestSeats = Array(totalSeats).fill(null);

      for(let attempt=0; attempt<60; attempt++){
       const candidate = Array(totalSeats).fill(null);
       const frontCenterIdxs = [];
       const frontSideIdxs = [];
       const otherIdxs = [];

       for(let idx=0; idx<totalSeats; idx++){
        const r = Math.floor(idx / cols);
        const c = idx % cols;
        if(r < frontMaxRow){
         if(isSideCol(c)) frontSideIdxs.push(idx);
         else if(isCenterCol(c)) frontCenterIdxs.push(idx);
        } else {
         otherIdxs.push(idx);
        }
       }

       const sCenter = shuffle(frontCenterIdxs);
       const sSide = shuffle(frontSideIdxs);
       const usedIdxs = new Set();

       // 1) 중앙 앞자리 배정
       shuffle(centerFrontStus).forEach(stu => {
        const target = sCenter.find(i => !usedIdxs.has(i)) ?? sSide.find(i => !usedIdxs.has(i));
        if(target !== undefined){ candidate[target] = stu; usedIdxs.add(target); }
       });
       // 2) 사이드(양끝) 앞자리 배정
       shuffle(sideFrontStus).forEach(stu => {
        const target = sSide.find(i => !usedIdxs.has(i)) ?? sCenter.find(i => !usedIdxs.has(i));
        if(target !== undefined){ candidate[target] = stu; usedIdxs.add(target); }
       });
       // 3) 앞자리(위치 무관) 배정
       const remainFront = shuffle([...sCenter, ...sSide].filter(i => !usedIdxs.has(i)));
       shuffle(anyFrontStus).forEach(stu => {
        const target = remainFront.find(i => !usedIdxs.has(i));
        if(target !== undefined){ candidate[target] = stu; usedIdxs.add(target); }
       });
       // 4) 아직 배정 못 받은 앞자리 희망자 + 일반 학생을 남은 앞자리부터 차례로 배정
       const placedIds = new Set(candidate.filter(Boolean).map(s=>s.id));
       const unplacedFront = [...centerFrontStus, ...sideFrontStus, ...anyFrontStus].filter(s=>!placedIds.has(s.id));
       const allRemainingPool = [...shuffle(unplacedFront), ...shuffle(normalStus)];

       const restSeatIdxs = [];
       for(let idx=0; idx<totalSeats; idx++){
        if(!usedIdxs.has(idx)) restSeatIdxs.push(idx);
       }
       // 앞쪽 빈자리를 먼저 채우되, 일반 학생은 무작위로 앉힘
       const activeSeatIdxs = restSeatIdxs.slice(0, allRemainingPool.length);
       const shuffledActiveIdxs = shuffle(activeSeatIdxs);
       allRemainingPool.forEach((stu, i) => {
        const seatIdx = shuffledActiveIdxs[i];
        if(seatIdx !== undefined) candidate[seatIdx] = stu;
       });

       // 기피 학생 인접 검사
       const violated = avoidRules.some(([n1,n2]) => {
        const idx1 = candidate.findIndex(s=>s && (s.name===n1 || String(s.number)===n1));
        const idx2 = candidate.findIndex(s=>s && (s.name===n2 || String(s.number)===n2));
        if(idx1===-1 || idx2===-1) return false;
        const r1 = Math.floor(idx1 / cols), c1 = idx1 % cols;
        const r2 = Math.floor(idx2 / cols), c2 = idx2 % cols;
        return Math.abs(r1-r2)<=1 && Math.abs(c1-c2)<=1;
       });

       bestSeats = candidate;
       if(!violated) break;
      }

      update(d=>({...d,seating:{...st,totalSeats,pairMode,pairBundan,singleCols,frontMaxRow,frontRules,arrangement:bestSeats.map(s=>s?s.id:"")}}));
      notify("짝꿍/단독 설정 및 앞자리(중앙·사이드·줄수)·분리 조건을 반영하여 자리를 배치했습니다!");
     };

     // 현재 좌석 배열 구성
     const seatList = Array.from({length:totalSeats}, (_, idx) => {
      if(Array.isArray(st.arrangement) && st.arrangement.length > 0){
       const id = st.arrangement[idx];
       return id ? students.find(s=>s.id===id) || null : null;
      }
      return students[idx] || null;
     });

     const rows = [];
     for(let i=0; i<seatList.length; i+=cols) rows.push(seatList.slice(i, i+cols));
     const displayRows = st.teacherView ? [...rows].reverse().map(r=>[...r].reverse()) : rows;

     const ruleBadge = stuId => {
      const r = frontRules[stuId];
      if(r === "center") return "🎯중앙앞줄";
      if(r === "side") return "📐사이드앞줄";
      if(r === "any") return "✨앞줄배려";
      return "";
     };

     const printSeatHTML = () => {
      const tableRows = displayRows.map(r => `<tr>${Array.from({length:cols},(_,ci)=>{
       const stu = r[ci];
       const isAisleRight = pairMode==="pair" && ci%2===1 && ci<cols-1;
       return `<td style="height:82px;text-align:center;font-size:12.5pt;border:2px solid #333;background:#fff;${isAisleRight?"border-right:10px solid #e2e8f0;":""}">${stu?`<span style="font-size:9pt;color:#555">${stu.number}번</span><br><strong>${esc(stu.name)}</strong>`:"<span style='color:#bbb;font-size:9pt'>(빈 좌석)</span>"}</td>`;
      }).join("")}</tr>`).join("");
      return printDocument(`${className} 자리배치표`, `<section class="doc">
       <div>
        <p class="small" style="font-weight:700">${esc(data.profile.school)} · ${esc(className)} (${pairMode==="pair"?`2인 짝꿍형 ${pairBundan}분단`:pairMode==="group4"?"4인 모둠형":`1인 독립 ${singleCols}열`} · ${st.teacherView?"교탁에서 바라본 시점":"학생이 칠판을 바라본 시점"})</p>
        <h1>${esc(className)} 학급 자리 배치표</h1>
        ${!st.teacherView?`<div style="margin:14px auto 22px auto;width:60%;padding:12px;border:2px solid #222;background:#eaeaea;text-align:center;font-weight:800;font-size:13pt">칠 판 / 교 탁 (앞)</div>`:""}
        <table style="border-spacing:6px;border-collapse:separate">${tableRows}</table>
        ${st.teacherView?`<div style="margin:22px auto 14px auto;width:60%;padding:12px;border:2px solid #222;background:#eaeaea;text-align:center;font-weight:800;font-size:13pt">교 탁 / 칠 판 (교사 시점 기준 앞)</div>`:""}
       </div>
       <p class="small" style="text-align:right">시행일: ${esc(dateLabel(day()))} · 재적: ${students.length}명 (총 좌석 ${totalSeats}석) · 담임교사: ${esc(data.profile.teacher||"")}</p>
      </section>`);
     };

     return <div className="grid items-start gap-5 xl:grid-cols-[minmax(0,1fr)_390px]">

             const val = e.target.value;
             const next = {...frontRules};

             else next[s.id] = val;
             update(d=>({...d,seating:{...st,frontRules:next}}));
            }}
           >

    {classTab==="🧹 1인1역·청소순환" && (()=>{
     const rc = data.rolesClean || {roles:[],zones:[],rotationOffset:0,lastRotated:day()};
     const students = data.students || [];

     const shuffle = arr => {
      const a = [...arr];
      for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
      return a;
     };

     // 1인 1역할: 고정(🔒)된 학생은 유지하고 나머지 역할만 랜덤 배정
     const shuffleRolesWithLock = () => {
      const lockedStuIds = new Set((rc.roles||[]).filter(r=>r.locked && r.studentId).map(r=>r.studentId));
      const availablePool = shuffle(students.filter(s => !lockedStuIds.has(s.id)));
      let poolIdx = 0;
      const nextRoles = (rc.roles||[]).map(r => {
       if(r.locked && r.studentId) return r;
       const picked = availablePool[poolIdx % Math.max(1, availablePool.length)];
       poolIdx++;
       return {...r, studentId: picked?.id || ""};
      });
      update(d=>({...d,rolesClean:{...rc,roles:nextRoles}}));
      notify("🔒 고정된 역할 담당자는 유지하고, 나머지 1인 1역할을 랜덤으로 배정했습니다!");
     };

     // 청소구역별 현재 배정 명단 계산 (assignedIds가 있으면 우선 사용, 없으면 순환 오프셋 기반 초기 계산)
     const rotatedStudents = students.length
      ? students.map((_, idx) => students[(idx + (rc.rotationOffset||0)) % students.length])
      : [];

     let cursor = 0;
     const zoneAssignments = (rc.zones||[]).map(z => {
      const cnt = Number(z.count)||3;
      const lockedSet = new Set(Array.isArray(z.lockedIds) ? z.lockedIds : []);
      let assigned = [];
      if(Array.isArray(z.assignedIds) && z.assignedIds.length > 0){
       assigned = z.assignedIds.map(id => students.find(s=>s.id===id)).filter(Boolean);
      } else {
       assigned = rotatedStudents.slice(cursor, cursor + cnt);
       cursor += cnt;
      }
      return {...z, assigned, lockedSet};
     });
     if(cursor > 0 && cursor < rotatedStudents.length && zoneAssignments.length){
      zoneAssignments[zoneAssignments.length-1].assigned.push(...rotatedStudents.slice(cursor));
     }

     // 청소구역: 고정(🔒)된 학생은 해당 구역에 그대로 두고 나머지 학생만 랜덤 추첨
     const shuffleZonesWithLock = () => {
      const lockedMap = {};
      const allLockedIds = new Set();
      zoneAssignments.forEach(z => {
       const lockedList = (z.lockedIds||[]).filter(id => students.some(s=>s.id===id));
       lockedMap[z.id] = lockedList;
       lockedList.forEach(id => allLockedIds.add(id));
      });
      const freeStudents = shuffle(students.filter(s => !allLockedIds.has(s.id)));
      let fCursor = 0;
      const nextZones = (rc.zones||[]).map((z, idx) => {
       const targetCount = Number(z.count)||3;
       const keepIds = lockedMap[z.id] || [];
       const needMore = Math.max(0, targetCount - keepIds.length);
       const addedIds = freeStudents.slice(fCursor, fCursor + needMore).map(s=>s.id);
       fCursor += needMore;
       return {...z, assignedIds:[...keepIds, ...addedIds], lockedIds:keepIds};
      });
      if(fCursor < freeStudents.length && nextZones.length){
       const last = nextZones[nextZones.length-1];
       last.assignedIds = [...last.assignedIds, ...freeStudents.slice(fCursor).map(s=>s.id)];
      }
      update(d=>({...d,rolesClean:{...rc,zones:nextZones,lastRotated:day()}}));
      notify("🔒 고정된 청소 당번은 유지하고, 나머지 학생들을 청소구역에 랜덤 배정했습니다!");
     };

     // 청소구역: 고정(🔒)된 학생은 유지하고 나머지 학생들을 다음 구역으로 한 칸씩 순환
     const rotateZonesWithLock = () => {
      const allLockedIds = new Set();
      zoneAssignments.forEach(z => (z.lockedIds||[]).forEach(id => allLockedIds.add(id)));
      const nextOffset = ((rc.rotationOffset||0) + 2) % Math.max(1, students.length);
      const freeRotated = students
       .map((_, idx) => students[(idx + nextOffset) % students.length])
       .filter(s => !allLockedIds.has(s.id));

      let fCursor = 0;
      const nextZones = (rc.zones||[]).map(z => {
       const targetCount = Number(z.count)||3;
       const keepIds = (z.lockedIds||[]).filter(id => students.some(s=>s.id===id));
       const needMore = Math.max(0, targetCount - keepIds.length);
       const addedIds = freeRotated.slice(fCursor, fCursor + needMore).map(s=>s.id);
       fCursor += needMore;
       return {...z, assignedIds:[...keepIds, ...addedIds], lockedIds:keepIds};
      });
      if(fCursor < freeRotated.length && nextZones.length){
       const last = nextZones[nextZones.length-1];
       last.assignedIds = [...last.assignedIds, ...freeRotated.slice(fCursor).map(s=>s.id)];
      }
      update(d=>({...d,rolesClean:{...rc,zones:nextZones,rotationOffset:nextOffset,lastRotated:day()}}));
      notify("🔒 고정된 학생을 제외하고 다음 주 청소구역을 순환 배정했습니다!");
     };

     const toggleZoneStudentLock = (zoneIdx, stuId) => {
      const nextZones = zoneAssignments.map((z, i) => {
       if(i !== zoneIdx) return {id:z.id, name:z.name, count:z.count, assignedIds:z.assigned.map(s=>s.id), lockedIds:z.lockedIds||[]};
       const curLocks = Array.isArray(z.lockedIds) ? z.lockedIds : [];
       const nextLocks = curLocks.includes(stuId) ? curLocks.filter(id=>id!==stuId) : [...curLocks, stuId];
       return {id:z.id, name:z.name, count:z.count, assignedIds:z.assigned.map(s=>s.id), lockedIds:nextLocks};
      });
      update(d=>({...d,rolesClean:{...rc,zones:nextZones}}));
     };

     const printRolesCleanHTML = () => {
      const roleRows = (rc.roles||[]).map((r,i)=>{
       const stu = students.find(s=>s.id===r.studentId) || students[i];
       return `<tr><td style="text-align:center;width:12%">${i+1}</td><td style="font-weight:700;width:28%">${esc(r.role)}</td><td style="text-align:center;width:22%">${stu?`${stu.number}번 ${esc(stu.name)}${r.locked?" (고정)":""}`:"미배정"}</td><td>${esc(r.desc||"")}</td></tr>`;
      }).join("");
      const zoneRows = zoneAssignments.map(z=>`<tr><th style="width:28%">${esc(z.name)} (${z.assigned.length}명)</th><td>${z.assigned.map(s=>`${s.number}번 ${esc(s.name)}${z.lockedSet.has(s.id)?"(고정)":""}`).join(", &nbsp; ")}</td></tr>`).join("");
      return printDocument(`${className} 1인1역할 및 청소구역 배정표`, `<section class="doc">
       <div>
        <p class="small" style="font-weight:700">${esc(data.profile.school)} · ${esc(className)} 학급 자치 운영표</p>
        <h1>${esc(className)} 1인 1역할 및 청소구역 배정표</h1>
        <div class="meta">적용 기준일: ${esc(dateLabel(rc.lastRotated||day()))} · 순환 회차: ${(rc.rotationOffset||0)+1}주차 적용</div>
        <h2>1. 학급 1인 1역할 분담표</h2>
        <table><thead><tr><th style="width:12%">연번</th><th style="width:28%">역할명</th><th style="width:22%">담당 학생</th><th>세부 실천 내용</th></tr></thead><tbody>${roleRows}</tbody></table>
        <h2>2. 주간 청소구역 배정표</h2>
        <table><thead><tr><th style="width:28%">청소 구역명</th><th>담당 학생 명단</th></tr></thead><tbody>${zoneRows}</tbody></table>
       </div>
       <p class="small" style="text-align:right">담임교사: ${esc(data.profile.teacher||"")} (확인)</p>
      </section>`);
     };

     return <div className="space-y-6">
      <div className="grid gap-5 xl:grid-cols-2">
       {/* 좌측: 1인 1역할 사전 세팅 · 개별 고정(🔒) · 랜덤 돌리기 */}
       <section className={`${PANEL} p-5 space-y-4`}>
        <div className="flex flex-wrap items-center justify-between gap-2 border-b border-line pb-3">
         <div>
          <Tag>사전 역할 세팅 · 🔒 개별 고정 · 🎲 랜덤 추첨</Tag>
          <h2 className="mt-1.5 text-base font-bold">🙋‍♂️ 우리 반 1인 1역할 배정 및 관리</h2>
          <p className="mt-0.5 text-[11px] text-slate-500">역할을 미리 세팅해 두고, 고정할 학생은 [🔒고정]을 누른 뒤 랜덤 배정을 실행하세요.</p>
         </div>
         <div className="flex flex-wrap gap-1.5">
          <Button primary onClick={shuffleRolesWithLock}>🎲 고정 제외 랜덤 배정</Button>
          <Button onClick={()=>{
           const nextRoles = (rc.roles||[]).map((r,i)=>r.locked?r:({...r,studentId:students[i%Math.max(1,students.length)]?.id||""}));
           update(d=>({...d,rolesClean:{...rc,roles:nextRoles}}));
           notify("고정된 역할을 제외하고 번호순으로 자동 매칭했습니다.");
          }}>번호순 배정</Button>
         </div>
        </div>

        <div className="space-y-2.5">
         {(rc.roles||[]).map((r, idx) => (
          <div key={r.id} className={`grid gap-2 rounded-xl border p-3 sm:grid-cols-[1fr_135px_auto_1fr_auto] items-center ${r.locked?"border-brand bg-[#faf8fe]":"border-line bg-paper"}`}>
           <input className={INPUT+" !py-1.5 font-semibold"} value={r.role} onChange={e=>{
            const next = rc.roles.map((x,i)=>i===idx?{...x,role:e.target.value}:x);
            update(d=>({...d,rolesClean:{...rc,roles:next}}));
           }} placeholder="역할명"/>
           <select className={INPUT+" !py-1.5"} value={r.studentId||""} onChange={e=>{
            const next = rc.roles.map((x,i)=>i===idx?{...x,studentId:e.target.value}:x);
            update(d=>({...d,rolesClean:{...rc,roles:next}}));
           }}>
            <option value="">담당 선택</option>
            {students.map(s=><option key={s.id} value={s.id}>{s.number}번 {s.name}</option>)}
           </select>
           <button

            onClick={()=>{
             const next = rc.roles.map((x,i)=>i===idx?{...x,locked:!x.locked}:x);
             update(d=>({...d,rolesClean:{...rc,roles:next}}));
            }}
            className={`rounded-lg border px-2.5 py-1.5 text-xs font-bold transition-colors ${r.locked?"border-brand bg-brand text-white":"border-line bg-white text-slate-500 hover:text-ink"}`}
            title="체크 시 랜덤 배정에서도 이 학생이 고정됩니다"
           >
            {r.locked ? "🔒 고정됨" : "🔓 해제"}
           </button>
           <input className={INPUT+" !py-1.5 !text-xs"} value={r.desc||""} onChange={e=>{

           leaveType: studentLeaveType,
           leaveDate: studentLeaveDate,
           choicesObj

            students: d.students.map(s => (s.name === name || s.number === number) ? { ...s, phone: phone || s.phone, parentPhone: parentPhone || s.parentPhone } : s)

          e.currentTarget.reset();

           {transferMode==="remove"?`🚫 ${studentLeaveType} 처리 반영`:transferMode==="restore"?"♻️ 재학 복원 반영":transferMode==="add"?"➕ 전입생 등록 반영":"✏️ 정보 변경 반영"}

                  className="rounded-lg border border-brand bg-white px-2.5 py-1 text-[11px] font-bold text-brand hover:bg-[#faf8fe]"

                 >
                  ♻️ 재학 복원
                 </button>
                ) : (
                 <select

                  className="rounded-lg border border-line bg-white px-2 py-1 text-[11px] text-slate-600 hover:border-red-300"
                  value=""
                  onChange={e=>{
                   const lType = e.target.value;

           category: counselForm.category,
           date: validDate(counselForm.date) ? counselForm.date : day(),
           time: counselForm.time || nowTimeStr(),
           title: autoTitle,
           body: counselForm.body.trim(),
           followUp: counselForm.followUp.trim(),
           updatedAt: new Date().toISOString()
          };
          update(d => ({
           ...d,
           notes: editingNoteId
            ? (d.notes || []).map(x => x.id === editingNoteId ? newNote : x)
            : [...(d.notes || []), newNote]
          }));

          setCounselForm(prev => ({
           ...prev,
           date: day(),
           time: nowTimeStr(),
           title: "",
           body: "",
           followUp: ""

             className={INPUT+" bg-white font-bold text-brand !py-2"}
            />
            <datalist id="cs-student-list">
             {students.map(s => <option key={s.id} value={`${s.number}번 ${s.name}`}/>)}

 }}/></div></Dialog>}

 {modal?.type==="masterAdmin" && ["master","subadmin"].includes(currentUser?.role) && (()=>{

       schoolNoticeRef.current = msg;
       setSchoolNotice(msg);
       await pushSharedSchoolRoster({ notice: msg }, managedSchool);
       notify(msg ? `[${managedSchool}] 전교사 공지 배너를 게시했습니다!` : "공지 배너를 내렸습니다.");
      }}>
       <input name="noticeText" defaultValue={schoolNotice} placeholder="전교사 상단 공지 문구 입력" className={INPUT+" flex-1 bg-white !py-1.5 text-xs"}/>
       <button type="submit" className="rounded-lg bg-brand px-3.5 py-1.5 text-xs font-bold text-white shrink-0">공지 게시</button>
      </form>
     </section>

     <section className="rounded-xl border border-line bg-white p-4 space-y-2.5">
      <div className="flex items-center justify-between">
       <h3 className="text-sm font-bold text-ink">🔄 정규 시간표 영구 교체 결재 ({swapRequests.filter(r=>r.type==="perm_swap" && r.status==="pending").length}건 대기)</h3>
       <Button className="!min-h-[30px] !px-2.5 !py-1 !text-xs" onClick={()=>pullSharedSchoolRoster(false, managedSchool)}>새로고침</Button>
      </div>
      {swapRequests.filter(r=>r.type==="perm_swap").length > 0 ? (
       <div className="max-h-28 overflow-y-auto space-y-1.5">
        {swapRequests.filter(r=>r.type==="perm_swap").map(req => (
         <div key={req.id} className="flex items-center justify-between gap-2 rounded-lg border border-line bg-paper px-3 py-1.5 text-xs">
          <span className="truncate"><strong>{req.fromTeacher}↔{req.toTeacher}</strong> ({req.fromDay}{req.fromPeriod} ↔ {req.toDay}{req.toPeriod})</span>
          {req.status === "pending" ? (
           <div className="flex gap-1 shrink-0">
            <button type="button" className="rounded bg-brand px-2 py-0.5 text-[11px] font-bold text-white" onClick={()=>handleSwapDecision(req.id,"approved")}>승인</button>
            <button type="button" className="rounded bg-red-100 px-2 py-0.5 text-[11px] font-bold text-red-700" onClick={()=>handleSwapDecision(req.id,"rejected")}>반려</button>
           </div>
          ) : <span className="text-[11px] font-bold text-emerald-700">{req.status==="approved"?"승인됨":"반려됨"}</span>}
         </div>
        ))}
       </div>
      ) : <p className="text-xs text-slate-400">영구 시간표 교체 대기 건이 없습니다.</p>}
     </section>
    </div>
   </div>
  </Dialog>;
 })()}

 {uploadReport && (
  <Dialog title={uploadReport.loading ? "⏳ 파일 분석 및 전교 출석부 연동 중..." : uploadReport.ok ? "✅ 학생 명단 업로드 및 교과반 연동 완료" : "⚠️ 파일 업로드 확인 필요"} onClose={()=>!uploadReport.loading && setUploadReport(null)}>
   <div className="space-y-4">
    <div className={`rounded-xl border-2 p-4 ${uploadReport.loading ? "border-brand bg-[#faf8fe]" : uploadReport.ok ? "border-emerald-500 bg-emerald-50" : "border-red-500 bg-red-50"}`}>
     <div className="flex items-center gap-2.5">
      {uploadReport.loading && <Loader2 className="h-5 w-5 animate-spin text-brand shrink-0"/>}
      <strong className="text-sm font-extrabold text-ink">{uploadReport.title}</strong>
     </div>
     <p className="mt-2 text-xs leading-6 font-medium text-slate-700">{uploadReport.desc}</p>
     {uploadReport.details && <p className="mt-1 text-[11px] text-slate-500">{uploadReport.details}</p>}
    </div>

    {Array.isArray(uploadReport.classBreakdown) && uploadReport.classBreakdown.length > 0 && (
     <div className="space-y-2">
      <p className="text-xs font-bold text-ink">📋 학급별 등록 인원 확인 ({uploadReport.classBreakdown.length}개 학급)</p>
      <div className="grid grid-cols-3 sm:grid-cols-4 gap-2 max-h-48 overflow-y-auto p-1">
       {uploadReport.classBreakdown.map(item => (
        <div key={item.dept} className="rounded-lg border border-[#dcd3ee] bg-[#faf8fe] px-3 py-2 text-center">
         <div className="text-xs font-extrabold text-brand">{item.dept}반</div>
         <div className="text-sm font-bold text-ink">{item.count}명</div>
        </div>
       ))}
      </div>
     </div>
    )}

    {Array.isArray(uploadReport.autoCreatedClasses) && uploadReport.autoCreatedClasses.length > 0 && (
     <div className="rounded-xl border border-indigo-200 bg-indigo-50/70 p-3.5 space-y-1.5">
      <p className="text-xs font-bold text-indigo-900">📘 1학년 공통교과 수업반 자동 생성·연동 완료 ({uploadReport.autoCreatedClasses.length}개 수업반)</p>
      <p className="text-[11px] text-indigo-800 leading-5">
       {uploadReport.autoCreatedClasses.join(", ")}
      </p>
     </div>
    )}

    {!uploadReport.loading && (
     <div className="flex justify-end gap-2 pt-2">
      <Button primary onClick={()=>{setUploadReport(null);setClassTab("출결");}}>출결 화면에서 바로 확인하기</Button>
     </div>
    )}
   </div>
  </Dialog>
 )}

 {toast&&<div role="status" aria-live="polite" className="fixed bottom-20 lg:bottom-6 left-1/2 z-[70] flex w-[calc(100%-32px)] max-w-md -translate-x-1/2 items-start gap-2 rounded-xl bg-[#302847] px-4 py-3 text-xs leading-6 text-white shadow-lg"><CheckCircle className="mt-1 h-4 w-4 shrink-0"/><span className="min-w-0 flex-1">{toast}</span><button type="button" aria-label="알림 닫기" onClick={()=>setToast("")} className="p-1"><X className="h-4 w-4"/></button></div>}
 </div>;
}

class ErrorBoundary extends React.Component{
 constructor(props){super(props);this.state={error:null};}
 static getDerivedStateFromError(error){return {error};}
 render(){
  if(this.state.error)return <main className="mx-auto max-w-xl px-6 py-16"><h1 className="text-xl font-bold">화면 구성 중 오류가 발생했습니다.</h1><p className="mt-4 text-sm leading-7 text-slate-600">저장 자료를 지우지 말고 원본부터 백업하세요. 아래 문구를 알려주시면 원인 확인에 도움이 됩니다.</p><pre className="mt-4 rounded-lg border border-red-200 bg-red-50 p-4 text-xs text-red-800">{String(this.state.error.message||this.state.error)}</pre><div className="mt-5 flex flex-wrap gap-2"><Button onClick={()=>{try{download("교무실_원본저장자료.json",localStorage.getItem(STORE)||"{}","application/json");}catch{alert("저장소에 접근하지 못했습니다.");}}}>원본 자료 다운로드</Button><Button primary onClick={()=>location.reload()}>새로고침</Button></div></main>;
  return this.props.children;
 }
}
ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
