    showUploadResult(false, `[${file.name}] 수업장소 업로드 오류`, err.message, "엑셀 파일 형식을 확인해 주세요.", false);
   } finally {
    sharedLockRef.current = false;
    setBusy("");
   }
  }

  // [1단계 양식] 전교생 명단 + 선택과목 신청 현황 + 교사별/학급별 시간표 + 담임교사 배정표 통합 표준 엑셀(.xlsx)
  function downloadCustomSchoolStandardExcel(){
   if(!window.XLSX){
    notify("엑셀 생성 라이브러리를 불러오는 중입니다. 잠시 후 다시 시도해 주세요.");
    return;
   }
   const wb = window.XLSX.utils.book_new();
   const g1Cnt = Math.max(1, Math.min(20, Number(templateConfig.g1) || 7));
   const g2Cnt = Math.max(1, Math.min(20, Number(templateConfig.g2) || 7));
   const g3Cnt = Math.max(1, Math.min(20, Number(templateConfig.g3) || 7));
   const slotList = String(templateConfig.slots || "A,B,C,D,E,F,G,H,I,J,K,L,M").split(",").map(s => s.trim()).filter(Boolean);

   const allDepts = [
    ...Array.from({length: g1Cnt}, (_, i) => `1-${i+1}`),
    ...Array.from({length: g2Cnt}, (_, i) => `2-${i+1}`),
    ...Array.from({length: g3Cnt}, (_, i) => `3-${i+1}`)
   ];

   // 시트 1: 전체시간표(교사별) - 2행 구조(과목명 행 + 강의실/학반 행)
   const sampleTeachers = Object.keys(data.schoolMasterData?.teachers || {}).length > 0
    ? Object.keys(data.schoolMasterData.teachers)
    : ["홍길동", "김교사", "이교사", "박교사"];
   const sheet1Rows = [
    ["요일", "교시", "교사명", ...sampleTeachers]
   ];
   ["월", "화", "수", "목", "금"].forEach(dName => {
    for(let p = 1; p <= 7; p++){
     sheet1Rows.push([dName, p, "과목명", ...(p===1 && dName==="월" ? ["공통국어1", "윤리와사상B0", "", ""] : Array(sampleTeachers.length).fill(""))]);
     sheet1Rows.push(["", p, "강의실(학반)", ...(p===1 && dName==="월" ? ["1-1", "2-1", "", ""] : Array(sampleTeachers.length).fill(""))]);
    }
   });
   const ws1 = window.XLSX.utils.aoa_to_sheet(sheet1Rows);
   window.XLSX.utils.book_append_sheet(wb, ws1, "전체시간표(교사별)");

   // 시트 2: 전체시간표(학급별)
   const sheet2Rows = [
    ["요일", "교시", ...allDepts]
   ];
   ["월", "화", "수", "목", "금"].forEach(dName => {
    for(let p = 1; p <= 7; p++){
     sheet2Rows.push([dName, p, ...allDepts.map((_, idx) => (dName==="월" && p===1 && idx===0 ? "공통국어1" : ""))]);
     sheet2Rows.push(["", p, ...allDepts.map((_, idx) => (dName==="월" && p===1 && idx===0 ? "홍길동" : ""))]);
    }
   });
   const ws2 = window.XLSX.utils.aoa_to_sheet(sheet2Rows);
   window.XLSX.utils.book_append_sheet(wb, ws2, "전체시간표(학급별)");

   // 시트 3: 전교생_명단_및_선택과목
   const sheet3Header = ["학번", "학년", "반", "번호", "이름", ...slotList.slice(0, 13), "학생연락처(선택)", "보호자연락처(선택)"];
   const sheet3Rows = [sheet3Header];
   const existingHrRosters = data.schoolMasterData?.homeroomRosters || {};
   const existingMatrixRows = data.electiveMatrix?.rows || [];
   allDepts.forEach(dept => {
    const [g, c] = dept.split("-").map(Number);
    const existingList = existingHrRosters[dept] || [];
    if(existingList.length > 0){
     existingList.forEach(st => {
      const mx = existingMatrixRows.find(r => r.dept === dept && r.name === st.name);
      const hakbun = `${g}${String(c).padStart(2, "0")}${String(st.number).padStart(2, "0")}`;
      sheet3Rows.push([
       hakbun,
       g,
       c,
       st.number,
       st.name,
       ...slotList.slice(0, 13).map(sl => mx?.choices?.[sl] || ""),
       st.phone || "",
       st.parentPhone || ""
      ]);
     });
    } else {
     const sampleHakbun = `${g}${String(c).padStart(2, "0")}01`;
     sheet3Rows.push([
      sampleHakbun,
      g,
      c,
      1,
      `${dept}학생1`,
      ...slotList.slice(0, 13).map(sl => g === 1 ? "" : `${sl}타임선택과목명`),
      "",
      ""
     ]);
    }
   });
   const ws3 = window.XLSX.utils.aoa_to_sheet(sheet3Rows);
   window.XLSX.utils.book_append_sheet(wb, ws3, "전교생_명단_및_선택과목");

   // 시트 4: 담임교사배정표
   const hrMap = data.schoolMasterData?.homeroomTeachers || {};
   const sheet4Rows = [
    ["학반", "담임교사명", "비고(안내)"],
    ...allDepts.map(dept => [dept, hrMap[dept] || "", "예: 1-1 또는 1학년 1반 / 비담임 교과교사는 기재하지 않음"])
   ];
   const ws4 = window.XLSX.utils.aoa_to_sheet(sheet4Rows);
   window.XLSX.utils.book_append_sheet(wb, ws4, "담임교사배정표");

   window.XLSX.writeFile(wb, `${data.profile.school || "학교"}_1단계_통합마스터_표준양식(명단_시간표_선택과목_담임배정).xlsx`);
   notify(`1단계 기본 통합 표준 엑셀 양식(전교생 명단·시간표·선택과목·담임배정)을 내려받았습니다!`);
  }

  // [2단계 전용 별도 양식] 2학년·3학년 선택과목 수업 장소('1반', '2반'... + 특별실 열)만 별도로 구성된 엑셀(.xlsx) 양식 다운로드
  function downloadElectiveRoomExcelTemplate(){
   if(!window.XLSX){
    notify("엑셀 생성 라이브러리를 불러오는 중입니다. 잠시 후 다시 시도해 주세요.");
    return;
   }
   const wb = window.XLSX.utils.book_new();
   const g2Cnt = Math.max(1, Math.min(20, Number(templateConfig.g2) || 7));
   const g3Cnt = Math.max(1, Math.min(20, Number(templateConfig.g3) || 7));
   const slotList = String(templateConfig.slots || "A,B,C,D,E,F,G,H,I,J,K,L,M").split(",").map(s => s.trim()).filter(Boolean);
   const specialRoomCols = String(templateConfig.specialRooms || "사회과실,미술실,음악실,과학실1,과학실2,정보실,시청각실,특별실1,특별실2").split(",").map(s => s.trim()).filter(Boolean);

   const buildElectiveRoomSheet = (gradeNum, classCount) => {
    const classHeaders = Array.from({length: classCount}, (_, i) => `${i+1}반`);
    const rows = [
     ["실수업", ...classHeaders, ...specialRoomCols],
     ["반별인원", ...Array(classCount).fill(26), ...Array(specialRoomCols.length).fill("")],
     ["선택과목 최대인원", ...Array(classCount).fill(30), ...Array(specialRoomCols.length).fill("")]
    ];
    slotList.forEach((sl, sIdx) => {
     const isSampleFirst = sIdx === 0;
     // 첫 줄: 과목명(인원수) 행
     rows.push([
      sl,
      ...Array.from({length: classCount}, (_, cIdx) => {
       if(!isSampleFirst) return "";
       return gradeNum === 3
        ? (["미적분A(20)","문학과매체A(25)","영어권문화A(26)","기하A(31)","심화영어ⅠA(28)","영미문학읽기A(22)","화법과작문A0(26)"][cIdx] || "")
        : (["윤리와사상A(25)","세계지리A(24)","물리학ⅠA(26)","화학ⅠA(28)","생명과학ⅠA(27)","지구과학ⅠA(25)","정치와법A(24)"][cIdx] || "");
      }),
      ...specialRoomCols.map((_, spIdx) => (isSampleFirst && spIdx === 0 ? `특별실과목${sl}(15)` : ""))
     ]);
     // 둘째 줄: 담당교사 성함 행 (한 과목에 두 분 이상 들어가시면 아래에 두 줄을 더 추가하거나 '김교사, 이교사'로 적으시면 모두 인식됩니다)
     rows.push([
      "",
      ...Array.from({length: classCount}, (_, cIdx) => {
       if(!isSampleFirst) return "";
       return gradeNum === 3
        ? (["제갈은화","위인용","백지선","이지은","이다은","박미진(원)","정민"][cIdx] || "")
        : (["김교사","이교사","박교사","최교사","정교사","강교사","조교사"][cIdx] || "");
      }),
      ...specialRoomCols.map((_, spIdx) => (isSampleFirst && spIdx === 0 ? "담당교사명" : ""))
     ]);
    });
    return window.XLSX.utils.aoa_to_sheet(rows);
   };

   window.XLSX.utils.book_append_sheet(wb, buildElectiveRoomSheet(2, g2Cnt), "2학년_선택과목장소");
   window.XLSX.utils.book_append_sheet(wb, buildElectiveRoomSheet(3, g3Cnt), "3학년_선택과목장소");

   window.XLSX.writeFile(wb, `${data.profile.school || "학교"}_2단계_2·3학년_선택과목_수업장소_전용양식.xlsx`);
   notify(`2단계 전용 [2학년·3학년 선택과목 수업장소] 별도 엑셀 양식을 내려받았습니다!`);
  }

  async function applyImportedAcademicEvents(parsedEvents, forceSchoolBroadcast = false){
   if(!parsedEvents.length){
    notify("인식된 학사일정이 없습니다. [날짜, 학사일정명] 형식인지 확인하거나 아래 텍스트 붙여넣기를 이용해 주세요.");
    return;
   }
   const effDate = validDate(academicEffectiveDate) ? academicEffectiveDate : day();
   const shouldBroadcast = forceSchoolBroadcast || broadcastAcademicToSchool;

   const normalizedSharedEvents = parsedEvents.map((e, idx) => ({
    id: `school-acad-${e.date}-${idx}`,
    title: e.title,
    date: e.date,
    time: e.time || "09:00",
    category: "학교학사력",
    effectiveDate: effDate
   }));

   let finalSharedAcademicList = normalizedSharedEvents;

   update(d => {
    const baseEvents = (d.events || []).filter(e => {
     if(replaceFutureAcademicOnly && ["학교학사력","학사일정"].includes(e.category) && e.date >= effDate){
      return false;
     }
     return true;
    });
    const existEventKeys = new Set(baseEvents.map(e => `${e.date}_${e.title}`));
    const filteredIncoming = normalizedSharedEvents.filter(e => !replaceFutureAcademicOnly || e.date >= effDate);
    const newEvents = filteredIncoming
     .filter(e => !existEventKeys.has(`${e.date}_${e.title}`))
     .map(e => ({ ...e, id: "acad-" + uid() }));

    const mergedEvents = [...baseEvents, ...newEvents];
    finalSharedAcademicList = mergedEvents.filter(e => ["학교학사력","학사일정"].includes(e.category));

    let nextTasks = d.tasks || [];
    if(alsoAddAcademicToTasks){
     const existTaskKeys = new Set(nextTasks.map(t => `${t.date}_${t.title}`));
     const addTasks = filteredIncoming
      .filter(e => !existTaskKeys.has(`${e.date}_${e.title}`))
      .map(e => ({ id: "task-acad-" + uid(), title: `[학사] ${e.title}`, date: e.date, priority: "보통", category: "행정 업무", done: false }));
     nextTasks = [...nextTasks, ...addTasks];
    }
    return { ...d, events: mergedEvents, tasks: nextTasks };
   });

   if(shouldBroadcast){
    await pushSharedSchoolRoster({ sharedAcademicEvents: finalSharedAcademicList });
   }
   setModal(null);
   notify(shouldBroadcast
    ? `🏫 기준일자(${effDate}) 이후 학사력을 갱신하여 전교사 달력에 실시간 반영했습니다! (이전 기록 보존됨)`
    : `기준일자(${effDate}) 기준 학사력 일정 ${parsedEvents.length}건을 내 달력에 반영했습니다!`);
  }

 async function handleAcademicCalendarFileUpload(file){
  if(!file) return;
  try {
   const ext = file.name.split(".").pop()?.toLowerCase() || "";
   if(["xlsx","xls","csv"].includes(ext)){
    if(ext === "csv"){
     const txt = await file.text();
     const rows = txt.replace(/^\ufeff/,"").split(/\r?\n/).map(line => line.includes("\t") ? line.split("\t") : line.split(","));
     const evs = parseAcademicRowsToEvents(rows);
     applyImportedAcademicEvents(evs);
     return;
    }
    if(!window.XLSX){ notify("엑셀 라이브러리를 준비 중입니다. 잠시 후 다시 시도하세요."); return; }
    const buf = await file.arrayBuffer();
    const wb = window.XLSX.read(buf, { type: "array" });
    let allRows = [];
    wb.SheetNames.forEach(sn => {
     const sheetRows = window.XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, defval: "" });
     allRows.push(...sheetRows);
    });
    const evs = parseAcademicRowsToEvents(allRows);
    applyImportedAcademicEvents(evs);
    return;
   }
   if(["txt","hwp","hwpx"].includes(ext)){
    const rawText = await file.text();
    const cleanLines = rawText.replace(/<[^>]+>/g, "\n").split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    const rows = cleanLines.map(line => line.includes("\t") ? line.split("\t") : line.split(/\s{2,}|,/));
    const evs = parseAcademicRowsToEvents(rows);
    if(evs.length > 0){
     applyImportedAcademicEvents(evs);
     return;
    }
    notify("한글(HWP) 바이너리 파일은 한글 프로그램에서 학사력 표를 드래그 복사(Ctrl+C)한 뒤 아래 입력창에 붙여넣으시면 100% 정확하게 인식됩니다!");
   }
  } catch(e) {
   notify("학사력 파일 읽기 오류: " + e.message);
  }
 }

// 1) [기준일자 버전 관리 + 2·3학년 선택과목 수업장소 시트 최우선 오버라이드 지원] 마스터 엑셀(.xlsx) 일괄 업로드 및 전교 배포
  async function handleSchoolMasterExcelUpload(file){
   if(!file) return;
   if(!window.XLSX){ notify("엑셀 분석 라이브러리를 불러오는 중입니다. 잠시 후 다시 시도해 주세요."); return; }
   const effDate = validDate(masterEffectiveDate) ? masterEffectiveDate : day();
   sharedLockRef.current = true;
   setBusy(`[${file.name}]에서 기준일자(${effDate}) 전교생 명단·선택과목·시간표·2/3학년 선택과목 장소를 분석하여 배포 중...`);
   setError("");
   try {
    const buf = await file.arrayBuffer();
    const wb = window.XLSX.read(buf, { type: "array", raw: false });

    const prevHrRosters = live.current.schoolMasterData?.homeroomRosters || {};
    const prevLeaveMap = {};
    Object.entries(prevHrRosters).forEach(([deptKey, stuArr]) => {
     (stuArr || []).forEach(st => {
      if(st.leaveType) prevLeaveMap[`${deptKey}|${st.name}`] = { leaveType: st.leaveType, leaveDate: st.leaveDate || "" };
     });
    });

    const electiveRosters = {};
    const homeroomRosters = { ...prevHrRosters };
    const touchedDepts = new Set();
    const teachersSchedule = {};
    const classTimetables = {};
    const homeroomTeachers = { ...(live.current.schoolMasterData?.homeroomTeachers || {}) };
    const electiveRooms = { ...(live.current.schoolMasterData?.electiveRooms || {}) };
    const matrixRows = [];
    const slotHeaderSet = new Set(live.current.electiveMatrix?.headers || []);

    // ★ 1단계: 시트 중 [2학년_선택과목장소], [3학년_선택과목장소] 또는 '실수업' 표가 있는 시트를 먼저 스캔하여 선택과목별 실제 수업장소 맵 구축!
    for(const sheetName of wb.SheetNames){
     const rows = window.XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: "", raw: false });
     if(rows.length < 3) continue;
     const topCellsText = rows.slice(0, 4).flat().map(x => String(x ?? "").trim()).join(" ");
     const isRoomSheet = sheetName.includes("장소") || sheetName.includes("실수업") || (sheetName.includes("배정") && /실수업|선택과목\s*최대인원/.test(topCellsText)) || /실수업/.test(String(rows[0]?.[0] ?? ""));
     if(isRoomSheet && !sheetName.includes("담임교사")){
      const inferredGrade = (sheetName.includes("2학년") || sheetName.includes("고2")) ? 2 : (sheetName.includes("3학년") || sheetName.includes("고3")) ? 3 : 2;
      const parsedRooms = parseElectiveRoomGridSheet(rows, inferredGrade);
      Object.assign(electiveRooms, parsedRooms);
     }
    }

    // ★ 2단계: 나머지 시트(담임배정, 전교생 명단/선택과목, 교사별/학급별 시간표) 파싱
    for(const sheetName of wb.SheetNames){
     const rows = window.XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: "", raw: false });
     if(rows.length < 2) continue;

     const r0 = (rows[0] || []).map(x => String(x ?? "").trim());
     const r1 = (rows[1] || []).map(x => String(x ?? "").trim());
     const hasHakbunR0 = r0.some(c => /학번/.test(c));
     const hasNameR0 = r0.some(c => /^(이름|성명|학생명)$/.test(c));

     if(sheetName.includes("장소") || /실수업/.test(r0[0] || "")) continue;

     // (0) '담임교사배정표' 시트 인식
     if(sheetName.includes("담임") && r0.some(c => /학반|학급|반/.test(c))){
      for(let r = 1; r < rows.length; r++){
       const deptVal = normalizeDeptCell(rows[r]?.[0], 1) || String(rows[r]?.[0] ?? "").trim();
       const tVal = cleanMasterLabel(String(rows[r]?.[1] ?? "").trim());
       if(/^[1-3]-\d+$/.test(deptVal) && tVal) homeroomTeachers[deptVal] = tVal;
      }
      continue;
     }

     // (A) '전교생_명단_및_선택과목', '2학년 정렬', '3학년 정렬', '1학년 명렬' 시트 통합 파싱
     if(sheetName.includes("정렬") || sheetName.includes("명렬") || sheetName.includes("명단") || sheetName.includes("전교생") || (hasHakbunR0 && hasNameR0)){
      const gradeFromSheet = (sheetName.match(/([1-3])학년/) || [])[1] || "";
      const idxHakbun = r0.findIndex(c => /학번/.test(c));
      const idxGrade = r0.findIndex(c => /^학년$/.test(c));
      const idxClass = r0.findIndex((c, i) => i !== idxGrade && /^(학반|반|학급)$/.test(c));
      const idxNum = r0.findIndex(c => /^(번호|연번|출석번호)$/.test(c));
      const idxName = r0.findIndex(c => /^(이름|성명|학생명)$/.test(c));
      const idxPhone = r0.findIndex(c => /학생.*연락처|^연락처$|휴대폰/.test(c));
      const idxParentPhone = r0.findIndex(c => /보호자|학부모/.test(c));

      const nameColPos = idxName >= 0 ? idxName : 3;
      const isTwoRowHeader = !hasText(r1[nameColPos]) && r1.slice(nameColPos + 1).some(c => /^[A-Z]$/i.test(c));
      const slotCols = [];
      const startCol = nameColPos + 1;
      const maxCol = Math.max(r0.length, r1.length);

      for(let c = startCol; c < maxCol; c++){
       if(c === idxPhone || c === idxParentPhone) continue;
       const label = isTwoRowHeader ? (r1[c] || r0[c]) : (r0[c] || r1[c]);
       const cleanLabel = String(label ?? "").trim();
       if(cleanLabel && !/^(비고|메모|연락처|학생연락처|보호자연락처|학생연락처\(선택\)|보호자연락처\(선택\))$/.test(cleanLabel)){
        slotCols.push({ colIdx: c, slot: cleanLabel });
        slotHeaderSet.add(cleanLabel);
       }
      }

      const dataStartRow = isTwoRowHeader ? 2 : 1;
      for(let r = dataStartRow; r < rows.length; r++){
       const row = rows[r];
       if(!row) continue;
       const rawName = String(row[nameColPos] ?? "").trim();
       if(!rawName || /^(이름|성명|학생명)$/.test(rawName)) continue;

       const rawHakbun = idxHakbun >= 0 ? row[idxHakbun] : row[0];
       const rawGradeCol = idxGrade >= 0 ? row[idxGrade] : gradeFromSheet;
       const rawClassCol = idxClass >= 0 ? row[idxClass] : row[1];
       const rawNumCol = idxNum >= 0 ? row[idxNum] : row[2];

       let parsedId = parseStudentIdCode(rawHakbun, rawGradeCol || 1, rawClassCol, rawNumCol || (r - dataStartRow + 1));
       const normDeptFromClassCol = normalizeDeptCell(rawClassCol, Number(String(rawGradeCol||"").replace(/\D/g,"")) || parsedId.grade || 1);
       if(!/^\d{4,5}$/.test(String(rawHakbun??"").replace(/\.0$/,"").replace(/\D/g,"")) && normDeptFromClassCol){
        const [gNum, cNum] = normDeptFromClassCol.split("-").map(Number);
        parsedId = {
         dept: normDeptFromClassCol,
         grade: gNum,
         classroom: cNum,
         number: Number(String(rawNumCol??"").replace(/\D/g,"")) || (r - dataStartRow + 1)
        };
       }

       const leaveInfo = prevLeaveMap[`${parsedId.dept}|${rawName}`] || {};
       if(!touchedDepts.has(parsedId.dept)){
        homeroomRosters[parsedId.dept] = [];
        touchedDepts.add(parsedId.dept);
       }
       const exHrIdx = homeroomRosters[parsedId.dept].findIndex(s => s.number === parsedId.number || s.name === rawName);
       const stuItem = {
        id: `stu-${parsedId.dept}-${parsedId.number}-${rawName}`,
        number: parsedId.number,
        dept: parsedId.dept,
        name: rawName,
        phone: idxPhone >= 0 ? String(row[idxPhone] ?? "").trim() : "",
        parentPhone: idxParentPhone >= 0 ? String(row[idxParentPhone] ?? "").trim() : "",
        memo: String(rawHakbun || "").replace(/\.0$/,""),
        leaveType: leaveInfo.leaveType || "",
        leaveDate: leaveInfo.leaveDate || "",
        submitted: false
       };
       if(exHrIdx >= 0) homeroomRosters[parsedId.dept][exHrIdx] = stuItem;
       else homeroomRosters[parsedId.dept].push(stuItem);

       const choices = {};
       slotCols.forEach(({ colIdx, slot }) => {
        const subjVal = String(row[colIdx] ?? "").trim();
        if(!subjVal || subjVal === "0" || subjVal === "-" || /선택과목명/.test(subjVal)) return;
        choices[slot] = subjVal;

        const rosterKey = subjVal;
        const overriddenRoom = resolveElectiveRoomOverride(subjVal, "", "", electiveRooms);
        if(!electiveRosters[rosterKey]){
         electiveRosters[rosterKey] = { subject: subjVal, slot, grade: parsedId.grade, room: overriddenRoom || "", students: [] };
        } else if(overriddenRoom){
         electiveRosters[rosterKey].room = overriddenRoom;
        }
        if(!electiveRosters[rosterKey].students.some(s => s.dept === parsedId.dept && s.name === rawName)){
         electiveRosters[rosterKey].students.push({
          id: `el-${rosterKey}-${parsedId.dept}-${parsedId.number}`,
          number: electiveRosters[rosterKey].students.length + 1,
          dept: parsedId.dept,
          name: rawName,
          phone: stuItem.phone,
          parentPhone: stuItem.parentPhone,
          memo: `원번:${parsedId.number}번`,
          leaveType: leaveInfo.leaveType || "",
          leaveDate: leaveInfo.leaveDate || "",
          submitted: false
         });
        }
       });

       matrixRows.push({
        id: `mx-${parsedId.dept}-${parsedId.number}-${rawName}`,
        dept: parsedId.dept,
        number: parsedId.number,
        name: rawName,
        leaveType: leaveInfo.leaveType || "",
        leaveDate: leaveInfo.leaveDate || "",
        choices
       });
      }
     }

     // (B) '전체시간표(교사별)' 시트 파싱 (★ 1순위: 2·3학년 선택과목 장소 시트 ➔ 2순위: 시간표 시트에 표시된 반/장소)
     const teacherHeaderRowIdx = rows.slice(0, 8).findIndex(rowArr => Array.isArray(rowArr) && rowArr.some(c => /교사명/.test(String(c ?? ""))));
     if(sheetName.includes("교사별") && teacherHeaderRowIdx >= 0){
      const tHeaderRow = (rows[teacherHeaderRowIdx] || []).map(x => String(x ?? "").trim());
      const rTeacherColIdx = tHeaderRow.findIndex(c => /교사명/.test(c));
      const teacherCols = [];
      for(let c = rTeacherColIdx + 1; c < tHeaderRow.length; c++){
       const tName = cleanMasterLabel(String(tHeaderRow[c] ?? "").trim());
       if(tName && !/^\d+$/.test(tName)){
        teacherCols.push({ colIdx: c, teacherName: tName });
        teachersSchedule[tName] = [];
       }
      }

      let curDay = "";
      for(let r = teacherHeaderRowIdx + 1; r < rows.length; r += 2){
       const rowSubj = rows[r] || [];
       const rowRoom = rows[r + 1] || [];
       const dayCell = String(rowSubj[0] ?? "").trim();
       if(/^[월화수목금]$/.test(dayCell)) curDay = dayCell;
       const periodNum = Number(String(rowSubj[1] ?? "").replace(/[^\d.]/g,""));
       if(!curDay || !periodNum || periodNum < 1 || periodNum > 7) continue;

       teacherCols.forEach(({ colIdx, teacherName }) => {
        const subj = String(rowSubj[colIdx] ?? "").trim();
        const rawRoom = String(rowRoom[colIdx] ?? "").trim();
        const baseRoom = normalizeDeptCell(rawRoom, 1) || rawRoom;
        if(!subj || subj === "0" || subj === "-") return;

        // ★ 선택과목 장소 시트(electiveRooms) 값이 있으면 무조건 최우선 적용하고, 없을 때만 시간표 시트의 반(예: 1-3 등)을 표시!
        const finalRoom = resolveElectiveRoomOverride(subj, teacherName, baseRoom, electiveRooms);
        teachersSchedule[teacherName].push({ day: curDay, period: Math.floor(periodNum), subject: subj, room: finalRoom });

        const hrAutoMatch = subj.match(/^자율([1-3])(\d)$/);
        if(hrAutoMatch){
         const inferredDept = `${hrAutoMatch[1]}-${hrAutoMatch[2]}`;
         if(!homeroomTeachers[inferredDept]) homeroomTeachers[inferredDept] = teacherName;
        } else if(subj === "자율" && /^[1-3]-\d+$/.test(baseRoom)){
         if(!homeroomTeachers[baseRoom]) homeroomTeachers[baseRoom] = teacherName;
        }
       });
      }
     }

     // (C) '전체시간표(학급별)' 시트 파싱 (★ 2-7반 우측에 8번째, 9번째 추가 분반 열이 있는 경우까지 모두 자동 감지!)
     const classHeaderRowIdx = rows.slice(0, 8).findIndex(rowArr => Array.isArray(rowArr) && rowArr.filter(c => /^[1-3]-\d+$/.test(normalizeDeptCell(c, 1) || String(c ?? "").trim())).length >= 3);
     if(sheetName.includes("학급별") && classHeaderRowIdx >= 0){
      const rawHeaderRow = rows[classHeaderRowIdx] || [];
      const maxColLen = Math.max(rawHeaderRow.length, ...rows.slice(classHeaderRowIdx + 1, classHeaderRowIdx + 16).map(rw => (rw || []).length));
      const classCols = [];
      let lastGradeSeen = 1;
      let lastClassSeen = 0;

      for(let cIdx = 2; cIdx < maxColLen; cIdx++){
       const cellRaw = String(rawHeaderRow[cIdx] ?? "").trim();
       const normDept = normalizeDeptCell(cellRaw, lastGradeSeen);
       if(/^[1-3]-\d+$/.test(normDept)){
        const [gN, cN] = normDept.split("-").map(Number);
        lastGradeSeen = gN;
        lastClassSeen = cN;
        classCols.push({ colIdx: cIdx, dept: normDept, isExtra: false });
       } else {
        // 2-7반 옆이나 3-7반 옆에 헤더가 비어 있거나 특별 분반명이 적혀 있는데 실제 과목 데이터가 들어 있는 추가 분반 열 감지!
        const hasClassData = rows.slice(classHeaderRowIdx + 1).some(rw => {
         const v = String(rw?.[cIdx] ?? "").trim();
         return v && v !== "0" && v !== "-" && !/^\d+$/.test(v);
        });
        if(hasClassData){
         lastClassSeen += 1;
         const extraDeptLabel = cellRaw || `${lastGradeSeen}-${lastClassSeen}(추가분반)`;
         classCols.push({ colIdx: cIdx, dept: extraDeptLabel, isExtra: true });
        }
       }
      }

      let curDay = "";
      for(let r = classHeaderRowIdx + 1; r < rows.length; r += 2){
       const rowSubj = rows[r] || [];
       const rowTeacher = rows[r + 1] || [];
       const dayCell = String(rowSubj[0] ?? "").trim();
       if(/^[월화수목금]$/.test(dayCell)) curDay = dayCell;
       const periodNum = Number(String(rowSubj[1] ?? "").replace(/[^\d.]/g,""));
       if(!curDay || !periodNum || periodNum < 1 || periodNum > 7) continue;

       classCols.forEach(({ colIdx, dept, isExtra }) => {
        const subj = String(rowSubj[colIdx] ?? "").trim();
        const tName = cleanMasterLabel(String(rowTeacher[colIdx] ?? "").trim());
        if(!subj || subj === "0" || subj === "-" || /최소성취|특별프로그램|하교/.test(subj)) return;
        const fallbackDept = isExtra ? "" : dept;
        const overriddenRoom = resolveElectiveRoomOverride(subj, tName, fallbackDept, electiveRooms);
        if(!classTimetables[dept]) classTimetables[dept] = {};
        classTimetables[dept][`${curDay}-${Math.floor(periodNum)}`] = { subject: subj, teacher: tName, room: overriddenRoom };

        // 교사별 시트에 없거나 교사별 시트에서 장소가 누락된 추가 분반 수업을 교사 시간표에 보충·갱신
        if(tName){
         if(!teachersSchedule[tName]) teachersSchedule[tName] = [];
         const existSlot = teachersSchedule[tName].find(s => s.day === curDay && Number(s.period) === Math.floor(periodNum));
         if(!existSlot){
          teachersSchedule[tName].push({ day: curDay, period: Math.floor(periodNum), subject: subj, room: overriddenRoom });
         } else if(overriddenRoom && (!existSlot.room || existSlot.room !== overriddenRoom)){
          // 2·3학년 선택과목 장소 시트에서 찾은 장소가 있으면 시간표의 장소를 최우선 덮어쓰기!
          const fromRoomSheet = resolveElectiveRoomOverride(existSlot.subject, tName, "", electiveRooms);
          if(fromRoomSheet) existSlot.room = fromRoomSheet;
         }
        }
       });
      }
     }
    }

    Object.values(homeroomRosters).forEach(list => list.sort((a,b) => a.number - b.number));

    // 만약 기존 교사 시간표가 있더라도 새로 업로드된 선택과목 장소 시트(electiveRooms)가 있으면 전체 교사 시간표에 장소 우선 반영
    const rawTeachers = Object.keys(teachersSchedule).length > 0 ? teachersSchedule : (live.current.schoolMasterData?.teachers || {});
    const finalTeachers = Object.fromEntries(
     Object.entries(rawTeachers).map(([tName, slotArr]) => [
      tName,
      (slotArr || []).map(sl => ({
       ...sl,
       room: resolveElectiveRoomOverride(sl.subject, tName, sl.room, electiveRooms)
      }))
     ])
    );

    const finalElectives = Object.keys(electiveRosters).length > 0 ? electiveRosters : (live.current.schoolMasterData?.electiveRosters || {});
    const finalClassTt = Object.keys(classTimetables).length > 0 ? classTimetables : (live.current.schoolMasterData?.classTimetables || {});
    const nextElectiveMatrix = {
     ...(live.current.electiveMatrix || {}),
     headers: Array.from(slotHeaderSet),
     rows: matrixRows.length > 0 ? matrixRows : (live.current.electiveMatrix?.rows || [])
    };

    const prevVersions = Array.isArray(live.current.schoolMasterData?.versions) ? live.current.schoolMasterData.versions : [];
    const newVersionEntry = {
     effectiveDate: effDate,
     label: `${effDate} 적용 시간표·명단 (${file.name})`,
     teachers: finalTeachers,
     classTimetables: finalClassTt,
     homeroomRosters,
     electiveRosters: finalElectives,
     homeroomTeachers,
     electiveRooms,
     electiveMatrix: nextElectiveMatrix,
     updatedBy: cleanMasterLabel(currentUser?.name || live.current.profile.teacher || "관리자"),
     updatedAt: new Date().toISOString()
    };
    const mergedVersions = [
     ...prevVersions.filter(v => v.effectiveDate !== effDate),
     newVersionEntry
    ].sort((a,b) => b.effectiveDate.localeCompare(a.effectiveDate));

    const nextMasterData = {
     teachers: finalTeachers,
     classTimetables: finalClassTt,
     homeroomRosters,
     electiveRosters: finalElectives,
     homeroomTeachers,
     electiveRooms,
     effectiveDate: effDate,
     versions: mergedVersions,
     schoolConfig: templateConfig,
     updatedAt: new Date().toISOString()
    };

    const myDept = `${live.current.profile.grade}-${live.current.profile.classroom}`;
    const myHomeroomStudents = homeroomRosters[myDept];

    update(d => ({
     ...d,
     students: Array.isArray(myHomeroomStudents) && myHomeroomStudents.length >= 1 ? myHomeroomStudents : d.students,
     electiveMatrix: nextElectiveMatrix,
     schoolMasterData: nextMasterData
    }));

    await pushSharedSchoolRoster({
     schoolMasterData: nextMasterData,
     electiveMatrix: nextElectiveMatrix
    });

    const myTeacherName = cleanMasterLabel(currentUser?.name || live.current.profile.teacher || "");
    if(myTeacherName){
     setSelectedMasterTeacher(myTeacherName);
     setTimeout(() => applyTeacherScheduleFromMaster(myTeacherName, nextMasterData, true), 80);
    }

    const breakdown = Object.keys(homeroomRosters).sort((a,b)=>a.localeCompare(b,"ko",{numeric:true})).map(dKey => ({ dept: dKey, count: (homeroomRosters[dKey]||[]).length }));
    showUploadResult(
     true,
     `✅ [${file.name}] 통합 마스터 세팅 및 전교 배포 완료!`,
     `학급 명렬 ${Object.keys(homeroomRosters).length}개반 · 교사 시간표 ${Object.keys(finalTeachers).length}명 · 선택과목 ${Object.keys(finalElectives).length}개 분반 · 선택과목 수업장소 ${Object.keys(electiveRooms).length}건이 등록되었습니다.`,
     `기준일자 [${effDate}] 버전으로 저장되었으며, 2·3학년 선택과목 장소 시트에 기재된 수업 장소가 시간표에 최우선 반영되었습니다.`,
     false,
     breakdown
    );
   } catch(err) {
    showUploadResult(false, "학교 통합 엑셀 분석 실패", err.message, "표준 엑셀 양식 시트 구조를 확인해 주세요.", false);
   } finally {
    sharedLockRef.current = false;
    setBusy("");
   }
  }

  // 저장된 기준일자(effectiveDate) 버전으로 전체 시간표·명단을 전환하는 함수
  async function switchMasterScheduleVersion(targetEffDate){
   const ver = (live.current.schoolMasterData?.versions || []).find(v => v.effectiveDate === targetEffDate);
   if(!ver) return;
   const nextMaster = {
    ...(live.current.schoolMasterData || {}),
    teachers: ver.teachers || {},
    classTimetables: ver.classTimetables || {},
    homeroomRosters: ver.homeroomRosters || {},
    electiveRosters: ver.electiveRosters || {},
    homeroomTeachers: ver.homeroomTeachers || {},
    electiveRooms: ver.electiveRooms || {},
    effectiveDate: ver.effectiveDate,
    updatedAt: new Date().toISOString()
   };
   const nextMatrix = ver.electiveMatrix || live.current.electiveMatrix;
   setMasterEffectiveDate(ver.effectiveDate);
   update(d => ({ ...d, schoolMasterData: nextMaster, electiveMatrix: nextMatrix }));
   await pushSharedSchoolRoster({ schoolMasterData: nextMaster, electiveMatrix: nextMatrix });
   const myName = cleanMasterLabel(currentUser?.name || live.current.profile.teacher || "");
   if(myName){
    setTimeout(() => applyTeacherScheduleFromMaster(myName, nextMaster, true), 80);
   }
   notify(`기준일자 [${ver.effectiveDate}] 시간표 및 출결 명단 버전으로 전환했습니다!`);
  }

 // 2) [모든 교사 자동/수동 공용] 로그인한 선생님 성함 및 학급 정보를 바탕으로 담임 출결 + 교과 출결 + 주간 시간표를 자동 세팅하는 함수
 function applyTeacherScheduleFromMaster(teacherNameInput, masterOverride = null, silent = false){
  const tName = cleanMasterLabel(teacherNameInput || selectedMasterTeacher || currentUser?.name || live.current.profile.teacher || "");
  const master = masterOverride || live.current.schoolMasterData || {};
  const slots = master.teachers?.[tName] || [];
  const homeroomTeachers = master.homeroomTeachers || {};
  const electiveRosters = master.electiveRosters || {};
  const homeroomRosters = master.homeroomRosters || {};
  const electiveRooms = master.electiveRooms || {};

  // 1순위: 담임 배정표(homeroomTeachers)에서 이 선생님이 맡은 담임 학급 확인
  // 2순위: 가입/로그인 시 계정에 지정한 담임 여부(currentUser.homeroom) 확인
  const assignedHomeroomDept = tName ? (Object.keys(homeroomTeachers).find(dept => cleanMasterLabel(homeroomTeachers[dept]) === tName) || "") : "";
  let targetGrade = Number(currentUser?.grade) || Number(live.current.profile.grade) || 1;
  let targetClassroom = Number(currentUser?.classroom) || Number(live.current.profile.classroom) || 1;
  let isHomeroomTeacher = currentUser?.homeroom !== undefined ? !!currentUser.homeroom : live.current.profile.homeroom;

  if(assignedHomeroomDept && /^[1-3]-\d+$/.test(assignedHomeroomDept)){
   const [g, c] = assignedHomeroomDept.split("-").map(Number);
   targetGrade = g;
   targetClassroom = c;
   isHomeroomTeacher = true;
  } else if(Object.keys(homeroomTeachers).length > 0 && tName && !assignedHomeroomDept){
   // 전교 담임 배정표가 등록되어 있는데 내 이름이 담임 명단에 없으면 비담임(교과전담)으로 자동 분류
   isHomeroomTeacher = false;
  }

  const finalDept = `${targetGrade}-${targetClassroom}`;
  const myHrStudents = isHomeroomTeacher ? getHomeroomStudentsFromMaster(finalDept, master, live.current) : [];

  if(!tName && !myHrStudents.length){
   if(!silent) notify(`선생님의 시간표 또는 학급 명단 데이터가 아직 없습니다. 마스터 관리에서 통합 엑셀을 먼저 업로드해 주세요.`);
   return false;
  }

  const nextTimetable = {};
  const classMap = new Map();

  (slots || []).forEach(({ day: dName, period, subject, room }) => {
   const cleanSubj = String(subject || "").trim();
   const rawRoom = String(room || "").trim();
   const sheetRoom = normalizeDeptCell(rawRoom, 1) || rawRoom;
   if(!cleanSubj || cleanSubj === "0") return;

   // ★ 1순위: 2·3학년 선택과목 장소 시트(electiveRooms)에서 과목+교사명으로 매칭된 장소
   // ★ 2순위: 장소 시트에 없는 과목(예: 1학년 공통과목 등)은 시간표 시트에 적힌 반/장소(sheetRoom) 사용
   const roomFromPlaceSheet = resolveElectiveRoomOverride(cleanSubj, tName, "", electiveRooms);
   const elRoster = matchElectiveRosterFromMaster(cleanSubj, roomFromPlaceSheet || sheetRoom, electiveRosters);
   const finalRoom = roomFromPlaceSheet || elRoster?.room || sheetRoom || "";

   let classId = "";
   let classNameLabel = "";
   let classStudents = [];

   if(elRoster && Array.isArray(elRoster.students) && elRoster.students.length > 0){
    // ① 2·3학년 선택과목 분반: 장소 시트에서 찾은 장소(finalRoom)를 최우선 표기
    const slotTag = elRoster.slot ? `${elRoster.slot}타임` : "선택";
    classId = `cls-el-${normalizeSubjKey(cleanSubj)}-${finalRoom || "all"}`;
    classNameLabel = finalRoom ? `[${slotTag}] ${cleanSubj} (${finalRoom})` : `[${slotTag}] ${cleanSubj}`;
    classStudents = elRoster.students;
   } else if(roomFromPlaceSheet){
    // ② 학생 명단이 아직 없더라도 2·3학년 장소 시트에 등록된 선택과목인 경우 장소 시트 기준 표기
    classId = `cls-el-${normalizeSubjKey(cleanSubj)}-${finalRoom}`;
    classNameLabel = `[선택] ${cleanSubj} (${finalRoom})`;
    classStudents = /^[1-3]-\d+$/.test(finalRoom) ? getHomeroomStudentsFromMaster(finalRoom, master, live.current) : [];
   } else if(/^1-\d+$/.test(finalRoom)){
    // ③ 1학년 학급 단위 수업: 시간표 시트의 해당 학반(예: 1-3)을 수업 장소로 표기
    const cNum = finalRoom.split("-")[1];
    classId = `cls-grade1-${finalRoom}-${normalizeSubjKey(cleanSubj)}`;
    classNameLabel = `1학년 ${cNum}반 (${finalRoom}) - ${cleanSubj}`;
    classStudents = getHomeroomStudentsFromMaster(finalRoom, master, live.current);
   } else if(/^[2-3]-\d+$/.test(finalRoom)){
    // ④ 2·3학년 학급 단위 일반 수업
    classId = `cls-hr-${finalRoom}-${normalizeSubjKey(cleanSubj)}`;
    classNameLabel = `${finalRoom} ${cleanSubj} (${finalRoom})`;
    classStudents = getHomeroomStudentsFromMaster(finalRoom, master, live.current);
   } else {
    classId = `cls-gen-${normalizeSubjKey(cleanSubj)}-${finalRoom || "일반"}`;
    classNameLabel = finalRoom ? `${cleanSubj} (${finalRoom})` : cleanSubj;
    classStudents = [];
   }

   if(!classMap.has(classId)){
    classMap.set(classId, {
     id: classId,
     name: classNameLabel,
     subject: cleanSubj,
     room: finalRoom,
     students: classStudents.map((st, idx) => ({
      ...st,
      id: st.id || `stu-${classId}-${idx + 1}`,
      dept: st.dept || (/^[1-3]-\d+$/.test(finalRoom) ? finalRoom : ""),
      number: Number(st.number) || (idx + 1)
     }))
    });
   }
   nextTimetable[`${dName}-${period}`] = classId;
  });

  const activeSchoolName = currentUser?.school || selectedSchool || live.current.profile.school || "광영고등학교";

  update(d => {
   const resolvedHrStudents = isHomeroomTeacher ? (myHrStudents.length > 0 ? myHrStudents : d.students) : [];
   const homeroomItem = {
    id: "homeroom",
    name: `우리반 (${targetGrade}학년 ${targetClassroom}반 담임 명렬)`,
    subject: "학급",
    students: resolvedHrStudents
   };
   if(classMap.size === 0 && Object.keys(homeroomRosters).length > 0){
    Object.entries(homeroomRosters).sort(([a],[b])=>a.localeCompare(b,"ko",{numeric:true})).forEach(([deptKey, stuArr]) => {
     if(Array.isArray(stuArr) && stuArr.length > 0){
      const [gN, cN] = deptKey.split("-");
      const uId = `cls-grade${gN}-${deptKey}`;
      classMap.set(uId, { id: uId, name: `${gN}학년 ${cN}반 (${deptKey})`, subject: `${gN}학년 학급`, students: stuArr });
     }
    });
   }
   const nextClasses = [homeroomItem, ...Array.from(classMap.values())];
   return {
    ...d,
    profile: {
     ...d.profile,
     school: activeSchoolName,
     teacher: tName || d.profile.teacher,
     grade: targetGrade,
     classroom: targetClassroom,
     homeroom: isHomeroomTeacher
    },
    studio: {
     ...d.studio,
     settings: {
      ...d.studio.settings,
      school: activeSchoolName,
      teacher: tName || d.profile.teacher,
      target: isHomeroomTeacher ? `${targetGrade}학년 ${targetClassroom}반` : (Array.from(classMap.values())[0]?.name || "전학년"),
      location: isHomeroomTeacher ? `${targetGrade}학년 ${targetClassroom}반 교실` : "교실"
     }
    },
    students: resolvedHrStudents,
    subjectClasses: nextClasses,
    timetable: Object.keys(nextTimetable).length > 0 ? nextTimetable : d.timetable
   };
  });

  // 현재 시각의 교시를 확인하여 해당 교시에 배정된 수업반 명단을 즉시 기본 선택! (비담임이면 절대 'homeroom'이 선택되지 않음)
  setTimeout(() => {
   const now = new Date();
   const dayNames = ["일","월","화","수","목","금","토"];
   const todayName = dayNames[now.getDay()];
   const curPt = getCurrentSchoolPeriod(now);
   const targetP = curPt ? curPt.period : activePeriod;
   if(curPt) setActivePeriod(curPt.period);
   const firstSubjId = Array.from(classMap.keys())[0] || Object.values(nextTimetable)[0] || "";
   const scheduledId = nextTimetable[`${todayName}-${targetP}`] || (isHomeroomTeacher ? "homeroom" : firstSubjId);
   if(scheduledId) setActiveClassId(scheduledId);
  }, 50);

  if(!silent){
   const totalLinkedStudents = Array.from(classMap.values()).reduce((acc, c) => acc + (c.students?.length || 0), 0);
   notify(`[${tName}] 선생님 세팅 완료! ${isHomeroomTeacher ? `담임(${finalDept} · ${myHrStudents.length}명) 출결 및 ` : "비담임 교과전담 · "}교과수업반 ${classMap.size}개(수강생 ${totalLinkedStudents}명)가 연결되었습니다.`);
  }
  return true;
 }

// 모든 업로드 진행/완료/실패 시 화면 정중앙 모달 팝업 + 배너 + 토스트 알림을 동시에 띄우는 함수
  function showUploadResult(ok, title, desc, details = "", loading = false, classBreakdown = null, autoCreatedClasses = []){
   const time = new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
   setUploadReport({ ok, title, desc, details, time, loading, classBreakdown, autoCreatedClasses });
   if(!loading){
    if(ok){
     setError("");
     notify(`✅ ${title} — ${desc}`);
    } else {
     setError(`${title}: ${desc} ${details ? `(${details})` : ""}`);
     notify(`❌ ${title} — ${desc}`);
    }
   }
  }

  // CSV/텍스트 파일을 읽을 때 UTF-8 한글 깨짐(EUC-KR/CP949 저장본)까지 자동으로 감지하여 읽어내는 헬퍼
  async function readCsvOrTextFileSmart(file){
   const buf = await file.arrayBuffer();
   const utf8Text = new TextDecoder("utf-8").decode(buf);
   if(utf8Text.includes("\ufffd")){
    try { return new TextDecoder("euc-kr").decode(buf); } catch {}
   }
   return utf8Text;
  }

// [만능 학생 명렬 파서] 어떤 형태의 엑셀/CSV 시트(학년/반/번호/이름, 학번형, 1-1형, 시트별 반 구분형)든 100% 인식
  function extractStudentsFromRows(rows, defaultGrade = 1, forcedSheetDept = ""){
   if(!Array.isArray(rows) || !rows.length) return [];
   const extracted = [];
   const isKoreanName = s => {
    const clean = String(s ?? "").trim().replace(/\s+/g, "");
    if(!clean || /^(이름|성명|학생명|학생성명|비고|연락처|학번|학년|학반|반|번호|연번|출석번호|담임|교사|남|여|합계|계|성별)$/.test(clean)) return false;
    return /^[가-힣]{2,6}[A-Z0-9]?$/.test(clean);
   };

   // 1) 상단 10행 이내에서 가로 다단 배치(예: 1반 | 2반 | 3반 나란히 배치된 표) 여부 먼저 스캔
   let multiColBlocks = [];
   for(let r = 0; r < Math.min(10, rows.length); r++){
    const row = rows[r] || [];
    const blocks = [];
    for(let c = 0; c < row.length; c++){
     const deptCandidate = normalizeDeptCell(row[c], defaultGrade);
     if(deptCandidate){
      blocks.push({ colIdx: c, dept: deptCandidate, headerRow: r });
     }
    }
    if(blocks.length >= 2){
     multiColBlocks = blocks;
     break;
    }
   }

   // A. 가로로 여러 반(1반, 2반, 3반...)이 나란히 배치된 시트인 경우
   if(multiColBlocks.length >= 2){
    const startRow = multiColBlocks[0].headerRow + 1;
    for(let r = startRow; r < rows.length; r++){
     const row = rows[r] || [];
     multiColBlocks.forEach((b, bIdx) => {
      const endCol = bIdx + 1 < multiColBlocks.length ? multiColBlocks[bIdx + 1].colIdx : row.length;
      const slice = row.slice(b.colIdx, Math.min(endCol, b.colIdx + 5)).map(x => String(x ?? "").trim());
      if(!slice.length) return;
      let num = 0, name = "";
      for(let i = 0; i < slice.length; i++){
       const cell = slice[i];
       if(!num && /^\d{1,2}번?$/.test(cell)){
        num = Number(cell.replace(/\D/g, ""));
       } else if(!num && /^\d{4,5}$/.test(cell)){
        const pid = parseStudentIdCode(cell, defaultGrade, b.dept.split("-")[1], r - startRow + 1);
        num = pid.number;
       } else if(!name && isKoreanName(cell)){
        name = cell.replace(/\s+/g, "");
       }
      }
      if(name){
       extracted.push({ dept: b.dept, number: num || (r - startRow + 1), name, phone: "", parentPhone: "" });
      }
     });
    }
    if(extracted.length > 0) return extracted;
   }

   // B. 일반 세로 목록형 CSV/엑셀 스캔 (헤더 자동 감지 + 행별 패턴 매칭)
   let idxHakbun = -1, idxGrade = -1, idxClass = -1, idxNum = -1, idxName = -1, idxPhone = -1, idxParentPhone = -1;
   let headerRowIdx = -1;

   for(let r = 0; r < Math.min(10, rows.length); r++){
    const row = (rows[r] || []).map(x => String(x ?? "").replace(/^['"\s]+|['"\s]+$/g, ""));
    const nameCol = row.findIndex(c => /^(이름|성명|학생명|학생성명)$/.test(c));
    if(nameCol >= 0){
     headerRowIdx = r;
     idxName = nameCol;
     idxHakbun = row.findIndex(c => /학번/.test(c));
     idxGrade = row.findIndex(c => /^(학년|대상학년)$/.test(c));
     idxClass = row.findIndex((c, i) => i !== idxGrade && /^(학반|반|학급|교실)$/.test(c));
     idxNum = row.findIndex(c => /^(번호|연번|출석번호|순번)$/.test(c));
     idxPhone = row.findIndex(c => /학생.*연락처|휴대폰|전화번호|^연락처$/.test(c));
     idxParentPhone = row.findIndex(c => /보호자|학부모/.test(c));
     break;
    }
   }

   let currentContextDept = forcedSheetDept || "";
   const startR = headerRowIdx >= 0 ? headerRowIdx + 1 : 0;

   for(let r = startR; r < rows.length; r++){
    const row = (rows[r] || []).map(x => String(x ?? "").replace(/^['"\s]+|['"\s]+$/g, ""));
    if(!row.some(Boolean)) continue;

    // 행 중간에 '1학년 2반', '2반', '1-2' 같은 반 제목 행이 단독으로 나오면 컨텍스트 갱신
    if(row.filter(Boolean).length <= 2 && !row.some(isKoreanName)){
     const maybeDept = normalizeDeptCell(row.find(Boolean), defaultGrade);
     if(maybeDept){
      currentContextDept = maybeDept;
      continue;
     }
    }

    // 1) 헤더가 있는 CSV/엑셀인 경우
    if(idxName >= 0 && row[idxName]){
     const rawName = row[idxName].replace(/\s+/g, "");
     if(!isKoreanName(rawName)) continue;
     let dept = "";
     let num = 0;
     const gVal = (idxGrade >= 0 && row[idxGrade]) ? (Number(row[idxGrade].replace(/\D/g, "")) || defaultGrade) : defaultGrade;

     if(idxHakbun >= 0 && row[idxHakbun]){
      const cleanHb = row[idxHakbun].replace(/\.0$/, "").replace(/\D/g, "");
      if(/^[1-6]\d{3,4}$/.test(cleanHb)){
       const pid = parseStudentIdCode(cleanHb, gVal, "", r - startR + 1);
       dept = pid.dept;
       num = pid.number;
      }
     }
     if(!dept && idxClass >= 0 && row[idxClass]){
      const rawCls = row[idxClass];
      const norm = normalizeDeptCell(rawCls, gVal);
      if(norm){
       dept = norm;
      } else {
       const onlyDigits = Number(rawCls.replace(/\D/g, ""));
       if(onlyDigits >= 1 && onlyDigits <= 30) dept = `${gVal}-${onlyDigits}`;
      }
     }
     if(!dept) dept = currentContextDept || `${gVal}-1`;
     if(!num && idxNum >= 0 && row[idxNum]){
      num = Number(row[idxNum].replace(/\D/g, "")) || 0;
     }
     if(!num){
      num = extracted.filter(x => x.dept === dept).length + 1;
     }

     extracted.push({
      dept,
      number: num,
      name: rawName,
      phone: idxPhone >= 0 ? (row[idxPhone] || "") : "",
      parentPhone: idxParentPhone >= 0 ? (row[idxParentPhone] || "") : ""
     });
     continue;
    }

    // 2) 헤더 없이 바로 데이터가 나오는 경우: 각 행의 셀 패턴으로 학번/학반/번호/이름 자동 판별
    let rowDept = "";
    let rowNum = 0;
    let rowName = "";
    let phones = [];
    const smallNums = [];

    for(let c = 0; c < row.length; c++){
     const cell = row[c];
     if(!cell) continue;
     const cleanDigits = cell.replace(/\.0$/, "").trim();

     // 5자리 또는 4자리 학번 (예: 10101, 10215)
     if(!rowDept && /^[1-6]\d{3,4}$/.test(cleanDigits)){
      const pid = parseStudentIdCode(cleanDigits, defaultGrade, "", 1);
      rowDept = pid.dept;
      rowNum = pid.number;
      continue;
     }
     // 학반 표기 (예: '1-1', '1학년 1반', '1월 1일', '1반')
     if(!rowDept){
      const dCand = normalizeDeptCell(cell, defaultGrade);
      if(dCand){
       rowDept = dCand;
       continue;
      }
     }
     // 전화번호
     if(/^01[016789][-\s.]?\d{3,4}[-\s.]?\d{4}$/.test(cell)){
      phones.push(cell);
      continue;
     }
     // 한글 성명
     if(!rowName && isKoreanName(cell)){
      rowName = cell.replace(/\s+/g, "");
      continue;
     }
     // 일반 숫자 (학년, 반, 번호 후보)
     if(/^\d{1,2}번?$/.test(cleanDigits)){
      const nVal = Number(cleanDigits.replace(/\D/g, ""));
      if(nVal >= 1 && nVal <= 60) smallNums.push(nVal);
     }
    }

    if(rowName){
     // 만약 학반(rowDept)이 안 잡혔는데 앞쪽에 작은 숫자가 2개 이상(예: [1, 3, 15, 홍길동] 또는 [3, 15, 홍길동]) 있으면 반·번호로 자동 인식!
     if(!rowDept && smallNums.length >= 3 && smallNums[0] >= 1 && smallNums[0] <= 3){
      rowDept = `${smallNums[0]}-${smallNums[1]}`;
      rowNum = smallNums[2];
     } else if(!rowDept && smallNums.length === 2 && !currentContextDept){
      rowDept = `${defaultGrade}-${smallNums[0]}`;
      rowNum = smallNums[1];
     } else if(!rowNum && smallNums.length >= 1){
      rowNum = smallNums[smallNums.length - 1];
     }
     const finalDept = rowDept || currentContextDept || forcedSheetDept || `${defaultGrade}-1`;
     extracted.push({
      dept: finalDept,
      number: rowNum || (extracted.filter(x => x.dept === finalDept).length + 1),
      name: rowName,
      phone: phones[0] || "",
      parentPhone: phones[1] || ""
     });
    }
   }
   return extracted;
  }

// ★ [1학년 반 = 교과수업반 일원화] 1학년은 과목 구분 없이 '1학년 1반 (1-1)' ~ '1학년 7반 (1-7)' 자체가 담임반이자 교과수업반이 됩니다!
  function buildAutoLinkedSubjectClasses(existingClasses, nextHrRosters){
   // 기존 수업반 중 과목명이 붙어 중복 생성된 1학년 반(예: '1-1 공통국어')은 제거하여 깔끔하게 통합
   const classList = (existingClasses || []).filter(c => {
    if(c.id === "homeroom") return true;
    if(/^cls-hr-1-\d+/.test(c.id)) return false;
    return true;
   });
   const autoCreatedNames = [];

   // 업로드된 모든 학반(1-1 ~ 1-7 등)을 순서대로 단일 학급/수업반으로 등록·갱신
   Object.keys(nextHrRosters).sort((a,b) => a.localeCompare(b, "ko", {numeric:true})).forEach(dept => {
    const stuList = nextHrRosters[dept];
    if(!Array.isArray(stuList) || !stuList.length) return;
    const [gNum, cNum] = dept.split("-");
    const unifiedId = `cls-grade${gNum}-${dept}`;
    const unifiedName = `${gNum}학년 ${cNum}반 (${dept})`;

    const existIdx = classList.findIndex(c => c.id === unifiedId || c.name === unifiedName || c.id === `cls-grade1-${dept}`);
    if(existIdx >= 0){
     classList[existIdx] = {
      ...classList[existIdx],
      id: unifiedId,
      name: unifiedName,
      subject: `${gNum}학년 학급`,
      students: stuList
     };
    } else {
     classList.push({
      id: unifiedId,
      name: unifiedName,
      subject: `${gNum}학년 학급`,
      students: stuList
     });
    }
    autoCreatedNames.push(`${unifiedName}: ${stuList.length}명`);
   });

   return { updatedClasses: classList, autoCreatedNames };
  }

  // CSV 한 줄을 안전하게 쪼개는 헬퍼 (따옴표·세미콜론·탭 완벽 호환)
  function splitCsvLineSafe(line){
   if(line.includes("\t")) return line.split("\t").map(c => c.replace(/^['"\s]+|['"\s]+$/g, ""));
   if(!line.includes(",") && line.includes(";")) return line.split(";").map(c => c.replace(/^['"\s]+|['"\s]+$/g, ""));
   return line.split(",").map(c => c.replace(/^['"\s]+|['"\s]+$/g, ""));
  }

  // 담임교사 배정표(.csv / .xlsx) 업로드 처리 함수
  async function importHomeroomTeachersCSV(file){
   if(!file) return;
   setBusy(`📂 [${file.name}] 담임교사 배정표를 분석하고 있습니다...`);
   showUploadResult(true, `⏳ [${file.name}] 담임 배정표 분석 중...`, "학급별 담임 선생님 성함을 읽고 있습니다.", "", true);
   try {
    let rows = [];
    if(/\.xlsx?$/i.test(file.name)){
     if(!window.XLSX) throw Error("엑셀 라이브러리를 준비 중입니다. 잠시 후 다시 시도해 주세요.");
     const buf = await file.arrayBuffer();
     const wb = window.XLSX.read(buf, { type: "array", raw: false });
     wb.SheetNames.forEach(sn => {
      const sheetRows = window.XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, defval: "", raw: false });
      rows.push(...sheetRows);
     });
    } else {
     const txt = await readCsvOrTextFileSmart(file);
     rows = txt.replace(/^\ufeff/,"").split(/\r?\n/).map(r=>r.trim()).filter(Boolean).map(splitCsvLineSafe);
    }

    const nextHrTeachers = { ...(live.current.schoolMasterData?.homeroomTeachers || {}) };
    let count = 0;
    rows.forEach(r => {
     if(!Array.isArray(r) || r.length < 2) return;
     const dept = normalizeDeptCell(r[0], live.current.profile?.grade || 1);
     const tName = cleanMasterLabel(String(r[1] ?? "").trim());
     if(dept && tName && !/^(담임|교사|담임교사|담임교사명|성명|이름)$/.test(tName)){
      nextHrTeachers[dept] = tName;
      count++;
     }
    });

    if(count === 0){
     showUploadResult(false, `[${file.name}] 담임 배정 인식 실패 (0건)`, "파일에서 [학반, 담임교사명] 형식을 찾지 못했습니다.", "예: 1학년 1반, 홍길동 또는 1-1, 홍길동 형식인지 확인해 주세요.", false);
     return;
    }

    const updatedMaster = {
     ...(live.current.schoolMasterData || {}),
     homeroomTeachers: nextHrTeachers,
     updatedAt: new Date().toISOString()
    };
    update(d => ({ ...d, schoolMasterData: updatedMaster }));
    showUploadResult(true, `[${file.name}] 담임교사 배정 완료!`, `총 ${count}개 학급의 담임 선생님 배정을 등록했습니다.`, `등록 학급: ${Object.entries(nextHrTeachers).map(([k,v])=>`${k}(${v})`).join(", ")}`, false);
    pushSharedSchoolRoster({ schoolMasterData: updatedMaster }).catch(()=>{});
   } catch(err) {
    showUploadResult(false, `[${file.name}] 업로드 오류`, err.message, "", false);
   } finally {
    setBusy("");
   }
  }

  // ★ [전교생_각반학생명단_양식.csv 완벽 검증 완료] 1학년 1~7반(215명) 즉시 등록 + 클라우드 덮어쓰기 방지 + 완료 팝업 즉시 표시
  async function importAllHomeroomRostersFileOrText(input){
   const fileName = input instanceof File ? input.name : "CSV 학생 명단";
   const gradeMatch = fileName.match(/([1-3])\s*학년/);
   const inferredGrade = gradeMatch ? Number(gradeMatch[1]) : (live.current.profile?.grade || 1);

   // ★ 5초마다 도는 클라우드 읽기 타이머가 업로드 도중 옛날 데이터로 덮어쓰지 못하게 잠금!
   sharedLockRef.current = true;
   setBusy(`📂 [${fileName}] 학생 명단을 분석하여 학급 및 수업반에 반영 중입니다...`);
   showUploadResult(true, `⏳ [${fileName}] 명단 분석 및 등록 진행 중...`, "파일에서 학반·번호·학생 이름을 읽어 등록하고 있습니다.", "", true);

   await new Promise(res => setTimeout(res, 60));

   try{
    let allExtracted = [];

    if(typeof input === "string"){
     const lines = input.replace(/^\ufeff/,"").split(/\r?\n/).map(r=>r.trim()).filter(Boolean);
     const rows = lines.map(splitCsvLineSafe);
     allExtracted = extractStudentsFromRows(rows, inferredGrade);
    } else if(input instanceof File){
     if(/\.xlsx?$/i.test(input.name)){
      if(!window.XLSX) throw Error("엑셀(XLSX) 라이브러리가 아직 로드되지 않았습니다. 잠시 후 다시 시도해 주세요.");
      const buf = await input.arrayBuffer();
      const wb = window.XLSX.read(buf, { type: "array", raw: false });

      wb.SheetNames.forEach((sn, sIdx) => {
       const sheetRows = window.XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, defval: "", raw: false });
       if(!sheetRows || !sheetRows.length) return;
       const snClean = sn.replace(/\s+/g, "");
       const snGradeMatch = snClean.match(/([1-3])학년/);
       const sheetGrade = snGradeMatch ? Number(snGradeMatch[1]) : inferredGrade;
       let sheetDept = normalizeDeptCell(snClean, sheetGrade);
       if(!sheetDept){
        const classOnlyMatch = snClean.match(/(?:^|제)0?([1-9]|1\d)반?$/);
        if(classOnlyMatch) sheetDept = `${sheetGrade}-${Number(classOnlyMatch[1])}`;
       }
       const sheetExtracted = extractStudentsFromRows(sheetRows, sheetGrade, sheetDept || (wb.SheetNames.length > 1 ? `${sheetGrade}-${sIdx + 1}` : ""));
       if(sheetExtracted.length > 0) allExtracted.push(...sheetExtracted);
      });
     } else {
      const txt = await readCsvOrTextFileSmart(input);
      const lines = txt.replace(/^\ufeff/,"").split(/\r?\n/).map(r=>r.trim()).filter(Boolean);
      const rows = lines.map(splitCsvLineSafe);
      allExtracted = extractStudentsFromRows(rows, inferredGrade);
     }
    }

    // 중복 제거 (학반 + 번호 + 이름 기준)
    const uniqMap = new Map();
    allExtracted.forEach(item => {
     if(item.dept && item.name){
      uniqMap.set(`${item.dept}_${item.number}_${item.name}`, item);
     }
    });
    const finalExtracted = Array.from(uniqMap.values());

    if(!finalExtracted.length){
     showUploadResult(
      false,
      `[${fileName}] 명단 인식 실패 (0건)`,
      "파일에서 학반(예: 1학년 1반, 1-1)과 학생 한글 이름을 찾지 못했습니다.",
      "CSV 첫 줄에 [학반, 번호, 이름] 열이 있는지 확인해 주세요.",
      false
     );
     return;
    }

    const nextHrRosters = { ...(live.current.schoolMasterData?.homeroomRosters || {}) };
    const touchedDepts = new Set();

    finalExtracted.forEach((item) => {
     if(!touchedDepts.has(item.dept)){
      nextHrRosters[item.dept] = [];
      touchedDepts.add(item.dept);
     }
     const stuNum = item.number || (nextHrRosters[item.dept].length + 1);
     nextHrRosters[item.dept].push({
      id: `stu-${item.dept}-${stuNum}-${item.name}`,
      number: stuNum,
      dept: item.dept,
      name: item.name,
      phone: item.phone || "",
      parentPhone: item.parentPhone || "",
      memo: "",
      submitted: false
     });
    });

    Object.values(nextHrRosters).forEach(list => list.sort((a,b) => a.number - b.number));

    const updatedMaster = {
     ...(live.current.schoolMasterData || {}),
     homeroomRosters: nextHrRosters,
     updatedAt: new Date().toISOString()
    };

    const sortedDepts = Array.from(touchedDepts).sort((a,b) => a.localeCompare(b, "ko", {numeric:true}));
    const myDept = `${live.current.profile.grade}-${live.current.profile.classroom}`;
    const targetDeptForHomeroom = nextHrRosters[myDept]?.length ? myDept : sortedDepts[0];
    const [targetG, targetC] = targetDeptForHomeroom.split("-").map(Number);

    let autoCreatedList = [];
    let syncedSubjectClasses = [];

    update(d => {
     const { updatedClasses, autoCreatedNames } = buildAutoLinkedSubjectClasses(
      d.subjectClasses,
      nextHrRosters
     );
     autoCreatedList = autoCreatedNames;
     syncedSubjectClasses = updatedClasses;
     const myNewStudents = nextHrRosters[targetDeptForHomeroom] || d.students;

     // 'homeroom'(우리반) 항목의 학생 명단도 즉시 동기화
     const finalClasses = updatedClasses.map(c =>
      c.id === "homeroom"
       ? { ...c, name: `우리반 (${targetG}학년 ${targetC}반 담임 명렬)`, students: myNewStudents }
       : c
     );

     return {
      ...d,
      profile: {
       ...d.profile,
       grade: targetG || d.profile.grade,
       classroom: targetC || d.profile.classroom
      },
      students: myNewStudents,
      subjectClasses: finalClasses,
      schoolMasterData: updatedMaster
     };
    });

    setActiveClassId("homeroom");

    const breakdown = sortedDepts.map(dKey => ({ dept: dKey, count: (nextHrRosters[dKey] || []).length }));
    const totalAllDepts = Object.keys(nextHrRosters).length;
    const totalAllStus = Object.values(nextHrRosters).reduce((a, b) => a + (b?.length || 0), 0);

    // ★ 화면 정중앙에 학급별 인원(1-1: 30명, 1-2: 31명 ... 총 215명) 완료 모달 팝업을 즉시 띄움!
    showUploadResult(
     true,
     `✅ [${fileName}] 총 ${touchedDepts.size}개 학급 · ${finalExtracted.length}명 업로드 완료!`,
     `1학년 1반~7반 명단이 담임반 및 교과수업반(1학년 1반 ~ 1학년 7반)으로 즉시 통합 등록되었습니다.`,
     `전교 누적 등록 현황: 총 ${totalAllDepts}개 학급 · ${totalAllStus}명 (아래 [출결 화면에서 바로 확인하기]를 누르시면 반영된 명단이 바로 보입니다!)`,
     false,
     breakdown,
     autoCreatedList
    );

    // 서버에도 안전하게 저장한 뒤 타이머 잠금 해제
    await pushSharedSchoolRoster({
     schoolMasterData: updatedMaster,
     subjectClasses: syncedSubjectClasses.filter(c => c.id !== "homeroom")
    }).catch(()=>{});
   }catch(err){
    showUploadResult(false, `[${fileName}] 업로드 오류`, err.message, "CSV/엑셀 파일 형식을 확인해 주세요.", false);
   }finally{
    sharedLockRef.current = false;
    setBusy("");
   }
  }
// 담임·교과교사·업무담당자가 수정한 시간표나 수업반 명단을 마스터 공용 채널에 즉시 반영하는 함수
  async function syncMyChangesToSchoolMaster(){
   const myName = cleanMasterLabel(currentUser?.name || data.profile.teacher || "");
   if(!myName){ notify("먼저 내 프로필에서 선생님 성함을 입력해 주세요."); return; }

   const cur = live.current;
   const master = cur.schoolMasterData || { teachers:{}, classTimetables:{}, homeroomRosters:{}, electiveRosters:{}, homeroomTeachers:{}, versions:[], effectiveDate: day() };
   const nextTeachers = { ...(master.teachers || {}) };
   const nextHrRosters = { ...(master.homeroomRosters || {}) };
   const nextElRosters = { ...(master.electiveRosters || {}) };

   // 1) 내가 수정한 주간 시간표를 마스터 교사 시간표에 반영
   const mySlots = [];
   Object.entries(cur.timetable || {}).forEach(([key, clsId]) => {
    if(!clsId) return;
    const [dName, pStr] = key.split("-");
    const period = Number(pStr);
    if(!dName || !period) return;
    if(clsId === "homeroom"){
     mySlots.push({ day: dName, period, subject: "자율", room: `${cur.profile.grade}-${cur.profile.classroom}` });
    } else {
     const found = (cur.subjectClasses || []).find(c => c.id === clsId);
     if(found){
      const roomMatch = found.name.match(/\(([1-3]-\d+)\)$/) || found.name.match(/^([1-3]-\d+)\s+/);
      const room = roomMatch ? roomMatch[1] : "";
      mySlots.push({ day: dName, period, subject: found.subject || found.name, room });
     }
    }
   });
   if(mySlots.length > 0) nextTeachers[myName] = mySlots;

   // 2) 담임반 명렬(전출·자퇴·전입 포함)을 마스터 원반 명렬에 반영
   const myDept = `${cur.profile.grade}-${cur.profile.classroom}`;
   if(cur.profile.homeroom && Array.isArray(cur.students) && cur.students.length > 0){
    nextHrRosters[myDept] = cur.students;
   }

   // 3) 교과 수업반 명단 변경 사항도 마스터 선택과목 명단에 반영
   (cur.subjectClasses || []).filter(c => c.id !== "homeroom").forEach(cls => {
    const cleanSubj = String(cls.subject || "").trim();
    if(cleanSubj && nextElRosters[cleanSubj]){
     nextElRosters[cleanSubj] = { ...nextElRosters[cleanSubj], students: cls.students || [] };
    }
   });

   const updatedMaster = {
    ...master,
    teachers: nextTeachers,
    homeroomRosters: nextHrRosters,
    electiveRosters: nextElRosters,
    updatedAt: new Date().toISOString()
   };

   update(d => ({ ...d, schoolMasterData: updatedMaster }));
   await pushSharedSchoolRoster({ schoolMasterData: updatedMaster });
   notify(`[${myName}] 선생님이 수정하신 시간표와 출결 명단을 전교 공용 채널에 즉시 반영했습니다!`);
  }

  // 4) [일반 교사 · 담임 교사 공용] 학기 중 전입생 추가 / 전출·자퇴 표시(소프트 삭제·복원 가능) / 선택과목 변경 시 전교 전체 명단에 즉시 동기화하는 함수
  async function handleTeacherStudentChange({ mode, dept, number, name, newName, leaveType = "전출", leaveDate = day(), choicesObj = {} }){
   const cleanDept = String(dept || `${live.current.profile.grade}-${live.current.profile.classroom}`).trim();
   const cleanNum = Number(number) || 1;
   const cleanName = String(name || "").trim();
   const targetName = String(newName || cleanName).trim();
   const effLeaveDate = validDate(leaveDate) ? leaveDate : day();
   if(!cleanDept || !cleanName){
    notify("대상 학생의 학반, 번호, 성명을 정확히 입력해 주세요.");
    return;
   }

   let syncedMaster = null;
   let syncedMatrix = null;

   update(d => {
    const master = d.schoolMasterData || { teachers:{}, classTimetables:{}, homeroomRosters:{}, electiveRosters:{}, updatedAt:"" };
    const hrRosters = { ...(master.homeroomRosters || {}) };
    const elRosters = { ...(master.electiveRosters || {}) };
    const em = d.electiveMatrix || { headers:["A","B","C","D"], rows:[], periodSlotMap:{} };
    const nextHeaders = [...(em.headers || [])];
    let nextMatrixRows = [...(em.rows || [])];

    const curHrList = [...(hrRosters[cleanDept] || (cleanDept === `${d.profile.grade}-${d.profile.classroom}` ? d.students : []))];

    if(mode === "remove"){
     // 전출·자퇴 소프트 삭제: 명단에서 아예 지우지 않고 leaveType("전출"|"자퇴"|"위탁")과 leaveDate를 기록하여 담임반에서는 흐린 글씨(복원 가능), 교과반에서는 빨간색 취소선으로 표시!
     const lType = leaveType || "전출";
     const existIdx = curHrList.findIndex(s => s.name === cleanName || (s.number === cleanNum && s.name === cleanName));
     if(existIdx >= 0){
      curHrList[existIdx] = { ...curHrList[existIdx], leaveType: lType, leaveDate: effLeaveDate };
     } else {
      curHrList.push({
       id: `stu-${cleanDept}-${cleanNum}-${cleanName}`,
       number: cleanNum,
       dept: cleanDept,
       name: cleanName,
       phone: "",
       parentPhone: "",
       memo: `${lType}(${effLeaveDate})`,
       leaveType: lType,
       leaveDate: effLeaveDate,
       submitted: false
      });
     }
     curHrList.sort((a,b) => a.number - b.number);
     hrRosters[cleanDept] = curHrList;

     // 모든 선택과목 분반 명단에서도 해당 학생에게 leaveType, leaveDate 부여 (빨간색 취소선 연동)
     Object.keys(elRosters).forEach(k => {
      const updatedStudents = (elRosters[k].students || []).map(s =>
       (s.dept === cleanDept && s.name === cleanName) ? { ...s, leaveType: lType, leaveDate: effLeaveDate } : s
      );
      elRosters[k] = { ...elRosters[k], students: updatedStudents };
     });
     nextMatrixRows = nextMatrixRows.map(r =>
      (r.dept === cleanDept && r.name === cleanName) ? { ...r, leaveType: lType, leaveDate: effLeaveDate } : r
     );
    } else if(mode === "restore"){
     // 학적 복원: 전출·자퇴 표시(leaveType, leaveDate)를 제거하여 담임반 및 모든 교과 출석부에서 즉시 정상 재학생으로 복구!
     hrRosters[cleanDept] = curHrList.map(s =>
      (s.name === cleanName || (s.number === cleanNum && s.name === cleanName)) ? { ...s, leaveType: "", leaveDate: "" } : s
     );
     Object.keys(elRosters).forEach(k => {
      const updatedStudents = (elRosters[k].students || []).map(s =>
       (s.dept === cleanDept && s.name === cleanName) ? { ...s, leaveType: "", leaveDate: "" } : s
      );
      elRosters[k] = { ...elRosters[k], students: updatedStudents };
     });
     nextMatrixRows = nextMatrixRows.map(r =>
      (r.dept === cleanDept && r.name === cleanName) ? { ...r, leaveType: "", leaveDate: "" } : r
     );
    } else {
     // 전입생 추가(add) 또는 기존 학생 이름·번호·선택과목 변경(update)
     const existHrIdx = curHrList.findIndex(s => s.name === cleanName || s.number === cleanNum);
     const prevStu = existHrIdx >= 0 ? curHrList[existHrIdx] : null;
     const stuObj = {
      id: prevStu ? prevStu.id : `stu-${cleanDept}-${cleanNum}-${targetName}`,
      number: cleanNum,
      dept: cleanDept,
      name: targetName,
      phone: prevStu ? (prevStu.phone || "") : "",
      parentPhone: prevStu ? (prevStu.parentPhone || "") : "",
      memo: mode === "add" ? `전입(${effLeaveDate})` : (prevStu ? prevStu.memo : ""),
      leaveType: "",
      leaveDate: "",
      submitted: false
     };
     if(existHrIdx >= 0) curHrList[existHrIdx] = stuObj;
     else curHrList.push(stuObj);
     curHrList.sort((a,b) => a.number - b.number);
     hrRosters[cleanDept] = curHrList;

     // 선택과목 배정 반영 (입력된 타임별 선택과목이 있는 경우)
     const validChoices = Object.entries(choicesObj).filter(([, v]) => hasText(v));
     if(validChoices.length > 0){
      validChoices.forEach(([slot, subjVal]) => {
       const cleanSlot = slot.trim();
       const cleanSubj = subjVal.trim();
       if(!nextHeaders.includes(cleanSlot)) nextHeaders.push(cleanSlot);

       Object.keys(elRosters).forEach(k => {
        if(elRosters[k]?.slot === cleanSlot && k !== cleanSubj){
         const filtered = (elRosters[k].students || []).filter(s => !(s.dept === cleanDept && (s.name === cleanName || s.name === targetName)));
         elRosters[k] = { ...elRosters[k], students: filtered.map((st, idx) => ({ ...st, number: idx + 1 })) };
        }
       });

       if(cleanSubj !== "-" && cleanSubj !== "공강"){
        if(!elRosters[cleanSubj]){
         elRosters[cleanSubj] = { subject: cleanSubj, slot: cleanSlot, grade: Number(cleanDept[0]) || 2, students: [] };
        }
        const curElList = [...(elRosters[cleanSubj].students || [])];
        const exElIdx = curElList.findIndex(s => s.dept === cleanDept && (s.name === cleanName || s.name === targetName));
        const elStu = {
         id: exElIdx >= 0 ? curElList[exElIdx].id : `el-${cleanSubj}-${cleanDept}-${cleanNum}`,
         number: exElIdx >= 0 ? curElList[exElIdx].number : (curElList.length + 1),
         dept: cleanDept,
         name: targetName,
         phone: "",
         parentPhone: "",
         memo: mode === "add" ? `원번:${cleanNum}번·전입(${effLeaveDate})` : `원번:${cleanNum}번`,
         leaveType: "",
         leaveDate: "",
         submitted: false
        };
        if(exElIdx >= 0) curElList[exElIdx] = elStu;
        else curElList.push(elStu);
        elRosters[cleanSubj] = { ...elRosters[cleanSubj], students: curElList };
       }
      });

      const mxIdx = nextMatrixRows.findIndex(r => r.dept === cleanDept && (r.name === cleanName || r.number === cleanNum));
      const mergedChoices = mxIdx >= 0 ? { ...(nextMatrixRows[mxIdx].choices || {}) } : {};
      validChoices.forEach(([sl, sb]) => { mergedChoices[sl.trim()] = sb.trim(); });
      if(mxIdx >= 0){
       nextMatrixRows[mxIdx] = { ...nextMatrixRows[mxIdx], number: cleanNum, name: targetName, leaveType: "", leaveDate: "", choices: mergedChoices };
      } else {
       nextMatrixRows.push({ id: `mx-${cleanDept}-${cleanNum}-${targetName}`, dept: cleanDept, number: cleanNum, name: targetName, leaveType: "", leaveDate: "", choices: mergedChoices });
      }
     }
    }

    syncedMaster = { ...master, homeroomRosters: hrRosters, electiveRosters: elRosters, updatedAt: new Date().toISOString() };
    syncedMatrix = { ...em, headers: nextHeaders, rows: nextMatrixRows };

    // 원반(hrRosters)의 전출·자퇴 상태가 모든 교과 수업반(d.subjectClasses)에도 즉시 반영되도록 동기화
    const syncLeaveState = (stuList) => (stuList || []).map(st => {
     const stDept = st.dept || cleanDept;
     const hrMatchStu = (hrRosters[stDept] || []).find(h => h.name === st.name);
     return hrMatchStu ? { ...st, leaveType: hrMatchStu.leaveType || "", leaveDate: hrMatchStu.leaveDate || "", memo: hrMatchStu.memo || st.memo } : st;
    });

    const myDept = `${d.profile.grade}-${d.profile.classroom}`;
    const updatedSubjectClasses = (d.subjectClasses || []).map(cls => {
     const cleanSubj = String(cls.subject || "").trim();
     const cleanSubjNoWon = cleanSubj.replace(/\(원\)$/,"").trim();
     if(elRosters[cleanSubj]) return { ...cls, students: syncLeaveState(elRosters[cleanSubj].students) };
     if(elRosters[cleanSubjNoWon]) return { ...cls, students: syncLeaveState(elRosters[cleanSubjNoWon].students) };
     const hrMatch = cls.name.match(/^([1-3]-\d+)\s+/);
     if(hrMatch && hrRosters[hrMatch[1]]) return { ...cls, students: hrRosters[hrMatch[1]] };
     return { ...cls, students: syncLeaveState(cls.students) };
    });

    return {
     ...d,
     students: cleanDept === myDept ? (hrRosters[myDept] || d.students) : d.students,
     subjectClasses: updatedSubjectClasses,
     electiveMatrix: syncedMatrix,
     schoolMasterData: syncedMaster
    };
   });

   if(syncedMaster){
    await pushSharedSchoolRoster({
     schoolMasterData: syncedMaster,
     electiveMatrix: syncedMatrix
    });
   }
   notify(`[${cleanDept} ${cleanNum}번 ${targetName}] 학생의 ${mode==="remove"?`${leaveType}(취소선 표시)`:mode==="restore"?"재학 복원":mode==="add"?"전입 등록":"정보·선택과목 수정"} 사항이 전교 모든 선생님의 출석부에 즉시 반영되었습니다!`);
  }

 // 5) 비정형 시간표·선택과목 자료(PDF 또는 텍스트) Gemini AI 분석 함수
 function runAIScheduleAndRosterAnalyze(){
  if(!aiScheduleText.trim() && !aiSchedulePdf){
   setError("분석할 시간표·선택과목 텍스트를 붙여넣거나 PDF 파일을 업로드해 주세요.");
   return;
  }
  run("AI가 시간표와 선택과목 학생 명단을 분석하여 자동 매칭 중...", async(signal, current) => {
   const chosen = models.find(m => m.id === model);
   const gen = {
    temperature: 0.1,
    maxOutputTokens: chosen?.outputLimit ? Math.min(16000, chosen.outputLimit) : 16000,
    responseMimeType: "application/json",
    responseSchema: responseSchema(TEMPLATES.aiScheduleBundle)
   };
   if(model === "gemini-2.5-flash") gen.thinkingConfig = { thinkingBudget: 0 };

   const targetTeacher = selectedMasterTeacher || currentUser?.name || data.profile.teacher || "";
   const prompt = `당신은 한국 고등학교 교육과정 및 시간표 데이터 구조화 전문가입니다.
제공된 시간표/선택과목 자료(텍스트 또는 PDF)를 분석하여 다음 JSON 구조로 정확히 추출하세요.
- 대상 교사명(teacherName): "${targetTeacher}"
- slots: 요일(월/화/수/목/금), 교시(1~7 정수), 과목명(subject), 강의실 또는 대상학반(room, 예: "1-6", "3-2") 배열
- rosters: 자료에 포함된 수업반/선택과목별 학생 명단 배열 (className: 반/분반 이름, subject: 과목명, slot: 타임코드, students: [{number, dept(예: "2-1"), name}])
- 교사 입력 텍스트:
${aiScheduleText}`;

   const parts = [{ text: prompt }];
   if(aiSchedulePdf) parts.push({ inlineData: { mimeType: "application/pdf", data: aiSchedulePdf.base64 } });

   const r = await fetch(API + "/models/" + encodeURIComponent(model) + ":generateContent", {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-goog-api-key": apiKey.trim() },
    body: JSON.stringify({ contents: [{ role: "user", parts }], generationConfig: gen }),
    signal
   });
   const v = await r.json();
   if(!r.ok) throw Error("AI 시간표 분석 실패 (HTTP " + r.status + ")");
   const raw = v.candidates?.[0]?.content?.parts?.filter(p => isText(p.text) && !p.thought).map(p => p.text).join("") || "";
   const parsed = JSON.parse(raw.slice(raw.indexOf("{"), raw.lastIndexOf("}") + 1));
   if(!valid("aiScheduleBundle", parsed)) throw Error("AI 분석 결과 구조 검증에 실패했습니다.");
   if(!current()) return;

   update(d => {
    const nextClasses = [...(d.subjectClasses || [])];
    const nextTimetable = { ...(d.timetable || {}) };

    (parsed.rosters || []).forEach(rItem => {
     if(!rItem.className) return;
     const cId = "cls-ai-" + uid();
     const existIdx = nextClasses.findIndex(c => c.id !== "homeroom" && (c.name === rItem.className || c.subject === rItem.subject));
     const stuList = (rItem.students || []).map((s, i) => ({
      id: uid(),
      number: Number(s.number) || (i + 1),
      dept: s.dept || "",
      name: s.name,
      phone: "",
      parentPhone: "",
      memo: "",
      submitted: false
     }));
     if(existIdx >= 0){
      nextClasses[existIdx] = { ...nextClasses[existIdx], students: stuList.length ? stuList : nextClasses[existIdx].students };
     } else {
      nextClasses.push({ id: cId, name: rItem.className, subject: rItem.subject || rItem.className, students: stuList });
     }
    });

    (parsed.slots || []).forEach(sl => {
     if(!sl.day || !sl.period || !sl.subject) return;
     const label = sl.room ? `${sl.room} ${sl.subject}` : sl.subject;
     let matched = nextClasses.find(c => c.id !== "homeroom" && (c.name === label || c.subject === sl.subject || c.name.includes(sl.subject)));
     if(!matched){
      const homeroomPool = d.schoolMasterData?.homeroomRosters?.[sl.room] || [];
      matched = { id: "cls-ai-" + uid(), name: label, subject: sl.subject, students: homeroomPool };
      nextClasses.push(matched);
     }
     nextTimetable[`${sl.day}-${sl.period}`] = matched.id;
    });

    return { ...d, subjectClasses: nextClasses, timetable: nextTimetable };
   });

   notify(`AI 분석 완료! 시간표 ${parsed.slots.length}교시 및 수업반 명단 ${parsed.rosters.length}건을 자동 등록했습니다.`);
  });
 }

 }
