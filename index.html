<script>
(function(){
  // 1) 아이폰(Safari) 및 안드로이드(Chrome/삼성인터넷) 호환을 위해 Canvas로 PNG 아이콘 즉시 생성
  function createAppIconPNG(size, maskable){
    try{
      const c = document.createElement("canvas");
      c.width = c.height = size;
      const ctx = c.getContext("2d");
      const r = maskable ? 0 : Math.round(size * 0.22);
      ctx.fillStyle = "#6550bb";
      ctx.beginPath();
      if(ctx.roundRect) ctx.roundRect(0, 0, size, size, r);
      else ctx.rect(0, 0, size, size);
      ctx.fill();

      const s = size / 512;
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 36 * s;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      ctx.beginPath();
      ctx.moveTo(256*s, 128*s); ctx.lineTo(96*s, 208*s); ctx.lineTo(256*s, 288*s); ctx.lineTo(416*s, 208*s); ctx.closePath();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(96*s, 288*s); ctx.lineTo(256*s, 368*s); ctx.lineTo(416*s, 288*s);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(96*s, 352*s); ctx.lineTo(256*s, 432*s); ctx.lineTo(416*s, 352*s);
      ctx.stroke();
      return c.toDataURL("image/png");
    }catch(e){
      return "";
    }
  }

  const icon180 = createAppIconPNG(180, false);
  const icon192 = createAppIconPNG(192, false);
  const icon512 = createAppIconPNG(512, false);
  const icon512Mask = createAppIconPNG(512, true);

  // 아이폰·아이패드 홈 화면 아이콘 (PNG 필수)
  const appleLink = document.createElement("link");
  appleLink.rel = "apple-touch-icon";
  appleLink.sizes = "180x180";
  appleLink.href = icon180 || icon192;
  document.head.appendChild(appleLink);

  const favLink = document.createElement("link");
  favLink.rel = "icon";
  favLink.type = "image/png";
  favLink.href = icon192;
  document.head.appendChild(favLink);

  // 안드로이드(갤럭시) 크롬·삼성인터넷 설치 규격 충족용 절대경로 Manifest
  const cleanUrl = window.location.href.split("#")[0];
  const baseScope = window.location.origin + window.location.pathname.replace(/[^/]*$/, "");
  const manifest = {
    id: cleanUrl,
    name: "스마트 교무실 — 수업·학급·문해력",
    short_name: "스마트 교무실",
    description: "개념기반 수업 설계 및 시간표 연동 스마트 교무실",
    lang: "ko-KR",
    start_url: cleanUrl,
    scope: baseScope,
    display: "standalone",
    orientation: "any",
    background_color: "#f7f8fb",
    theme_color: "#6550bb",
    icons: [
      { src: icon192, sizes: "192x192", type: "image/png", purpose: "any" },
      { src: icon512, sizes: "512x512", type: "image/png", purpose: "any" },
      { src: icon512Mask, sizes: "512x512", type: "image/png", purpose: "maskable" }
    ]
  };
  const mLink = document.createElement("link");
  mLink.rel = "manifest";
  mLink.href = "data:application/manifest+json;charset=utf-8," + encodeURIComponent(JSON.stringify(manifest));
  document.head.appendChild(mLink);
})();
</script>

// 엑셀이 '1-1'을 '1월 1일', '2026-01-01', '1-Jan', 날짜일련번호(46023), '1학년 1반', '1반' 등으로 변환해도 정확히 '1-1'로 복원하는 만능 헬퍼
function normalizeDeptCell(rawVal, defaultGrade = 1){
 if(rawVal === null || rawVal === undefined || rawVal === "") return "";
 // 1) 엑셀 날짜 일련번호(Serial Number)로 들어온 경우 (예: 46023 -> 1월 1일 -> 1-1)
 if(typeof rawVal === "number" && rawVal > 30000 && rawVal < 70000){
  const dt = new Date(Math.round((rawVal - 25569) * 86400 * 1000));
  if(!isNaN(dt)){
   const g = dt.getUTCMonth() + 1;
   const c = dt.getUTCDate();
   if(g >= 1 && g <= 6 && c >= 1 && c <= 30) return `${g}-${c}`;
  }
 }
 let s = String(rawVal).trim().replace(/^['"`]+|['"`]+$/g, "").trim();
 if(!s) return "";
 // 2) 기본 '1-1', '01-01', '1 - 1', '1-1반' 형태
 let m = s.match(/^0?([1-6])\s*[-.~/]\s*0?(\d{1,2})\s*반?$/);
 if(m) return `${Number(m[1])}-${Number(m[2])}`;
 // 3) '1학년 1반', '1학년1반' 형태
 m = s.match(/^([1-6])\s*학년\s*0?(\d{1,2})\s*반?$/);
 if(m) return `${Number(m[1])}-${Number(m[2])}`;
 // 4) '1반', '02반', '제1반' 단독 형태 (파일/시트의 기본 학년과 자동 결합)
 m = s.match(/^(?:제)?0?([1-9]|1\d|20)\s*반$/);
 if(m && defaultGrade >= 1 && defaultGrade <= 6) return `${Number(defaultGrade)}-${Number(m[1])}`;
 // 5) 엑셀 한글 날짜 변환: '1월 1일', '01월 06일', '2026년 1월 2일'
 m = s.match(/(?:20\d{2}\s*년\s*)?0?([1-6])\s*월\s*0?(\d{1,2})\s*일?/);
 if(m) return `${Number(m[1])}-${Number(m[2])}`;
 // 6) 엑셀 ISO 날짜 변환: '2026-01-06', '2026/01/06', '2026.01.06'
 m = s.match(/^20\d{2}[-./]0?([1-6])[-./]0?(\d{1,2})$/);
 if(m) return `${Number(m[1])}-${Number(m[2])}`;
 // 7) 엑셀 영문 날짜 변환: '1-Jan', 'Jan-1', '01-Feb'
 const engMonths = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6};
 m = s.match(/^0?(\d{1,2})[-/\s]+([a-zA-Z]{3})$/) || s.match(/^([a-zA-Z]{3})[-/\s]+0?(\d{1,2})$/);
 if(m){
  const isFirstNum = /^\d+$/.test(m[1]);
  const monStr = (isFirstNum ? m[2] : m[1]).toLowerCase();
  const dayNum = Number(isFirstNum ? m[1] : m[2]);
  const g = engMonths[monStr];
  if(g && dayNum >= 1 && dayNum <= 30) return `${g}-${dayNum}`;
 }
 return "";
}

function matches(v,t){
 if(Array.isArray(t))return Array.isArray(v)&&v.every(x=>matches(x,t[0]));
 if(isObj(t))return isObj(v)&&Object.keys(t).every(k=>matches(v[k],t[k]));
 return typeof v===typeof t;
}
function responseSchema(t){
 if(Array.isArray(t))return {type:"ARRAY",items:responseSchema(t[0])};
 if(isObj(t))return {type:"OBJECT",properties:Object.fromEntries(Object.entries(t).map(([k,v])=>[k,responseSchema(v)])),required:Object.keys(t)};
 return {type:typeof t==="number"?"INTEGER":"STRING"};
}

function Dialog({title,children,onClose,wide=false}){
 const ref=useRef(),close=useRef(onClose);close.current=onClose;
 useEffect(()=>{
  const prev=document.activeElement,overflow=document.body.style.overflow;document.body.style.overflow="hidden";
  const t=setTimeout(()=>ref.current?.querySelector("input,textarea,select,button")?.focus(),30);
  const handler=e=>{
   if(e.key==="Escape")close.current();
   if(e.key!=="Tab")return;
   const list=[...ref.current.querySelectorAll("button:not(:disabled),input:not(:disabled),textarea:not(:disabled),select:not(:disabled),a[href],summary")].filter(n=>n.offsetParent!==null);
   if(!list.length)return;
   if(e.shiftKey&&document.activeElement===list[0]){e.preventDefault();list[list.length-1].focus();}
   else if(!e.shiftKey&&document.activeElement===list[list.length-1]){e.preventDefault();list[0].focus();}
  };

 },[]);

function WeeklyTimetableGrid({timetable={}, subjectClasses=[], homeroomLabel="", activeDay="", activePeriod=1, onSelectSlot, readOnly=false, teacherName="", masterTeachers=[], onSwitchTeacher}){

 const curDay = activeDay || (["일","월","화","수","목","금","토"][new Date().getDay()]);

 const getSlotInfo = (dName, pNum) => {
  const cid = timetable[`${dName}-${pNum}`];
  if(!cid) return null;
  if(cid === "homeroom") return { id:"homeroom", title:"우리반", room:homeroomLabel, count:0, isElective:false };
  const found = (subjectClasses||[]).find(c => c.id === cid);
  if(!found) return null;
  const isElective = found.name.includes("타임]") || found.name.includes("[선택]") || found.id.startsWith("cls-el-");
  // 1순위: 수업반 객체에 직접 저장된 room 속성 확인
  let room = isText(found.room) && found.room.trim() ? found.room.trim() : "";
  // 2순위: 수업반 이름('... (3-2)' 또는 '1학년 3반 (1-3)')에서 추출
  if(!room){
   const parenMatches = [...found.name.matchAll(/\(([^)]+)\)/g)];
   if(parenMatches.length > 0){
    const lastParen = parenMatches[parenMatches.length - 1][1].trim();
    if(lastParen !== "원" && !/^\d+명?$/.test(lastParen)) room = lastParen;
   }
  }
  if(!room){
   const prefixMatch = found.name.match(/^([1-3]-\d+)\s+/) || found.id.match(/([1-3]-\d+)/);
   if(prefixMatch) room = prefixMatch[1].trim();
  }
  if(!room){
   const korCls = found.name.match(/([1-3])학년\s*(\d+)반/);
   if(korCls) room = `${korCls[1]}-${korCls[2]}`;
  }
  if(!room && found.students?.length > 0 && found.students[0]?.dept){
   const firstDept = found.students[0].dept;
   if(found.students.every(st => st.dept === firstDept)) room = firstDept;
  }
  return {
   id: found.id,
   title: found.subject || found.name,
   room,
   count: (found.students||[]).length,
   isElective
  };
 };

      {days.map(d => (
       <th key={d} className={`py-1.5 text-[11px] font-extrabold border-r border-[#e8e2f4] last:border-r-0 ${curDay===d?"bg-brand text-white":""}`}>{d}</th>

     {mode==="월간"?`${y}년 ${m+1}월`:mode==="주간"?`${weekDays[0].slice(5)} ~ ${weekDays[6].slice(5)}`:dateLabel(selectedDate)}

    <Button className="!px-3 !py-1 !min-h-[34px] !text-xs whitespace-nowrap" onClick={()=>moveDate(1)}>다음 ▶</Button>
   </div>
   <div className="flex gap-1 rounded-lg border border-line bg-paper p-1 shrink-0">
    {["월간","주간","일간"].map(k=><button type="button" key={k} onClick={()=>onModeChange(k)} className={`whitespace-nowrap rounded-md px-3 py-1 text-xs font-bold transition-colors ${mode===k?"bg-brand text-white shadow-sm":"text-slate-600 hover:bg-white"}`}>{k}</button>)}
   </div>
  </div>

  {mode==="일간" && (
   <div className="grid flex-1 gap-3 md:grid-cols-2">
    <div className="rounded-xl border border-line bg-[#faf9fd] p-3.5">
     <div className="mb-2.5 flex items-center justify-between">
      <h4 className="text-xs font-bold text-brand">📅 일정 ({selEvs.length}건)</h4>
      {onEditEvent && <button type="button" onClick={()=>onEditEvent({date:selectedDate})} className="rounded-md bg-brand px-2 py-1 text-[11px] font-bold text-white">+ 일정 추가</button>}
     </div>
     {selEvs.length ? <div className="space-y-2">{selEvs.map(e=><div key={e.id} onClick={()=>onEditEvent&&onEditEvent(e)} className="cursor-pointer rounded-lg border border-line bg-white p-2.5 hover:border-brand"><span className="text-xs font-bold text-brand">{e.time}</span> <span className="ml-1 text-xs text-slate-400">[{e.category}]</span><p className="mt-0.5 text-sm font-medium">{e.title}</p></div>)}</div> : <p className="py-4 text-center text-xs text-slate-400">등록된 일정이 없습니다.</p>}
    </div>
    <div className="rounded-xl border border-line bg-[#faf9fd] p-3.5">
     <div className="mb-2.5 flex items-center justify-between">
      <h4 className="text-xs font-bold text-emerald-700">☑️ 할 일 마감 ({selTks.length}건)</h4>
      {onEditTask && <button type="button" onClick={()=>onEditTask({date:selectedDate})} className="rounded-md border border-[#dcd3ee] bg-white px-2 py-1 text-[11px] font-bold text-[#493b7a]">+ 할 일 추가</button>}
     </div>
     {selTks.length ? <div className="space-y-2">{selTks.map(t=><div key={t.id} className="flex items-center gap-2 rounded-lg border border-line bg-white p-2.5"><input type="checkbox" checked={!!t.done} onChange={()=>onToggleTask&&onToggleTask(t.id)} className="h-4 w-4 shrink-0"/><span onClick={()=>onEditTask&&onEditTask(t)} className={`flex-1 cursor-pointer text-sm truncate ${t.done?"line-through text-slate-400":""}`}>{t.title}</span><Tag>{t.category}</Tag></div>)}</div> : <p className="py-4 text-center text-xs text-slate-400">마감인 할 일이 없습니다.</p>}
    </div>
   </div>
  )}

  {mode==="주간" && (
   <div className="grid flex-1 grid-cols-1 gap-2 sm:grid-cols-7">
    {weekDays.map((d,i)=>{
     const evs=dayEvents(d), tks=dayTasks(d), isSel=d===selectedDate, isToday=d===day();
     return <div key={d} onClick={()=>{onSelectDate(d);onModeChange("일간");}} className={`flex sm:min-h-[170px] flex-col cursor-pointer rounded-xl border p-2.5 transition-all ${isSel?"border-2 border-brand bg-[#faf8fe]":"border-line bg-white hover:bg-paper"}`}>
      <div className="mb-1.5 flex items-center justify-between border-b border-line/60 pb-1">
       <span className={`text-xs font-bold ${i===0?"text-red-600":i===6?"text-blue-600":"text-slate-700"}`}>{dayNames[i]} ({Number(d.slice(8))}일)</span>
       <div className="flex items-center gap-1">
        {isToday&&<span className="rounded bg-brand px-1.5 py-0.5 text-[10px] font-bold text-white">오늘</span>}
        <span className="text-[10px] text-slate-400 sm:hidden">{evs.length+tks.length}건 ›</span>
       </div>
      </div>
      <div className="flex-1 space-y-1">
       {evs.map(e=><div key={e.id} className="truncate rounded bg-[#eee9fa] px-2 py-1 text-[11px] font-semibold text-brand" title={e.title}>📅 {e.title}</div>)}
       {tks.map(t=><div key={t.id} className={`truncate rounded px-2 py-1 text-[11px] ${t.done?"bg-slate-100 text-slate-400 line-through":"bg-emerald-50 font-medium text-emerald-800"}`} title={t.title}>☑️ {t.title}</div>)}
       {!evs.length&&!tks.length&&<p className="py-1 sm:py-6 text-center text-[11px] text-slate-300">일정 없음</p>}
      </div>
     </div>;
    })}
   </div>
  )}

  {mode==="월간" && <div className="space-y-3">
   <div>
    <div className="grid grid-cols-7 text-center text-[11px] font-bold text-slate-500 mb-1">
     {dayNames.map((n,i)=><div key={n} className={`py-1 ${i===0?"text-red-500":i===6?"text-blue-500":""}`}>{n}</div>)}
    </div>
    <div className="grid grid-cols-7 gap-1">
     {monthCells.map(({date:d,inMonth})=>{
      const evs=dayEvents(d), tks=dayTasks(d), totalCnt=evs.length+tks.length, isSel=d===selectedDate, isToday=d===day();
      return <div key={d} onClick={()=>onSelectDate(d)} className={`min-h-[54px] sm:min-h-[76px] cursor-pointer rounded-lg border p-1 sm:p-1.5 transition-all ${!inMonth?"bg-slate-50/60 opacity-40":"bg-white"} ${isSel?"ring-2 ring-brand border-brand bg-[#faf8fe]":"border-line hover:bg-paper"}`}>
       <div className="flex items-center justify-between text-[11px]">
        <span className={`inline-flex h-5 w-5 items-center justify-center rounded-full font-bold ${isToday?"bg-brand text-white":""}`}>{Number(d.slice(8))}</span>
        {totalCnt>0&&<span className="rounded-full bg-[#eee9fa] px-1.5 py-0.2 text-[9px] font-extrabold text-brand">{totalCnt}</span>}
       </div>
       <div className="mt-1 space-y-0.5">
        {evs.slice(0,1).map(e=><div key={e.id} className="truncate rounded bg-[#eee9fa] px-1 py-0.5 text-[9.5px] font-semibold text-brand">{e.title}</div>)}
        {tks.slice(0,1).map(t=><div key={t.id} className={`truncate rounded px-1 py-0.5 text-[9.5px] ${t.done?"bg-slate-100 text-slate-400 line-through":"bg-emerald-50 text-emerald-800"}`}>{t.title}</div>)}
        {totalCnt>2&&<div className="text-[9px] font-semibold text-slate-400 text-center">+{totalCnt-2}건</div>}
       </div>
      </div>;
     })}
    </div>
   </div>

   {/* 월간 달력에서 날짜를 클릭하면 바로 일정·할 일을 추가하고 확인하는 영역 */}
   <div className="rounded-xl border-2 border-[#dcd3ee] bg-[#faf8fe] p-3.5 space-y-2.5 text-center sm:text-left">
    <div className="flex flex-col sm:flex-row items-center justify-between gap-2">
     <div className="flex items-center justify-center gap-2">
      <span className="text-xs font-extrabold text-brand">📌 {dateLabel(selectedDate)}</span>
      <span className="text-[11px] font-semibold text-slate-500">일정 {selEvs.length}건 · 할 일 {selTks.length}건</span>
     </div>
     <div className="flex flex-wrap items-center justify-center gap-1.5">
      {onEditTask && <button type="button" onClick={()=>onEditTask({date:selectedDate})} className="rounded-lg border border-[#dcd3ee] bg-white px-3 py-1.5 text-xs font-bold text-[#493b7a] hover:border-brand">+ 할 일 추가</button>}
      {onEditEvent && <button type="button" onClick={()=>onEditEvent({date:selectedDate})} className="rounded-lg bg-brand px-3 py-1.5 text-xs font-bold text-white shadow-sm">+ 일정 추가</button>}
     </div>
    </div>
    {(selEvs.length > 0 || selTks.length > 0) ? (
     <div className="grid gap-1.5 sm:grid-cols-2 text-left">
      {selEvs.map(e => (
       <div key={e.id} onClick={()=>onEditEvent&&onEditEvent(e)} className="flex items-center justify-between gap-2 rounded-lg border border-line bg-white px-3 py-2 text-xs cursor-pointer hover:border-brand">
        <span className="truncate font-semibold text-ink"><strong className="text-brand mr-1.5">{e.time}</strong>{e.title}</span>
        <span className="shrink-0 text-[10px] text-slate-400">{e.category}</span>
       </div>
      ))}
      {selTks.map(t => (
       <div key={t.id} className="flex items-center justify-between gap-2 rounded-lg border border-line bg-white px-3 py-2 text-xs">
        <label className="flex items-center gap-2 min-w-0 flex-1 cursor-pointer">
         <input type="checkbox" checked={!!t.done} onChange={()=>onToggleTask&&onToggleTask(t.id)} className="h-3.5 w-3.5 shrink-0"/>
         <span className={`truncate font-medium ${t.done?"line-through text-slate-400":"text-ink"}`}>{t.title}</span>
        </label>
        <span className="shrink-0 text-[10px] text-emerald-700 font-semibold">{t.category}</span>
       </div>
      ))}
     </div>
    ) : (
     <p className="text-xs text-slate-400">달력에서 원하는 날짜를 터치하고 [+ 일정 추가] 또는 [+ 할 일 추가]를 눌러보세요.</p>
    )}
   </div>
  </div>}
 </div>;
}
function ConceptSummary({plan}){
 return <section className="rounded-xl border border-[#ddd5ed] bg-[#faf8fe] p-4">
  <p className="mb-3 flex items-center gap-2 text-xs font-semibold text-brand"><Target className="h-4 w-4"/>이 차시의 개념기반 설계 기준</p>
  <div className="space-y-2 text-xs leading-7"><p><strong>개념</strong> {plan.macro} / {plan.micro}</p><p><strong>일반화</strong> {plan.big_idea}</p><p><strong>목표</strong> {plan.objective}</p><p><strong>전이</strong> {plan.transfer}</p></div>
 </section>;
}
function formatHighlight(text){
 return esc(text||"").replace(/#([^\s#<.,!?()]+)/g,'<span class="highlight">#$1</span>').replace(/\n/g,"<br>");
}

function buildInteractiveSlideHTML(slidesData, settings, plan, studentsList=[]){
 const items = Array.isArray(slidesData?.items) ? slidesData.items : [];
 const macroTags = (plan?.macro || "").split(/[,/·]+/).map(x=>x.trim()).filter(Boolean);
 const microTags = (plan?.micro || "").split(/[,/·]+/).map(x=>x.trim()).filter(Boolean);
 const boardUrl = slidesData?.board_url || "https://quizn.show/pbd/info/board/1244650";
 const boardPin = slidesData?.board_pin || "1244650";
 const pickerNames = Array.isArray(studentsList) && studentsList.length
  ? studentsList.map(st => `${st.number?st.number+"번 ":""}${st.name}`)
  : Array.from({length:25},(_,i)=>`${i+1}번 학생`);

 const slideSections = items.map((s, idx) => {
  const isFirst = idx === 0 ? " active" : "";
  if(s.type === "title"){
   return `<div class="slide${isFirst}" style="background:#1a202c; align-items:center;">
    <p style="font-family:'Noto Serif KR',serif; font-size:24px; color:#63b3ed; margin:0 0 16px 0; text-align:center;">${esc(s.badge || settings?.subject || "")}</p>
    <h1 class="title-serif" style="color:#ffffff; font-size:60px;">${esc(s.title)}</h1>
    <p style="font-size:28px; color:#a0aec0; margin:24px 0 0 0; text-align:center;">${esc(s.subtitle)}</p>
    <div style="width:80px; height:6px; background:#63b3ed; margin:40px auto 0 auto;"></div>
    <div class="nav-hint" style="color:#a0aec0;">클릭 또는 방향키(→)로 다음 이동</div>
   </div>`;
  }
  if(s.type === "concept"){
   return `<div class="slide${isFirst}">
    <div class="tip-text" style="background:#ebf8ff; color:#2b6cb0;">${esc(s.badge || "학습 목표 및 핵심 개념")}</div>
    <h1 class="title-text" style="margin-bottom:24px;">${esc(s.title || "오늘의 학습 목표와 핵심 개념")}</h1>
    <div class="concept-row">
     <div class="concept-group">
      <div class="concept-label">🌐 거시 개념</div>
      <div class="tag-container">${(macroTags.length?macroTags:["관점","관계"]).map(t=>`<span class="tag-macro">#${esc(t.replace(/^#/,""))}</span>`).join("")}</div>
     </div>
     <div class="concept-group">
      <div class="concept-label">🔍 미시 개념</div>
      <div class="tag-container">${(microTags.length?microTags:["핵심 개념","맥락"]).map(t=>`<span class="tag-micro">#${esc(t.replace(/^#/,""))}</span>`).join("")}</div>
     </div>
    </div>
    <div class="box" style="border-top:6px solid #3182ce; background:#f7fafc; padding:24px;">
     <h3 style="color:#1a365d; font-size:24px; border-bottom:none; margin-bottom:8px;">🎯 학습 목표</h3>
     <p style="font-size:22px; font-weight:700; color:#2d3748; line-height:1.6; margin-bottom:16px;">${formatHighlight(plan?.objective || s.subtitle)}</p>
     <div style="background:#edf2f7; padding:12px 20px; border-radius:8px; display:inline-block;">
      <p style="font-size:17px; color:#4a5568; margin:0; font-weight:700;">💡 핵심 아이디어(일반화): ${esc(plan?.big_idea || "")}</p>
     </div>
    </div>
   </div>`;
  }
  if(s.type === "question"){
   return `<div class="slide${isFirst}" style="background:#ebf8ff;">
    <div style="font-size:64px; color:#90cdf4; margin-bottom:20px; text-align:center;">“</div>
    <h2 style="font-size:38px; font-weight:700; color:#2b6cb0; margin:0; line-height:1.5; word-break:keep-all; text-align:center;">${nl(s.title)}</h2>
    <p style="font-size:24px; color:#4a5568; margin:40px 0 0 0; text-align:center;">${esc(s.subtitle)}</p>
   </div>`;
  }
  if(s.type === "quiz_intro"){
   return `<div class="slide${isFirst}">
    <h1 class="title-text" style="font-size:60px; color:#2c5282;">${esc(s.title || "도전! 5분 복습 퀴즈")}</h1>
    <p class="sub-text">${esc(s.subtitle || "화면의 선택지를 직접 클릭하면 정답 여부를 바로 알 수 있어요!")}</p>
    <div style="text-align:center; font-size:110px; margin-top:20px;">🎯</div>
   </div>`;
  }
  if(s.type === "quiz" && s.quiz){
   const q = s.quiz, ansId = "ans-" + idx;
   if(q.quizType === "initial"){
    return `<div class="slide${isFirst}">
     <div class="tip-text">${esc(s.badge || "초성 퀴즈")}</div>
     <div class="quiz-question">${nl(q.question || s.title)}</div>
     <div style="font-size:72px; font-weight:900; color:#2b6cb0; text-align:center; margin-bottom:40px; letter-spacing:10px;">${esc(q.initial || "ㅈㄷ")}</div>
     <button class="btn-answer" onclick="checkQuiz(this, true, true); showAnswer('${ansId}')">정답 외치고 여기 클릭!</button>
     <div id="${ansId}" class="quiz-answer-box">정답: ${esc(q.answerText)}<span class="quiz-explanation">${esc(q.explanation)}</span></div>
    </div>`;
   }
   const isOx = q.quizType === "ox" || (q.options && q.options.length === 2);
   const opts = Array.isArray(q.options) && q.options.length ? q.options : ["⭕","❌"];
   return `<div class="slide${isFirst}">
    <div class="tip-text">${esc(s.badge || "복습 퀴즈")}</div>
    <div class="quiz-question">${nl(q.question || s.title)}</div>
    <div class="quiz-options" style="${!isOx && opts.length>2 ? 'font-size:20px;' : ''}">
     ${opts.map((opt, oi) => `<div class="quiz-option" style="${isOx ? (oi===0?'font-size:64px;color:#3182ce;':'font-size:64px;color:#e53e3e;') : ''}" onclick="checkQuiz(this, ${oi === Number(q.answerIndex)})">${esc(opt)}</div>`).join("")}
    </div>
    <button class="btn-answer" onclick="showAnswer('${ansId}')">해설 보기</button>
    <div id="${ansId}" class="quiz-answer-box">정답: ${esc(q.answerText || opts[q.answerIndex] || "")}<span class="quiz-explanation">${esc(q.explanation)}</span></div>
   </div>`;
  }
  if(s.type === "table" && s.table?.headers?.length){
   return `<div class="slide${isFirst}">
    <div class="tip-text">${esc(s.badge || "스스로 점검하기")}</div>
    <h1 class="title-text" style="font-size:38px;">${esc(s.title)}</h1>
    <table class="table-container">
     <tr>${s.table.headers.map(h=>`<th>${esc(h)}</th>`).join("")}</tr>
     ${(s.table.rows||[]).map(r=>`<tr>${r.map((cell,ci)=>`<td>${ci===0?`<strong>${formatHighlight(cell)}</strong>`:formatHighlight(cell)}</td>`).join("")}</tr>`).join("")}
    </table>
   </div>`;
  }
  if(s.type === "template"){
   const lines = Array.isArray(s.template) && s.template.length ? s.template : ["1. [내 생각] 나는 ____(이)라고 생각한다.","2. [근거 인용] 왜냐하면 ____하기 때문이다.","3. [마무리] 따라서 우리는 ____해야 한다."];
   return `<div class="slide${isFirst}">
    <div class="tip-text">${esc(s.badge || "활동지 작성 안내")}</div>
    <h1 class="title-text">${esc(s.title)}</h1>
    <p class="sub-text">${esc(s.subtitle || "논리적인 견해를 세우는 3단 마법의 문장 틀")}</p>
    <div class="template-box" style="margin-top:10px;">
     ${lines.map(l=>`<p>${esc(l).replace(/____+/g,'<span class="template-blank"></span>')}</p>`).join("")}
    </div>
   </div>`;
  }
  if(s.type === "comparison"){
   const cards = Array.isArray(s.cards) ? s.cards : [];
   return `<div class="slide${isFirst}">
    <div class="tip-text">${esc(s.badge || "질문 만들기 안내")}</div>
    <h1 class="title-text">${esc(s.title)}</h1>
    <p class="sub-text">${esc(s.subtitle)}</p>
    <div class="box-container" style="margin-top:10px;">
     ${cards.map((c,ci)=>`<div class="box" style="background:${ci===0?'#fff5f5':'#f0fff4'}; border-top:6px solid ${ci===0?'#e53e3e':'#48bb78'};">
      <h3 style="color:${ci===0?'#c53030':'#276749'};">${esc(c.title)}</h3>
      <p>${formatHighlight(c.body)}</p>
     </div>`).join("")}
    </div>
   </div>`;
  }
  if(s.type === "share"){
   const cards = Array.isArray(s.cards) ? s.cards : [];
   return `<div class="slide${isFirst}">
    <div class="tip-text">${esc(s.badge || "마무리 소통 활동")}</div>
    <h1 class="title-text">${esc(s.title || "이제 우리의 생각을 공유합시다!")}</h1>
    <div class="box-container" style="align-items:stretch; margin-top:10px;">
     <div class="box" style="flex:0.4; background:#ebf8ff; border-top:6px solid #4299e1;">
      <div style="text-align:center;"><img id="qr-img" src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(boardUrl)}" alt="QR 코드"></div>
      <p style="margin-top:10px; font-weight:700; color:#2b6cb0;">태블릿으로 스캔하세요!</p>
      <div style="background:#fff5f5; color:#e53e3e; padding:8px 14px; border-radius:12px; font-size:20px; font-weight:900; margin-top:8px; border:3px dashed #fc8181; display:inline-block;">🔑 참여 코드: ${esc(boardPin)}</div>
     </div>
     <div class="box" style="flex:1; border-top:6px solid #4a5568; text-align:left;">
      <h3 style="color:#2c5282; text-align:center;">📌 상호작용 필수 과제</h3>
      <ul style="display:block; font-size:20px; line-height:1.8;">
       ${(cards.length ? cards : [{title:"내 생각 올리기",body:"활동지에 작성한 초안을 게시판에 공유하기"},{title:"공감과 댓글",body:"친구 글 3개 이상 읽고 존중을 담은 댓글 남기기"}]).map(c=>`<li><strong>${esc(c.title)}</strong>:${formatHighlight(c.body)}</li>`).join("")}
      </ul>
     </div>
    </div>
   </div>`;
  }
  const colors = ["#4299e1","#48bb78","#ed8936","#805ad5","#38b2ac"];
  const cards = Array.isArray(s.cards) ? s.cards : [];
  return `<div class="slide${isFirst}">
   <div class="tip-text" style="background:#e2e8f0; color:#2d3748;">${esc(s.badge || "핵심 탐구")}</div>
   <h1 class="title-text">${esc(s.title)}</h1>
   ${s.subtitle ? `<p class="sub-text">${formatHighlight(s.subtitle)}</p>` : ""}
   <div class="box-container" style="flex-direction:column; gap:12px;">
    ${cards.map((c,ci)=>`<div class="box" style="border-top:6px solid ${colors[ci%colors.length]};">
     <h3>${esc(c.title)}</h3>
     <p>${formatHighlight(c.body)}</p>
    </div>`).join("")}
   </div>
  </div>`;

<script>
function scalePresentation(){const w=document.getElementById('slide-wrapper');const s=Math.min(window.innerWidth/1280,window.innerHeight/720)*0.95;w.style.transform='scale('+s+')';}
window.addEventListener('resize',scalePresentation);scalePresentation();
let currentSlide=0;const slides=document.querySelectorAll('.slide');
const canvas=document.getElementById('drawing-canvas'),ctx=canvas.getContext('2d'),draftCanvas=document.getElementById('draft-canvas'),draftCtx=draftCanvas.getContext('2d');
let isDrawingMode=false,isDrawing=false,drawTool='pen',startX=0,startY=0;
function resizeCanvas(){canvas.width=draftCanvas.width=window.innerWidth;canvas.height=draftCanvas.height=window.innerHeight;}
window.addEventListener('resize',resizeCanvas);resizeCanvas();
function clearCanvas(){ctx.clearRect(0,0,canvas.width,canvas.height);draftCtx.clearRect(0,0,draftCanvas.width,draftCanvas.height);}
function toggleDrawingMode(){isDrawingMode=!isDrawingMode;document.body.classList.toggle('drawing-active',isDrawingMode);const b=document.getElementById('draw-toggle-btn');b.textContent=isDrawingMode?'🚫 판서 끄기':'🖌️ 판서 켜기';b.style.background=isDrawingMode?'#e53e3e':'#3182ce';}
function setDrawTool(t){drawTool=t;}
draftCanvas.addEventListener('mousedown',e=>{if(!isDrawingMode)return;isDrawing=true;startX=e.clientX;startY=e.clientY;ctx.beginPath();ctx.moveTo(startX,startY);});
draftCanvas.addEventListener('mousemove',e=>{if(!isDrawing||!isDrawingMode)return;ctx.lineCap='round';ctx.lineWidth=drawTool==='highlighter'?26:4;ctx.strokeStyle=drawTool==='highlighter'?'rgba(255,235,59,0.45)':'#e53e3e';ctx.lineTo(e.clientX,e.clientY);ctx.stroke();});
window.addEventListener('mouseup',()=>{isDrawing=false;});
function showSlide(i){if(i>=0&&i<slides.length){slides[currentSlide].classList.remove('active');currentSlide=i;slides[currentSlide].classList.add('active');clearCanvas();}}
window.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown','Space','Enter','PageDown'].includes(e.key)||e.code==='Space')showSlide(currentSlide+1);else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key))showSlide(currentSlide-1);});
window.addEventListener('click',e=>{if(isDrawingMode||e.target.closest('#control-widget')||e.target.closest('#widget-toggle-btn')||e.target.closest('#picker-modal')||e.target.closest('.btn-answer')||e.target.closest('.quiz-option'))return;e.clientX>window.innerWidth/2?showSlide(currentSlide+1):showSlide(currentSlide-1);});
function showEmoji(em){const d=document.createElement('div');d.className='reaction-overlay';d.textContent=em;document.body.appendChild(d);requestAnimationFrame(()=>{d.style.transform='translate(-50%,-50%) scale(1)';d.style.opacity='1';});setTimeout(()=>{d.style.opacity='0';setTimeout(()=>d.remove(),400);},1000);}
function beep(ok){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const a=new A(),o=a.createOscillator(),g=a.createGain();o.type=ok?'sine':'sawtooth';o.frequency.setValueAtTime(ok?523.25:280,a.currentTime);if(ok)o.frequency.setValueAtTime(783.99,a.currentTime+0.15);o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(0.3,a.currentTime);g.gain.exponentialRampToValueAtTime(0.01,a.currentTime+0.6);o.start();o.stop(a.currentTime+0.6);}
function checkQuiz(el,ok,btnOnly=false){if(!btnOnly)el.classList.add(ok?'correct':'wrong');showEmoji(ok?'🎉🤩🎉':'😭🌧️');beep(ok);}
function showAnswer(id){const el=document.getElementById(id);if(el)el.style.display='block';}
let timerInterval,timeRemaining=300,defaultTime=300,isRunning=false;
function updateDisplay(){const m=String(Math.floor(timeRemaining/60)).padStart(2,'0'),s=String(timeRemaining%60).padStart(2,'0');document.getElementById('timer-display-mini').textContent=document.getElementById('timer-popup').textContent=m+':'+s;}
function setTimer(min){clearInterval(timerInterval);isRunning=false;defaultTime=timeRemaining=min*60;document.getElementById('btn-start').textContent='시작';document.getElementById('timer-popup').classList.remove('show');updateDisplay();}
function toggleTimer(){const p=document.getElementById('timer-popup'),b=document.getElementById('btn-start');if(isRunning){clearInterval(timerInterval);b.textContent='계속';p.classList.remove('show');}else{b.textContent='일시정지';p.classList.add('show');timerInterval=setInterval(()=>{if(timeRemaining>0){timeRemaining--;updateDisplay();}else{clearInterval(timerInterval);isRunning=false;b.textContent='시작';beep(true);}},1000);}isRunning=!isRunning;}
function resetTimer(){setTimer(defaultTime/60);}
const bgm=document.getElementById('bgm-audio');let bgmOn=false;
function toggleBGM(){const b=document.getElementById('bgm-btn');if(bgmOn){bgm.pause();b.textContent='🎵 배경음악 켜기';}else{bgm.play();b.textContent='⏸ 배경음악 끄기';}bgmOn=!bgmOn;}
const ALL_STUDENTS = ${JSON.stringify(pickerNames)};
let remainingStudents = [...ALL_STUDENTS];
function updatePickerStatus(){const el=document.getElementById('picker-status');if(el)el.textContent='남은 인원: '+remainingStudents.length+' / '+ALL_STUDENTS.length+'명';}
function resetPickerPool(){remainingStudents=[...ALL_STUDENTS];updatePickerStatus();}
function pickRandomStudent(){
 const noDup=document.getElementById('picker-no-dup')?.checked;
 if(noDup && remainingStudents.length===0) remainingStudents=[...ALL_STUDENTS];
 const pool = noDup ? remainingStudents : ALL_STUDENTS;
 if(!pool.length) return;
 const modal=document.getElementById('picker-modal'),txt=document.getElementById('picker-winner-text');
 modal.style.display='flex';
 let ticks=0;
 const spin=setInterval(()=>{
  txt.textContent=ALL_STUDENTS[Math.floor(Math.random()*ALL_STUDENTS.length)];
  ticks++;
  if(ticks>=14){
   clearInterval(spin);
   const winIdx=Math.floor(Math.random()*pool.length);
   const winner=pool[winIdx];
   if(noDup) remainingStudents.splice(winIdx,1);
   txt.textContent=winner;
   updatePickerStatus();
   beep(true);
   showEmoji('🙋‍♂️✨🎉');
  }
 },55);
}
<\/script></body></html>`;
}

 }

function createInitialSwapLogDoc(req, d = initialData()){
 const dayNames = ["일","월","화","수","목","금","토"];
 const fmtShortDate = dStr => {
  if(!validDate(dStr)) return dStr || "";
  const dt = new Date(dStr+"T12:00:00Z");
  return `${dt.getUTCMonth()+1}/${dt.getUTCDate()}(${dayNames[dt.getUTCDay()]})`;
 };
 const parseRoomSubj = rawName => {
  if(!rawName) return {room:"", subj:""};
  const m = rawName.match(/^(\d+-\d+|\d+학년\s*\d+반)\s*(.*)$/);
  if(m) return {room:m[1].trim(), subj:(m[2]||rawName).replace(/[()]/g,"").trim()};
  return {room:rawName, subj:rawName};
 };
 const baseDate = req?.fromDate && validDate(req.fromDate) ? req.fromDate : day();
 const dt = new Date(baseDate+"T12:00:00Z");
 const periodStr = `${dt.getUTCFullYear()}년 ${dt.getUTCMonth()+1}월 ${dt.getUTCDate()}일~ ${dt.getUTCMonth()+1}월 ${dt.getUTCDate()}일 ( 1 )일간`;
 const fromParsed = parseRoomSubj(req?.fromClassName || "");
 const toParsed = parseRoomSubj(req?.toClassName || "");
 const isSub = req?.type === "sub";
 const firstRow = req ? {
  dateDay: req.type==="perm_swap" ? `${req.fromDay||""}요일` : fmtShortDate(req.fromDate),
  room: fromParsed.room || `${d.profile.grade}-${d.profile.classroom}`,
  period: String(req.fromPeriod || ""),
  absentSubject: fromParsed.subj || req.fromClassName || "",
  replaceSubject: isSub ? (fromParsed.subj || "동교과 보강") : (toParsed.subj || req.toClassName || ""),
  replaceTeacher: req.toTeacher || "",
   bogangDateDay: isSub ? fmtShortDate(req.fromDate) : (req.type==="perm_swap" ? `${req.toDay||""}요일` : fmtShortDate(req.toDate)),
  bogangRoom: isSub ? (fromParsed.room || "") : (toParsed.room || fromParsed.room || ""),
  bogangPeriod: isSub ? String(req.fromPeriod || "") : String(req.toPeriod || ""),
  rowNote: isSub ? "동교과 보강" : "수업 교체"
 } : {dateDay:"",room:"",period:"",absentSubject:"",replaceSubject:"",replaceTeacher:"",bogangDateDay:"",bogangRoom:"",bogangPeriod:"",rowNote:""};

 const rows = [firstRow];
 while(rows.length < 6){
  rows.push({dateDay:"",room:"",period:"",absentSubject:"",replaceSubject:"",replaceTeacher:"",bogangDateDay:"",bogangRoom:"",bogangPeriod:"",rowNote:""});
 }
 return {
  reason: req?.reason || "출장",
  periodText: periodStr,
  absentTeacher: req?.fromTeacher || d.profile.teacher || "",
  rows,
  bottomNote: ""
 };
}

function buildExamPaperHTML(examPaper, schoolName="광영고등학교", mode="student"){
 if(!examPaper || !Array.isArray(examPaper.sets) || !examPaper.sets.length) return null;
 const title = examPaper.title || "기출 재구성 모의고사";
 const subject = examPaper.subject || "국어 / 윤리 영역";
 const targetLabel = examPaper.targetClass || "전학년";

 let qCounter = 1;
 const numberedSets = examPaper.sets.map(s => {
  const startNum = qCounter;
  const items = (s.items || []).map(it => ({ ...it, printNum: qCounter++ }));
  const endNum = qCounter - 1;
  return { ...s, startNum, endNum, items };
 });
 const totalQuestions = qCounter - 1;

 const setsHtml = numberedSets.map(s => {
  const rangeStr = s.startNum === s.endNum ? `[${s.startNum}]` : `[${s.startNum}~${s.endNum}]`;
  const passageHtml = hasText(s.passage) ? `
   <div class="exam-passage-group">
    <div class="exam-range-header"><strong>${rangeStr}</strong> 다음 글을 읽고 물음에 답하시오. <span class="exam-source-tag">(${esc(s.year)} ${esc(s.examType)} · ${esc(s.category)})</span></div>
    <div class="exam-passage-box">${nl(s.passage)}</div>
   </div>
  ` : "";
  const itemsHtml = s.items.map(it => {
   const opts = Array.isArray(it.options) ? it.options : [];
   const circled = ["①","②","③","④","⑤"];
   return `
    <div class="exam-item">
     <div class="exam-q-stem"><strong>${it.printNum}.</strong> ${nl(it.question)} ${!hasText(s.passage)?`<span class="exam-source-tag">(${esc(s.year)} ${esc(s.examType)})</span>`:""}</div>
     ${hasText(it.box) ? `<div class="exam-bogi-box"><div class="exam-bogi-title">&lt;보 기&gt;</div>${nl(it.box)}</div>` : ""}
     <div class="exam-options">
      ${opts.map((opt, oi) => {
       const cleanOpt = String(opt||"").replace(/^[①②③④⑤1-5][.)\s]*/,"");
       return `<div class="exam-opt">${circled[oi]||""} ${nl(cleanOpt)}</div>`;
      }).join("")}
     </div>
    </div>
   `;
  }).join("");
  return passageHtml + itemsHtml;
 }).join("");

 const quickAnswerRows = numberedSets.flatMap(s => s.items).map(it => {
  const circled = ["①","②","③","④","⑤"][Number(it.answer)-1] || it.answer;
  return `<tr><th style="text-align:center;background:#f4f2f8">${it.printNum}번</th><td style="text-align:center;font-weight:700;color:#2b6cb0">${esc(circled)}</td><td style="text-align:center;font-size:8.5pt">${esc(it.difficulty||"중")}</td></tr>`;
 }).join("");

 const detailExplainHtml = numberedSets.flatMap(s => s.items.map(it => ({ ...it, setTitle: s.title, year: s.year, examType: s.examType, category: s.category }))).map(it => {
  const circled = ["①","②","③","④","⑤"][Number(it.answer)-1] || it.answer;
  return `<div style="border-bottom:1px solid #ccc;padding:10px 0;break-inside:avoid">
   <div style="font-weight:800;font-size:10.5pt;color:#1a365d">${it.printNum}번 &nbsp;|&nbsp; 정답: <span style="color:#e53e3e">${esc(circled)}</span> <span style="font-size:8.5pt;font-weight:400;color:#555">(${esc(it.year)} ${esc(it.examType)} · ${esc(it.category)} · 난이도 ${esc(it.difficulty||"중")})</span></div>
   <div style="margin-top:4px;font-size:9.5pt;line-height:1.65">${nl(it.explanation || "해설 참조")}</div>
  </div>`;
 }).join("");

 let bodyHtml = "";
 if(mode === "student" || mode === "all"){
  bodyHtml += `<section class="exam-page">
   <div class="exam-header">
    <div class="exam-header-top"><span>${esc(schoolName)} · ${esc(targetLabel)}</span><span>총 ${totalQuestions}문항</span></div>
    <div class="exam-main-title">${esc(title)}</div>
    <div class="exam-sub-bar">
     <span><strong>과목/영역:</strong> ${esc(subject)}</span>
     <span>학년 _____ 반 _____ 번호 _____ 성명 ______________</span>
    </div>
   </div>
   <div class="exam-two-col">${setsHtml}</div>
  </section>`;
 }
 if(mode === "quick" || mode === "all"){
  bodyHtml += `<section class="exam-page" style="${mode==="all"?"break-before:page":""}">
   <div class="exam-header">
    <div class="exam-main-title" style="font-size:18pt">${esc(title)} — 빠른 정답표</div>
   </div>
   <table style="width:100%;border-collapse:collapse;margin-top:12px">
    <thead><tr><th style="border:1px solid #333;padding:6px;width:25%">문항 번호</th><th style="border:1px solid #333;padding:6px;width:45%">정답</th><th style="border:1px solid #333;padding:6px;width:30%">난이도</th></tr></thead>
    <tbody>${quickAnswerRows}</tbody>
   </table>
  </section>`;
 }
 if(mode === "explain" || mode === "all"){
  bodyHtml += `<section class="exam-page" style="${mode==="all"?"break-before:page":""}">
   <div class="exam-header">
    <div class="exam-main-title" style="font-size:18pt">${esc(title)} — 교사용 상세 해설지</div>
   </div>
   <div class="exam-two-col" style="margin-top:14px">${detailExplainHtml}</div>
  </section>`;
 }

 return `<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>${esc(title)}</title><style>
  @page { size: A4 portrait; margin: 11mm 12mm; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #eef0f5; font: 9.5pt/1.55 "함초롬바탕", "바탕", "Noto Serif KR", "Malgun Gothic", serif; color: #111; }
  body { padding: 18px 0; }
  .toolbar { max-width: 210mm; margin: 0 auto 14px auto; padding: 12px 16px; background: #fff; border: 1px solid #dcd3ee; border-radius: 10px; display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; font-family: -apple-system, "Malgun Gothic", sans-serif; }
  .toolbar button { background: #6550bb; border: 0; color: #fff; border-radius: 6px; padding: 10px 16px; cursor: pointer; font-weight: 700; }
  .exam-page { width: 210mm; min-height: 297mm; padding: 12mm 13mm; margin: 0 auto 20px auto; background: #fff; box-shadow: 0 4px 18px rgba(0,0,0,.08); }
  .exam-header { border: 2px solid #111; padding: 10px 14px; margin-bottom: 14px; text-align: center; }
  .exam-header-top { display: flex; justify-content: space-between; font-size: 8.5pt; font-weight: 700; color: #444; margin-bottom: 4px; }
  .exam-main-title { font-size: 20pt; font-weight: 900; letter-spacing: 1px; margin: 4px 0 8px 0; font-family: "Malgun Gothic", sans-serif; }
  .exam-sub-bar { display: flex; justify-content: space-between; border-top: 1px solid #333; padding-top: 6px; font-size: 9.5pt; }
  .exam-two-col { column-count: 2; column-gap: 7mm; column-rule: 0.8px solid #444; text-align: justify; }
  .exam-passage-group { margin-bottom: 10px; }
  .exam-range-header { font-size: 9.5pt; margin-bottom: 5px; font-weight: 700; }
  .exam-source-tag { font-size: 8pt; font-weight: 400; color: #555; }
  .exam-passage-box { border: 1px solid #222; padding: 8px 9px; font-size: 9.2pt; line-height: 1.6; margin-bottom: 10px; background: #fff; }
  .exam-item { break-inside: avoid; margin-bottom: 14px; }
  .exam-q-stem { font-size: 9.5pt; line-height: 1.5; margin-bottom: 6px; }
  .exam-bogi-box { border: 1px solid #333; padding: 7px 9px; margin: 6px 0 8px 0; font-size: 9pt; line-height: 1.55; position: relative; }
  .exam-bogi-title { text-align: center; font-weight: 700; font-size: 9pt; margin-bottom: 4px; }
  .exam-options { display: flex; flex-direction: column; gap: 3px; padding-left: 4px; font-size: 9.2pt; }
  .exam-opt { line-height: 1.45; }
  table th, table td { border: 1px solid #333; padding: 5px 6px; font-size: 9pt; }
  @media print { html, body { background: #fff; padding: 0; } .exam-page { width: 100%; min-height: auto; margin: 0; padding: 0; box-shadow: none; } .toolbar { display: none; } }
 </style></head><body>
 <div class="toolbar"><button onclick="window.print()">🖨️ 모의고사 2단 시험지 인쇄 / PDF 저장</button><span style="font-size:9pt;color:#555">A4 세로 · 2단 다단 조판이 자동 적용되어 있습니다.</span></div>
 ${bodyHtml}
 </body></html>`;
}

 if p_code is null or p_code !~ '^[0-9a-f]{64}$' then raise exception '잘못된 코드'; end if;

 if p_code is null or p_code !~ '^[0-9a-f]{64}$' then raise exception '잘못된 코드'; end if;

  try{
   if(file.size>12*1024*1024)throw Error("PDF는 12MB 이하만 지원합니다.");

   let binary="";for(let i=0;i<bytes.length;i+=32768)binary+=String.fromCharCode(...bytes.subarray(i,i+32768));

 const detectedOS = (() => {
  const ua = typeof navigator !== "undefined" ? navigator.userAgent : "";
  const isKakao = /KAKAOTALK/i.test(ua);
  const isNaver = /NAVER/i.test(ua);
  const isBand = /BAND\//i.test(ua);
  const isInsta = /Instagram|FBAN|FBAV/i.test(ua);
  const isEverytimeOrLine = /Line\/|Everytime/i.test(ua);
  const isInApp = isKakao || isNaver || isBand || isInsta || isEverytimeOrLine;

  const isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/i.test(ua);
  const isSamsungBrowser = /SamsungBrowser/i.test(ua);
  const isCriOS = /CriOS/i.test(ua); // 아이폰 크롬 앱
  const isMac = /Macintosh|MacIntel|MacPPC|Mac68K/i.test(ua) && !isIOS;
  const isWin = /Win32|Win64|Windows|WinCE/i.test(ua);
  const isStandalone = typeof window !== "undefined" && (window.matchMedia?.("(display-mode: standalone)")?.matches || window.navigator?.standalone === true);

  return {
   isKakao, isNaver, isBand, isInApp,
   isIOS, isAndroid, isSamsungBrowser, isCriOS,
   isMac, isWin, isStandalone,
   primary: isIOS ? "ios" : isAndroid ? "android" : isMac ? "mac" : "win"
  };
 })();

 function openInExternalBrowser(){
  const currentUrl = window.location.href;
  if(detectedOS.isAndroid){
   const noProtocol = currentUrl.replace(/^https?:\/\//i, "");
   window.location.href = `intent://${noProtocol}#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=${encodeURIComponent(currentUrl)};end`;
  } else {
   copy(currentUrl).then(() => notify("주소를 복사했습니다! Safari(사파리) 앱을 열어 주소창에 붙여넣어 주세요."));
  }
 }

// CSV 파일에서 [과목명, 연번, 학반, 이름...] 또는 [학반, 번호, 이름...]을 자동 판별하여 등록하는 함수
 function importSubjectCSVText(text, fallbackSubject=""){
  const rows = text.replace(/^\ufeff/,"").split(/\r?\n/).map(r=>r.trim()).filter(Boolean);
  if(!rows.length){notify("CSV 파일이 비어 있습니다.");return;}
  const header = rows[0].split(",").map(c=>c.replace(/^"|"$/g,"").trim());
  // ★ 만약 선생님이 올리신 파일이 [학반, 번호, 이름] 양식이면 전교 각반 학생명단 업로더로 즉시 자동 연결!
  if(header.some(h => /^(학반|학년|반|학번)$/.test(h)) && !header.some(h => /과목/.test(h))){
   importAllHomeroomRostersFileOrText(text);
   return;
  }
  const isHeader = header.some(h=>/과목|수업|이름|성명|번호|연번/.test(h));
  const dataRows = isHeader ? rows.slice(1) : rows;
  const grouped = {};

  dataRows.forEach((line, idx) => {
   const cols = line.split(",").map(c=>c.replace(/^"|"$/g,"").trim());
   if(!cols.length) return;
   let subj="", num=idx+1, dept="", name="", phone="", parentPhone="", memo="";
   if(cols.length >= 4 && !/^\d+$/.test(cols[0])){
    // 양식: 과목명, 연번, 학반, 이름, 학생연락처(선택), 보호자연락처(선택), 비고(선택)
    subj = cols[0] || fallbackSubject || "기본교과";
    num = Number(cols[1]) || (idx+1);
    dept = cols[2] || "";
    name = cols[3] || "";
    phone = cols[4] || "";
    parentPhone = cols[5] || "";
    memo = cols[6] || "";
   } else if(cols.length >= 3 && /^\d+$/.test(cols[0])){
    // 양식: 연번, 학반, 이름, 연락처...
    subj = fallbackSubject || "교과수업반";
    num = Number(cols[0]) || (idx+1);
    dept = cols.length>=4 ? cols[1] : "";
    name = cols.length>=4 ? cols[2] : cols[1];
    phone = cols.length>=4 ? cols[3] : (cols[2]||"");
    parentPhone = cols[4] || "";
    memo = cols[5] || "";
   } else {
    subj = fallbackSubject || "교과수업반";
    name = cols[0] || "";
   }
   if(!name || name==="이름" || name==="성명") return;
   if(!grouped[subj]) grouped[subj] = [];
   grouped[subj].push({id:uid(), number:num, dept, name, phone, parentPhone, memo, submitted:false});
  });

  const subjNames = Object.keys(grouped);
  if(!subjNames.length){notify("인식된 학생 명단이 없습니다. 양식을 확인해 주세요.");return;}

  update(d => {
   const nextClasses = [...(d.subjectClasses||[])];
   subjNames.forEach(sName => {
    const existIdx = nextClasses.findIndex(c => c.id!=="homeroom" && (c.name===sName || c.subject===sName));
    if(existIdx >= 0){
     nextClasses[existIdx] = {...nextClasses[existIdx], name:sName, subject:sName, students:grouped[sName]};
    } else {
     nextClasses.push({id:"cls-"+uid(), name:sName, subject:sName, students:grouped[sName]});
    }
   });
   return {...d, subjectClasses:nextClasses};
  });
  notify(`총 ${subjNames.length}개 과목(${subjNames.join(", ")})의 학생 명단을 자동 인식하여 등록했습니다!`);
 }

 function importCurriculumMatrixText(rawText, allowNonMaster=false){
  if(!allowNonMaster && !["master","subadmin"].includes(currentUser?.role)){
   notify("전교생 선택과목 일괄 업로드는 총괄 마스터 또는 학교 관리자 계정에서 수행할 수 있습니다.");
   return;
  }
  const lines = rawText.replace(/^\ufeff/,"").split(/\r?\n/).map(r=>r.trim()).filter(Boolean);
  if(lines.length < 2){notify("헤더 행과 학생 데이터 행을 포함해 2줄 이상 입력해 주세요.");return;}
  const splitLine = line => line.includes("\t") ? line.split("\t").map(c=>c.trim()) : line.split(",").map(c=>c.replace(/^"|"$/g,"").trim());
  const headerCols = splitLine(lines[0]);

  let idxGrade=-1, idxClass=-1, idxNum=-1, idxStudentId=-1, idxName=-1;
  const slotCols = [];

  headerCols.forEach((h, i) => {
   if(/학번/.test(h)) idxStudentId = i;
   else if(/^학년$/.test(h)) idxGrade = i;
   else if(/^(학반|반)$/.test(h)) idxClass = i;
   else if(/^(번호|연번)$/.test(h)) idxNum = i;
   else if(/^(이름|성명|학생명)$/.test(h)) idxName = i;
   else if(h) slotCols.push({index:i, label:h});
  });

  if(idxName === -1){
   notify("첫 줄(헤더)에 '이름' 또는 '성명' 열이 있어야 합니다. (예: 학반, 번호, 이름, A타임, B타임...)");
   return;
  }

  const rows = [];
  const subjectGroupMap = {};

  lines.slice(1).forEach((line, rIdx) => {
   const cols = splitLine(line);
   const name = cols[idxName] || "";
   if(!name || name==="이름" || name==="성명") return;

   let dept = "";
   let num = rIdx + 1;
   if(idxStudentId !== -1 && cols[idxStudentId]){
    const sid = cols[idxStudentId].replace(/\D/g,"");
    if(sid.length === 5){
     dept = `${Number(sid[0])}-${Number(sid.slice(1,3))}`;
     num = Number(sid.slice(3,5)) || num;
    } else if(sid.length === 4){
     dept = `${Number(sid[0])}-${Number(sid[1])}`;
     num = Number(sid.slice(2,4)) || num;
    } else {
     dept = cols[idxStudentId];
    }
   } else {
    const g = idxGrade !== -1 ? cols[idxGrade]?.replace(/\D/g,"") : String(live.current.profile.grade||1);
    const c = idxClass !== -1 ? cols[idxClass]?.replace(/\D/g,"") : "";
    if(idxClass !== -1 && cols[idxClass]?.includes("-")) dept = cols[idxClass];
    else if(g && c) dept = `${g}-${c}`;
    else if(c) dept = `${live.current.profile.grade||1}-${c}`;
    else dept = `${live.current.profile.grade||1}-${live.current.profile.classroom||1}`;
    if(idxNum !== -1 && Number(cols[idxNum])) num = Number(cols[idxNum]);
   }

   const choices = {};
   slotCols.forEach(sc => {
    const val = cols[sc.index] || "";
    choices[sc.label] = val;
    if(val && val !== "-" && val !== "공강" && val !== "자습"){
     const classKey = `[${sc.label}] ${val}`;
     if(!subjectGroupMap[classKey]) subjectGroupMap[classKey] = {subject:val, slot:sc.label, students:[]};
     subjectGroupMap[classKey].students.push({
      id:uid(),
      number:subjectGroupMap[classKey].students.length + 1,
      dept,
      name,
      phone:"",
      parentPhone:"",
      memo:`원번:${num}번`,
      submitted:false
     });
    }
   });

   rows.push({id:uid(), dept, number:num, name, choices});
  });

  if(!rows.length){notify("인식된 학생 데이터가 없습니다.");return;}

  const myDept = `${live.current.profile.grade}-${live.current.profile.classroom}`;
  const myClassStudents = rows.filter(r => r.dept === myDept).sort((a,b)=>a.number - b.number);

  let updatedSharedPayload = null;
  update(d => {
   const nextClasses = [...(d.subjectClasses||[])];
   Object.entries(subjectGroupMap).forEach(([cName, info]) => {
    const existIdx = nextClasses.findIndex(c => c.id!=="homeroom" && c.name === cName);
    if(existIdx >= 0){
     nextClasses[existIdx] = {...nextClasses[existIdx], subject:info.subject, students:info.students};
    } else {
     nextClasses.push({id:"cls-"+uid(), name:cName, subject:info.subject, students:info.students});
    }
   });
   const nextStudents = myClassStudents.length >= 3
    ? myClassStudents.map(s => {
       const old = d.students.find(x => x.name === s.name);
       return old ? {...old, number:s.number} : {id:uid(), number:s.number, name:s.name, phone:"", parentPhone:"", memo:"", submitted:false};
      })
    : d.students;

   const nextElectiveMatrix = {
    ...(d.electiveMatrix||{}),
    headers: slotCols.map(s=>s.label),
    rows
   };
   updatedSharedPayload = {
    electiveMatrix: nextElectiveMatrix,
    subjectClasses: nextClasses.filter(c => c.id !== "homeroom"),
    periodTimes: d.periodTimes,
    updatedBy: currentUser?.name || d.profile.teacher || "관리자",
    updatedAt: new Date().toISOString()
   };

   return {
    ...d,
    students: nextStudents,
    subjectClasses: nextClasses,
    electiveMatrix: nextElectiveMatrix
   };
  });

  if(updatedSharedPayload){
   setTimeout(() => pushSharedSchoolRoster(updatedSharedPayload), 100);
  }
  notify(`총 ${rows.length}명 분석 완료! 학교 공용 마스터 채널(SCHOOL_SHARED_ROSTER_CODE)을 통해 전교사 화면에 5초 이내 자동 반영됩니다.`);
 }

 function getActiveSwapOverride(dateStr, periodNum){
  const myName = (currentUser?.name || live.current?.profile?.teacher || "").trim();
  if(!myName) return null;
  const approvedList = (swapRequestsRef.current || []).filter(r => r.status === "approved");
  for(let i = approvedList.length - 1; i >= 0; i--){
   const r = approvedList[i];
   if(r.type === "temp_swap"){
    if(r.fromTeacher === myName && r.fromDate === dateStr && Number(r.fromPeriod) === Number(periodNum)){
     return {mode:"일시교체", classId:r.toClassId, className:r.toClassName, students:r.toStudents||[], partner:r.toTeacher, note:`${r.toTeacher} 선생님 수업과 일시 교체됨`};
    }
    if(r.toTeacher === myName && r.toDate === dateStr && Number(r.toPeriod) === Number(periodNum)){
     return {mode:"일시교체", classId:r.fromClassId, className:r.fromClassName, students:r.fromStudents||[], partner:r.fromTeacher, note:`${r.fromTeacher} 선생님 수업과 일시 교체됨`};
    }
   } else if(r.type === "sub"){
    if(r.toTeacher === myName && r.fromDate === dateStr && Number(r.fromPeriod) === Number(periodNum)){
     return {mode:"동교과보강", classId:r.fromClassId, className:r.fromClassName, students:r.fromStudents||[], partner:r.fromTeacher, note:`${r.fromTeacher} 선생님 동교과 보강 대행 중`};
    }
    if(r.fromTeacher === myName && r.fromDate === dateStr && Number(r.fromPeriod) === Number(periodNum)){
     return {mode:"보강위임됨", classId:r.fromClassId, className:r.fromClassName, students:r.fromStudents||[], partner:r.toTeacher, note:`${r.toTeacher} 선생님이 보강 진행 중`};
    }
   }
  }
  return null;
 }

 // 현재 시각(쉬는 시간 15분 전 포함)을 기준으로 해당 교시를 찾아내는 헬퍼
 function getCurrentSchoolPeriod(now = new Date()){
  const mins = now.getHours() * 60 + now.getMinutes();
  const toM = str => { const [h, m] = str.split(":").map(Number); return h * 60 + m; };
  // 1순위: 현재 수업 시간 중이거나 수업 시작 15분 전(쉬는 시간)인 교시
  for(const pt of FIXED_PERIOD_TIMES){
   const s = toM(pt.start), e = toM(pt.end);
   if(mins >= s - 15 && mins <= e) return pt;
  }
  // 2순위: 점심시간(12:50~13:45)에는 5교시 준비로 연결
  if(mins > toM("12:50") && mins < toM("14:00")){
   return FIXED_PERIOD_TIMES.find(p => p.period === 5) || FIXED_PERIOD_TIMES[0];
  }
  return null;
 }

 function detectCurrentClass(d = live.current){
  const now = new Date();
  const dayNames = ["일","월","화","수","목","금","토"];
  const todayName = dayNames[now.getDay()];
  const todayDate = day();
  const foundPeriod = getCurrentSchoolPeriod(now);
  const firstSubjectClassId = (d.subjectClasses || []).find(c => c.id !== "homeroom")?.id || (d.profile?.homeroom ? "homeroom" : "");

  if(foundPeriod){
   setActivePeriod(foundPeriod.period);
   const override = getActiveSwapOverride(todayDate, foundPeriod.period);
   if(override && override.classId){
    setActiveClassId(override.classId);
    return {period:foundPeriod.period, classId:override.classId, auto:true, dayName:todayName, override};
   }
   const scheduledId = d.timetable?.[`${todayName}-${foundPeriod.period}`];
   if(scheduledId && ((scheduledId==="homeroom" && d.profile?.homeroom) || (d.subjectClasses||[]).some(c=>c.id===scheduledId))){
    setActiveClassId(scheduledId);
    return {period:foundPeriod.period, classId:scheduledId, auto:true, dayName:todayName};
   }
  }
  const fallbackId = (!d.profile?.homeroom && activeClassId === "homeroom") ? firstSubjectClassId : activeClassId;
  if(fallbackId && fallbackId !== activeClassId) setActiveClassId(fallbackId);
  return {period:foundPeriod?.period||activePeriod, classId:fallbackId, auto:false, dayName:todayName};
 }

 function parseStudentIdCode(rawId, fallbackGrade="", fallbackClass="", fallbackNum=1){
  const digits = String(rawId ?? "").replace(/\.0$/,"").replace(/\D/g,"");
  if(digits.length === 5){
   const g = Number(digits[0]);
   const c = Number(digits.slice(1,3));
   const n = Number(digits.slice(3,5));
   return { dept:`${g}-${c}`, grade:g, classroom:c, number:n || fallbackNum };
  }
  if(digits.length === 4){
   const g = Number(digits[0]);
   const c = Number(digits[1]);
   const n = Number(digits.slice(2,4));
   return { dept:`${g}-${c}`, grade:g, classroom:c, number:n || fallbackNum };
  }
  const g = String(fallbackGrade || live.current?.profile?.grade || 1).replace(/\D/g,"") || "1";
  const c = String(fallbackClass || live.current?.profile?.classroom || 1).replace(/\D/g,"") || "1";
  return { dept:`${g}-${c}`, grade:Number(g), classroom:Number(c), number:Number(fallbackNum)||1 };
 }

 // 과목명 표기 차이('생명과학ⅡJ' vs '생명과학ⅡJ0', '영미문학읽기B(원)' vs '영미문학읽기B', '사회∙문화' vs '사회·문화', '1일본어회화' vs '일본어회화')를 모두 흡수하여 선택과목 명단을 찾아내는 스마트 매칭 헬퍼
 function normalizeSubjKey(s){
  return String(s || "")
   .replace(/\(원\)/g, "")
   .replace(/[∙·・\s]/g, "")
   .trim();
 }

 function matchElectiveRosterFromMaster(subjRaw, roomRaw, electiveRosters){
  if(!isObj(electiveRosters)) return null;
  const sClean = String(subjRaw || "").trim();
  const rClean = String(roomRaw || "").trim();
  if(!sClean || sClean === "0") return null;
  const normTarget = normalizeSubjKey(sClean);
  const normTargetNoZero = normTarget.replace(/([A-N])0$/i, "$1");
  const classNumFromRoom = (/^[1-3]-(\d+)$/.exec(rClean) || [])[1] || "";

  // 1순위: 정확히 일치 또는 학반 번호 결합형('1일본어회화', '2중국어회화' 등) 우선 매칭
  if(classNumFromRoom && electiveRosters[`${classNumFromRoom}${sClean}`]?.students?.length){
   return electiveRosters[`${classNumFromRoom}${sClean}`];
  }
  if(electiveRosters[sClean]?.students?.length){
   const direct = electiveRosters[sClean];
   if(/^[1-3]-\d+$/.test(rClean) && !/[A-N]0?$/i.test(normTarget)){
    const filtered = direct.students.filter(st => st.dept === rClean);
    if(filtered.length >= 1) return { ...direct, students: filtered.map((st,i)=>({...st,number:i+1})) };
   }
   return direct;
  }

  // 2순위: (원), 공백, 가운뎃점 제거 후 일치 또는 끝에 0 유무('윤리와사상B' <-> '윤리와사상B0') 일치
  const keys = Object.keys(electiveRosters);
  for(const k of keys){
   const normK = normalizeSubjKey(k);
   const normKNoZero = normK.replace(/([A-N])0$/i, "$1");
   if(normK === normTarget || normKNoZero === normTargetNoZero || (classNumFromRoom && normK === `${classNumFromRoom}${normTarget}`)){
    if(electiveRosters[k]?.students?.length) return electiveRosters[k];
   }
  }

  // 3순위: 일본어회화 / 중국어회화 등 반 번호 조합 과목 통합 풀에서 해당 학반 필터링
  for(const k of keys){
   const normK = normalizeSubjKey(k).replace(/^[1-9]/, "");
   if(normK === normTarget){
    const roster = electiveRosters[k];
    if(roster?.students?.length){
     if(/^[1-3]-\d+$/.test(rClean)){
      const sameRoomStus = roster.students.filter(st => st.dept === rClean);
      if(sameRoomStus.length >= 1) return { ...roster, students: sameRoomStus.map((st,i)=>({...st,number:i+1})) };
     }
     return roster;
    }
   }
  }
  return null;
 }

 // 학반(예: '1-6', '2-3')의 학생 명단을 가져오되, 만약 아직 원반 명렬이 안 올라왔더라도 선택과목 매트릭스나 기존 수업반에 해당 반 학생이 있으면 자동으로 끌어오는 헬퍼
 function getHomeroomStudentsFromMaster(deptStr, master, d = live.current){
  const cleanDept = String(deptStr || "").trim();
  if(!/^[1-3]-\d+$/.test(cleanDept)) return [];
  if(Array.isArray(master?.homeroomRosters?.[cleanDept]) && master.homeroomRosters[cleanDept].length > 0){
   return master.homeroomRosters[cleanDept];
  }
  const myDept = `${d.profile.grade}-${d.profile.classroom}`;
  if(cleanDept === myDept && Array.isArray(d.students) && d.students.length > 0){
   return d.students;
  }
  const mxRows = (d.electiveMatrix?.rows || []).filter(r => r.dept === cleanDept).sort((a,b) => a.number - b.number);
  if(mxRows.length > 0){
   return mxRows.map((r, i) => ({
    id: `stu-${cleanDept}-${r.number || (i+1)}-${r.name}`,
    number: r.number || (i + 1),
    dept: cleanDept,
    name: r.name,
    phone: "",
    parentPhone: "",
    memo: "",
    submitted: false
   }));
  }
  return [];
 }

 function parseAcademicRowsToEvents(rows, defaultYear = Number(academicBaseYear) || new Date().getFullYear()){
  const extracted = [];
  const pad2 = n => String(n).padStart(2, "0");
  const isIgnoreWord = s => /^(요일|월|화|수|목|금|토|일|날짜|일자|행사명|학사일정|학사일정\(행사내용\)|학사일정\(행사명\)|수업일수|비고|주|월별|\d+일|\(\d+일\))$/.test(s);

  const makeDateStr = (yr, mo, da) => {
   if(mo < 1 || mo > 12 || da < 1 || da > 31) return "";
   const dStr = `${yr}-${pad2(mo)}-${pad2(da)}`;
   return validDate(dStr) ? dStr : "";
  };

  const normalizeDateStr = (rawVal, fallbackMonth = null, fallbackYear = null) => {
   if(rawVal === null || rawVal === undefined || rawVal === "") return "";
   if(typeof rawVal === "number" && rawVal > 40000 && rawVal < 60000){
    const dt = new Date(Math.round((rawVal - 25569) * 86400 * 1000));
    if(!isNaN(dt)) return dt.toISOString().slice(0, 10);
   }
   const s = String(rawVal).trim();
   // 1) YYYY-MM-DD, YYYY.MM.DD, YYYY/MM/DD
   let m = s.match(/(20\d{2})[-./년\s]+(\d{1,2})[-./월\s]+(\d{1,2})/);
   if(m) return makeDateStr(Number(m[1]), Number(m[2]), Number(m[3]));
   // 2) MM.DD, MM-DD, M월 D일
   m = s.match(/^(\d{1,2})[-./월\s]+(\d{1,2})(?:일|\([월화수목금토일]\))?$/);
   if(m){
    const mo = Number(m[1]), da = Number(m[2]);
    const yr = fallbackYear || ((mo === 1 || mo === 2) ? defaultYear + 1 : defaultYear);
    return makeDateStr(yr, mo, da);
   }
   // 3) 월 컨텍스트가 있을 때 숫자 'D' 또는 'D(요일)' 형태
   if(fallbackMonth){
    m = s.match(/^(\d{1,2})\s*(?:일|\([월화수목금토일]\))?$/);
    if(m){
     const da = Number(m[1]);
     const yr = fallbackYear || ((fallbackMonth === 1 || fallbackMonth === 2) ? defaultYear + 1 : defaultYear);
     return makeDateStr(yr, fallbackMonth, da);
    }
   }
   return "";
  };

  // [패턴 1] 학교 표준 다단 학사력 표 인식 (한 행에 3월, 4월, 5월... 여러 달이 가로로 나란히 배치된 표)
  let multiMonthCols = []; // [{ colIdx, yr, mo }]
  let currentMonthContext = null;
  let currentYearContext = null;

  rows.forEach(rowRaw => {
   const cols = (Array.isArray(rowRaw) ? rowRaw : [rowRaw]).map(c => String(c ?? "").trim());
   if(!cols.some(Boolean)) return;

   // A) 행 안에 '2026년 3월', '3월', '4월' 등 월 헤더가 여러 개 나란히 있는지 확인 (다단 학사력 표)
   const detectedMonthHeaders = [];
   cols.forEach((cell, cIdx) => {
    const mMatch = cell.match(/^(?:(20\d{2})\s*[년.]?\s*)?(\d{1,2})\s*월$/);
    if(mMatch){
     const mo = Number(mMatch[2]);
     if(mo >= 1 && mo <= 12){
      const yr = mMatch[1] ? Number(mMatch[1]) : ((mo === 1 || mo === 2) ? defaultYear + 1 : defaultYear);
      detectedMonthHeaders.push({ colIdx: cIdx, yr, mo });
     }
    }
   });

   if(detectedMonthHeaders.length >= 2){
    multiMonthCols = detectedMonthHeaders;
    return;
   }
   if(detectedMonthHeaders.length === 1){
    currentMonthContext = detectedMonthHeaders[0].mo;
    currentYearContext = detectedMonthHeaders[0].yr;
   }

   // B) 다단 학사력 표(multiMonthCols)가 활성화된 상태에서 각 월 블록([일, 요일, 행사] 또는 [일(요일), 행사]) 파싱
   if(multiMonthCols.length >= 2){
    multiMonthCols.forEach((mBlock, bIdx) => {
     const endCol = bIdx + 1 < multiMonthCols.length ? multiMonthCols[bIdx + 1].colIdx : cols.length;
     const slice = cols.slice(mBlock.colIdx, Math.min(endCol, mBlock.colIdx + 5));
     if(!slice.length) return;
     const dayCell = slice[0];
     const dayMatch = dayCell.match(/^(\d{1,2})(?:\s*\(?[월화수목금토일]\)?)?$/);
     if(!dayMatch) return;
     const da = Number(dayMatch[1]);
     const dStr = makeDateStr(mBlock.yr, mBlock.mo, da);
     if(!dStr) return;

     // 두 번째 칸이 요일('월'~'일')이면 세 번째 칸부터가 행사명, 아니면 두 번째 칸부터가 행사명
     const isSecondDow = /^[월화수목금토일]요일?$|^[월화수목금토일]$/.test(slice[1] || "");
     const eventCells = slice.slice(isSecondDow ? 2 : 1).filter(x => x && !isIgnoreWord(x) && !/^\d+$/.test(x));
     eventCells.forEach(evText => {
      evText.split(/[,/\n]+/).map(t => t.trim()).filter(Boolean).forEach(title => {
       if(!isIgnoreWord(title)) extracted.push({ date: dStr, title, time: "09:00", category: "학사일정" });
      });
     });
    });
    return;
   }

   // C) 세로 목록형([학년도, 월, 일, 요일, 날짜, 행사명] 또는 [월, 일, 요일, 행사명] 또는 [날짜, 행사명])
   // C-1: 행 앞에 '3월' 또는 '2026, 3월, 2, 월, 2026-03-02, 시업식' 형태
   for(let i = 0; i < cols.length; i++){
    const dStr = normalizeDateStr(cols[i], currentMonthContext, currentYearContext);
    if(dStr){
     // 바로 다음 칸이 요일('월','화'...)이면 그 다음 칸을 행사명으로 사용
     let evColIdx = i + 1;
     if(evColIdx < cols.length && /^[월화수목금토일](?:요일)?$/.test(cols[evColIdx])) evColIdx++;
     if(evColIdx < cols.length && /^20\d{2}-\d{2}-\d{2}$/.test(cols[evColIdx])) evColIdx++;
     const nextText = cols[evColIdx] || "";
     if(nextText && !isIgnoreWord(nextText) && isNaN(Number(nextText))){
      nextText.split(/[,/\n]+/).map(t => t.trim()).filter(Boolean).forEach(title => {
       if(!isIgnoreWord(title)) extracted.push({ date: dStr, title, time: "09:00", category: "학사일정" });
      });
      break;
     }
    }
   }

   // D) 한 셀 안에 "3.2(월) 입학식" 또는 "3/2 시업식"처럼 날짜+행사명이 함께 적힌 경우
   cols.forEach(text => {
    if(!text) return;
    const inlineMatches = [...text.matchAll(/(\d{1,2})\s*[./월]\s*(\d{1,2})일?(?:\s*\([월화수목금토일]\))?\s*[:：\-]?\s*([^\n\r,]+)/g)];
    inlineMatches.forEach(im => {
     const mo = Number(im[1]), da = Number(im[2]), title = im[3].trim();
     if(mo >= 1 && mo <= 12 && da >= 1 && da <= 31 && title.length >= 2 && !isIgnoreWord(title)){
      const yr = (mo === 1 || mo === 2) ? defaultYear + 1 : defaultYear;
      const dStr = makeDateStr(yr, mo, da);
      if(dStr) extracted.push({ date: dStr, title, time: "09:00", category: "학사일정" });
     }
    });
   });
  });

  const uniqMap = new Map();
  extracted.forEach(ev => uniqMap.set(`${ev.date}_${ev.title}`, ev));
  return Array.from(uniqMap.values()).sort((a,b) => a.date.localeCompare(b.date));
 }

// [선택과목 수업 장소 시트(2학년/3학년 분리) 최우선 매칭 헬퍼]
  // 과목명 뒤의 인원수 '(20)', '(원)', 가운뎃점, 로마자 표기 차이(Ⅰ/I, Ⅱ/II, 1/2)까지 모두 정규화하여 정확히 매칭합니다.
  function cleanElectiveSubjToken(raw){
   return String(raw || "")
    .replace(/\(\s*\d+\s*명?\s*\)/g, "") // (20), (25명) 제거
    .replace(/\(원\)/g, "")
    .replace(/Ⅰ/g, "I")
    .replace(/Ⅱ/g, "II")
    .replace(/[∙·・\s_\-~]/g, "")
    .trim();
  }

  // 교사 칸에 '김세훈, 천화영' 또는 '류은경(2)/양대호(1)'처럼 2명 이상이 적혀 있어도 개별 교사 성함 배열로 분리하는 헬퍼
  function extractTeacherNamesFromCell(rawCell){
   const cleaned = String(rawCell ?? "")
    .replace(/\(원\)/g, "")
    .replace(/\(\s*\d+\s*시간?\s*\)/g, "")
    .replace(/\(\s*\d+\s*\)/g, "")
    .trim();
   if(!cleaned || /^\d+$/.test(cleaned)) return [];
   return cleaned
    .split(/[,/&·+~\s]+/)
    .map(t => cleanMasterLabel(t.trim()))
    .filter(t => /^[가-힣]{2,5}$/.test(t) && !/^(반별인원|최대인원|실수업|특별실|교사명|담당교사)$/.test(t));
  }

  function resolveElectiveRoomOverride(subjRaw, teacherName, fallbackRoom, electiveRooms){
   if(!isObj(electiveRooms) || Object.keys(electiveRooms).length === 0) return fallbackRoom;
   const normSubj = cleanElectiveSubjToken(subjRaw);
   // 1학년 공통과목이나 창체(자율·진로·동아리)는 원래 학반 유지
   if(!normSubj || /^(자율|진로|동아리|봉사|자습|공강|공통국어|공통영어|공통수학|통합사회|통합과학|과학탐구실험)/.test(normSubj)) return fallbackRoom;
   const normSubjNoZero = normSubj.replace(/([A-Z])0$/i, "$1");
   const normSubjBaseOnly = normSubjNoZero.replace(/[A-N]$/i, "");
   const teacherCandidates = extractTeacherNamesFromCell(teacherName);
   const cleanT = teacherCandidates[0] || cleanMasterLabel(String(teacherName || "").replace(/\(원\)/g, "").trim());

   // 1순위: [정규화 과목명(타임포함) + 담당교사명] 정확히 일치 (한 과목에 여러 분반·여러 교사가 들어가도 교사명으로 100% 정확히 매칭!)
   if(cleanT){
    if(electiveRooms[`${normSubj}|${cleanT}`]) return electiveRooms[`${normSubj}|${cleanT}`];
    if(electiveRooms[`${normSubjNoZero}|${cleanT}`]) return electiveRooms[`${normSubjNoZero}|${cleanT}`];
   }

   // 2순위: 등록된 전체 키 중 [과목명|교사명] 정규화 비교
   if(cleanT){
    for(const [k, roomVal] of Object.entries(electiveRooms)){
     if(!roomVal || !k.includes("|")) continue;
     const [kSubjRaw, kTeachRaw] = k.split("|");
     const kSubj = cleanElectiveSubjToken(kSubjRaw);
     const kSubjNoZero = kSubj.replace(/([A-Z])0$/i, "$1");
     const kTeach = cleanMasterLabel(String(kTeachRaw || "").replace(/\(원\)/g, "").trim());
     if((kSubj === normSubj || kSubjNoZero === normSubjNoZero) && kTeach === cleanT){
      return roomVal;
     }
    }
   }

   // 3순위: 시간표 시트에 타임 알파벳(A~N) 없이 과목명만 적혀 있거나 표기가 약간 다른 경우 [순수과목명 + 담당교사명]으로 매칭
   if(cleanT && normSubjBaseOnly.length >= 2){
    for(const [k, roomVal] of Object.entries(electiveRooms)){
     if(!roomVal || !k.includes("|")) continue;
     const [kSubjRaw, kTeachRaw] = k.split("|");
     const kBase = cleanElectiveSubjToken(kSubjRaw).replace(/([A-Z])0$/i, "$1").replace(/[A-N]$/i, "");
     const kTeach = cleanMasterLabel(String(kTeachRaw || "").replace(/\(원\)/g, "").trim());
     if(kBase === normSubjBaseOnly && kTeach === cleanT) return roomVal;
    }
   }

   // 4순위: [정규화 과목명(타임포함)] 단독 일치 (단일 분반 과목이거나 교사명이 지정되지 않은 경우)
   if(electiveRooms[normSubj]) return electiveRooms[normSubj];
   if(electiveRooms[normSubjNoZero]) return electiveRooms[normSubjNoZero];

   for(const [k, roomVal] of Object.entries(electiveRooms)){
    if(!roomVal || k.includes("|")) continue;
    const kSubj = cleanElectiveSubjToken(k);
    const kNoZero = kSubj.replace(/([A-Z])0$/i, "$1");
    if(kSubj === normSubj || kNoZero === normSubjNoZero) return roomVal;
   }

   return fallbackRoom;
  }

  // 열 헤더 셀('1반', '2반', '1(장월규)', '2-1', '3학년 2반', '사회과실', '미술실' 등)을 정확한 장소명으로 변환하는 헬퍼
  function parseRoomHeaderCell(cellText, gradeNum = 2){
   const s = String(cellText ?? "").trim();
   if(!s || /^(실수업|반별인원|선택과목\s*최대인원|최대인원|타임|교시|구분|\d{2,})$/.test(s)) return "";
   // 1) '2-1', '3-5', '2학년 1반'처럼 학년과 반이 모두 명시된 경우
   let m = s.match(/^([1-3])\s*(?:학년|-)\s*0?(\d{1,2})\s*반?(?:\s*\([^)]*\))?$/);
   if(m) return `${Number(m[1])}-${Number(m[2])}`;
   // 2) '1반', '2반', '1(장월규)', '7(서영호)', '1반(장월규)', 숫자 '1'~'20'처럼 반 번호만 적힌 경우 -> 시트 학년(gradeNum)과 결합!
   m = s.match(/^0?(\d{1,2})\s*반?\s*(?:\([^)]*\))?$/);
   if(m){
    const cNum = Number(m[1]);
    if(cNum >= 1 && cNum <= 25) return `${gradeNum}-${cNum}`;
   }
   // 3) 그 외 텍스트는 특별실 명칭(예: '사회과실', '미술실', '음악실', '특별실')으로 그대로 사용
   return s;
  }

  // 사진과 동일한 형식의 [2학년_선택과목장소], [3학년_선택과목장소] 시트 파서
  // (동일 타임에 과목+교사 줄이 2번 이상 반복되거나, 한 과목에 2명 이상의 교사가 들어가는 모든 변수를 100% 읽어냅니다!)
  function parseElectiveRoomGridSheet(rows, gradeNum = 2){
   const map = {};
   if(!Array.isArray(rows) || rows.length < 3) return map;

   let colRoomMap = {}; // { colIdx: "2-1" | "3-1" | "사회과실" | "미술실" ... }
   let headerEndRow = 0;

   // 상단 6행 이내에서 반 번호('1반', '1(장월규)' 등)가 2개 이상 나열된 헤더 행 탐색
   for(let r = 0; r < Math.min(6, rows.length); r++){
    const row = (rows[r] || []).map(x => String(x ?? "").trim());
    const prevRow = r > 0 ? (rows[r - 1] || []).map(x => String(x ?? "").trim()) : [];
    const nextRow = r + 1 < rows.length ? (rows[r + 1] || []).map(x => String(x ?? "").trim()) : [];
    const maxC = Math.max(row.length, prevRow.length, nextRow.length);

    const tempCols = {};
    let classRoomCount = 0;

    for(let c = 1; c < maxC; c++){
     const curParsed = parseRoomHeaderCell(row[c], gradeNum);
     const topParsed = parseRoomHeaderCell(prevRow[c], gradeNum);
     const botParsed = parseRoomHeaderCell(nextRow[c], gradeNum);

     if(/^[1-3]-\d+$/.test(curParsed)){
      tempCols[c] = curParsed;
      classRoomCount++;
     } else if(topParsed && !/^[1-3]-\d+$/.test(topParsed) && topParsed !== "특별실"){
      tempCols[c] = topParsed;
     } else if(curParsed && curParsed !== "특별실"){
      tempCols[c] = curParsed;
     } else if(botParsed && !/^[1-3]-\d+$/.test(botParsed)){
      tempCols[c] = botParsed;
     } else if(curParsed === "특별실" && topParsed){
      tempCols[c] = topParsed;
     } else if(curParsed){
      tempCols[c] = curParsed;
     }
    }

    if(classRoomCount >= 2){
     // 7반 오른쪽에 헤더가 비어있거나 추가 분반/특별실로 쓰이는 열 자동 감지
     for(let c = 1; c < maxC + 4; c++){
      if(!tempCols[c]){
       const hasSubjInCol = rows.slice(r + 1).some(rw => /\(\s*\d+\s*명?\s*\)/.test(String(rw?.[c] ?? "")));
       if(hasSubjInCol) tempCols[c] = "특별실";
      }
     }
     colRoomMap = tempCols;
     headerEndRow = r + 1;
     break;
    }
   }

   if(Object.keys(colRoomMap).length === 0) return map;

   // 데이터 행 스캔: A, B, C... 타임 안에서 과목 행과 교사 행(1줄 또는 2줄 이상 연속)을 열별로 정확히 추적
   let currentSlotLetter = "";
   const lastSubjByCol = {}; // 같은 열에서 과목 1개 아래에 교사 이름이 2줄 연속 나오는 경우까지 대응

   for(let r = headerEndRow; r < rows.length; r++){
    const row = (rows[r] || []).map(x => String(x ?? "").trim());
    const firstCell = row[0] || "";
    if(/반별인원|최대인원/.test(firstCell)) continue;
    if(/^[A-N]$/i.test(firstCell)){
     const nextLetter = firstCell.toUpperCase();
     if(nextLetter !== currentSlotLetter){
      currentSlotLetter = nextLetter;
      Object.keys(lastSubjByCol).forEach(k => delete lastSubjByCol[k]);
     }
    }

    const nextRow = r + 1 < rows.length ? (rows[r + 1] || []).map(x => String(x ?? "").trim()) : [];
    const colEntries = Object.entries(colRoomMap);

    colEntries.forEach(([cStr, roomLabel]) => {
     const c = Number(cStr);
     const cellVal = String(row[c] || "").trim();
     if(!cellVal || /^\d+$/.test(cellVal)) return;

     const hasCountParen = /\(\s*\d+\s*명?\s*\)/.test(cellVal);
     const cleanedSubj = cleanElectiveSubjToken(cellVal);
     const belowCellRaw = String(nextRow[c] || "").trim();
     const belowTeachers = extractTeacherNamesFromCell(belowCellRaw);
     const belowHasCountParen = /\(\s*\d+\s*명?\s*\)/.test(belowCellRaw);

     // 과목 셀인지 판별: 괄호 인원수가 있거나, 끝에 타임코드(A~N, A0~N0)가 붙어 있거나, 바로 아래 칸에 교사 성함이 있고 현재 칸은 과목명인 경우
     const isSubjectCell = cleanedSubj.length >= 2 && (
      hasCountParen ||
      /[A-N]0?$/i.test(cleanedSubj) ||
      (belowTeachers.length > 0 && !belowHasCountParen && !/^[가-힣]{2,4}$/.test(cleanedSubj))
     );

     if(isSubjectCell){
      const noZero = cleanedSubj.replace(/([A-Z])0$/i, "$1");
      const withSlot = (currentSlotLetter && !/[A-N]0?$/i.test(cleanedSubj)) ? `${cleanedSubj}${currentSlotLetter}` : cleanedSubj;
      const withSlotNoZero = withSlot.replace(/([A-Z])0$/i, "$1");

      lastSubjByCol[c] = { cleanedSubj, noZero, withSlot, withSlotNoZero, roomLabel };

      // 바로 아래 행에 적힌 모든 교사(1명 또는 2명 이상)를 해당 과목+장소에 매핑
      belowTeachers.forEach(tName => {
       map[`${cleanedSubj}|${tName}`] = roomLabel;
       map[`${noZero}|${tName}`] = roomLabel;
       map[`${withSlot}|${tName}`] = roomLabel;
       map[`${withSlotNoZero}|${tName}`] = roomLabel;
      });

      // 과목 단독 키 저장 (여러 분반이 있을 때는 첫 분반 또는 복수 분반 목록 보존)
      if(!map[cleanedSubj]) map[cleanedSubj] = roomLabel;
      if(!map[noZero]) map[noZero] = roomLabel;
      if(!map[withSlot]) map[withSlot] = roomLabel;
      if(!map[withSlotNoZero]) map[withSlotNoZero] = roomLabel;
     } else {
      // 현재 셀 자체가 교사 성함 줄인 경우 (한 셀에 복수 교사가 있거나, 과목 아래 두 번째 교사 줄인 경우까지 모두 연결!)
      const currentTeachers = extractTeacherNamesFromCell(cellVal);
      const prevSubjInfo = lastSubjByCol[c];
      if(currentTeachers.length > 0 && prevSubjInfo){
       currentTeachers.forEach(tName => {
        map[`${prevSubjInfo.cleanedSubj}|${tName}`] = prevSubjInfo.roomLabel;
        map[`${prevSubjInfo.noZero}|${tName}`] = prevSubjInfo.roomLabel;
        map[`${prevSubjInfo.withSlot}|${tName}`] = prevSubjInfo.roomLabel;
        map[`${prevSubjInfo.withSlotNoZero}|${tName}`] = prevSubjInfo.roomLabel;
       });
      }
     }
    });
   }
   return map;
  }

  // ★ [2단계 전용] 1단계(명단·시간표·선택과목) 반영 완료 후, 2·3학년 선택과목 수업장소 시트만 업로드하여 전교 시간표에 즉시 덮어쓰는 함수
  async function handleElectiveRoomSheetUpload(file){
   if(!file) return;
   if(!window.XLSX){
    notify("엑셀 분석 라이브러리를 불러오는 중입니다. 잠시 후 다시 시도해 주세요.");
    return;
   }
   sharedLockRef.current = true;
   setBusy(`📍 [${file.name}]에서 2·3학년 선택과목 수업장소를 읽어 전교 시간표에 반영 중...`);
   showUploadResult(true, `⏳ [${file.name}] 2·3학년 선택과목 수업장소 분석 중...`, "한 과목 복수 교사(코티칭·분반) 및 특별실 변수를 모두 고려하여 시간표 장소를 갱신하고 있습니다.", "", true);

   try {
    const buf = await file.arrayBuffer();
    const wb = window.XLSX.read(buf, { type: "array", raw: false });

    const newRoomMap = { ...(live.current.schoolMasterData?.electiveRooms || {}) };
    let parsedSheetNames = [];

    for(const sheetName of wb.SheetNames){
     const rows = window.XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: "", raw: false });
     if(!rows || rows.length < 3) continue;
     const topText = rows.slice(0, 5).flat().map(x => String(x ?? "").trim()).join(" ");
     // 장소 전용 엑셀이든 통합 엑셀이든 '실수업' 표나 '장소' 시트를 모두 찾아냄 (단, 시간표/명렬/담임 시트는 제외)
     if(sheetName.includes("시간표") || sheetName.includes("전교생") || sheetName.includes("명단") || sheetName.includes("명렬") || sheetName.includes("담임")) continue;

     const inferredGrade = (sheetName.includes("2학년") || sheetName.includes("고2") || /2학년/.test(topText))
      ? 2
      : (sheetName.includes("3학년") || sheetName.includes("고3") || /3학년/.test(topText))
      ? 3
      : (wb.SheetNames.indexOf(sheetName) === 0 ? 2 : 3);

     const extracted = parseElectiveRoomGridSheet(rows, inferredGrade);
     if(Object.keys(extracted).length > 0){
      Object.assign(newRoomMap, extracted);
      parsedSheetNames.push(`${sheetName}(${inferredGrade}학년)`);
     }
    }

    // 만약 사용자가 시트 이름을 바꾸지 않은 단일 시트 파일을 올렸다면 전체 시트를 대상으로 한 번 더 스캔
    if(parsedSheetNames.length === 0){
     wb.SheetNames.forEach((sheetName, idx) => {
      const rows = window.XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: "", raw: false });
      const gradeGuess = sheetName.includes("2") ? 2 : sheetName.includes("3") ? 3 : (idx === 0 ? 2 : 3);
      const extracted = parseElectiveRoomGridSheet(rows, gradeGuess);
      if(Object.keys(extracted).length > 0){
       Object.assign(newRoomMap, extracted);
       parsedSheetNames.push(`${sheetName}(${gradeGuess}학년)`);
      }
     });
    }

    const totalKeys = Object.keys(newRoomMap).length;
    if(totalKeys === 0){
     showUploadResult(
      false,
      `[${file.name}] 선택과목 수업장소 인식 실패 (0건)`,
      "엑셀 시트에서 [실수업 | 1반 | 2반 ... | 특별실] 형태의 선택과목 장소 표를 찾지 못했습니다.",
      "통합 표준 양식의 [2학년_선택과목장소], [3학년_선택과목장소] 시트 형식인지 확인해 주세요.",
      false
     );
     return;
    }

    // 1) 이미 등록된 전교 교사별 시간표(teachers)에서 2·3학년 선택과목의 수업장소(room)를 최우선 덮어쓰기 (1학년 수업은 그대로 유지!)
    const prevMaster = live.current.schoolMasterData || {};
    const prevTeachers = prevMaster.teachers || {};
    const nextTeachers = {};
    let updatedSlotCount = 0;

    Object.entries(prevTeachers).forEach(([tName, slotArr]) => {
     nextTeachers[tName] = (slotArr || []).map(sl => {
      const curRoom = String(sl.room || "").trim();
      const matchedRoom = resolveElectiveRoomOverride(sl.subject, tName, "", newRoomMap);
      if(matchedRoom){
       if(curRoom !== matchedRoom) updatedSlotCount++;
       return { ...sl, room: matchedRoom };
      }
      return sl;
     });
    });

    // 2) 선택과목 분반 명단(electiveRosters)에도 대표 장소 업데이트
    const prevElRosters = prevMaster.electiveRosters || {};
    const nextElRosters = {};
    Object.entries(prevElRosters).forEach(([k, rosterObj]) => {
     const matchedRoom = resolveElectiveRoomOverride(rosterObj.subject || k, "", rosterObj.room || "", newRoomMap);
     nextElRosters[k] = { ...rosterObj, room: matchedRoom || rosterObj.room || "" };
    });

    // 3) 학급별 시간표(classTimetables)에도 장소 업데이트
    const prevClassTt = prevMaster.classTimetables || {};
    const nextClassTt = {};
    Object.entries(prevClassTt).forEach(([deptKey, slotMap]) => {
     nextClassTt[deptKey] = {};
     Object.entries(slotMap || {}).forEach(([periodKey, info]) => {
      const matchedRoom = resolveElectiveRoomOverride(info.subject, info.teacher, info.room || deptKey, newRoomMap);
      nextClassTt[deptKey][periodKey] = { ...info, room: matchedRoom };
     });
    });

    const updatedMasterData = {
     ...prevMaster,
     teachers: nextTeachers,
     electiveRosters: nextElRosters,
     classTimetables: nextClassTt,
     electiveRooms: newRoomMap,
     updatedAt: new Date().toISOString()
    };

    update(d => ({
     ...d,
     schoolMasterData: updatedMasterData
    }));

    // 서버 공용 채널에 즉시 배포
    await pushSharedSchoolRoster({
     schoolMasterData: updatedMasterData
    });

    // 현재 로그인한 선생님의 화면 시간표 및 수업반 목록 즉시 재생성 반영
    const myTeacherName = cleanMasterLabel(currentUser?.name || live.current.profile.teacher || "");
    if(myTeacherName){
     autoAppliedKeyRef.current = "";
     setTimeout(() => applyTeacherScheduleFromMaster(myTeacherName, updatedMasterData, true), 60);
    }

    const teacherSpecificMatches = Object.entries(newRoomMap)
     .filter(([k]) => k.includes("|"))
     .slice(0, 12)
     .map(([k, v]) => `${k.replace("|", "(")})→${v}`);

    showUploadResult(
     true,
     `✅ 2단계: 2·3학년 선택과목 수업장소 반영 완료!`,
     `인식된 시트: ${parsedSheetNames.join(", ")} · 전교 시간표 총 ${updatedSlotCount}개 교시의 수업장소를 갱신했습니다.`,
     `예시 매칭 확인: ${teacherSpecificMatches.join(", ") || "과목별 장소 매칭 완료"} (1학년 수업반은 기존 반 그대로 유지됩니다)`,
     false
    );
   } catch(err) {
