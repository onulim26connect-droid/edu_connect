function ScheduleCalendar({events=[],tasks=[],selectedDate,onSelectDate,mode,onModeChange,onToggleTask,onEditEvent,onEditTask}){
 const base = validDate(selectedDate) ? new Date(selectedDate+"T12:00:00Z") : new Date();

 const fmt = d => d.toISOString().slice(0,10);
 const dayNames = ["일","월","화","수","목","금","토"];

 // 주간 날짜 배열 (일~토)
 const startOfWeek = new Date(base);
 startOfWeek.setUTCDate(base.getUTCDate() - base.getUTCDay());
 const weekDays = Array.from({length:7},(_,i)=>{const d=new Date(startOfWeek);d.setUTCDate(startOfWeek.getUTCDate()+i);return fmt(d);});

 // 월간 날짜 배열 (달력 6주 그리드)
 const firstDay = new Date(Date.UTC(y,m,1));
 const startGrid = new Date(firstDay);
 startGrid.setUTCDate(1 - firstDay.getUTCDay());
 const monthCells = Array.from({length:42},(_,i)=>{const d=new Date(startGrid);d.setUTCDate(startGrid.getUTCDate()+i);return {date:fmt(d),inMonth:d.getUTCMonth()===m};});

 const moveDate = (delta) => {
  const next = new Date(base);
  if(mode==="월간") next.setUTCMonth(next.getUTCMonth()+delta);
  else if(mode==="주간") next.setUTCDate(next.getUTCDate()+delta*7);
  else next.setUTCDate(next.getUTCDate()+delta);
  onSelectDate(fmt(next));
 };

 const dayEvents = d => events.filter(e=>e.date===d).sort((a,b)=>String(a.time).localeCompare(String(b.time)));

  {mode==="주간" && <div className="grid grid-cols-1 gap-2 sm:grid-cols-7">
   {weekDays.map((d,i)=>{

     <div className="mb-2 flex items-center justify-between">
      <span className={`text-xs font-bold ${i===0?"text-red-600":i===6?"text-blue-600":"text-slate-700"}`}>{dayNames[i]} ({Number(d.slice(8))}일)</span>

     </div>

      {tks.map(t=><div key={t.id} className={`truncate rounded px-2 py-1 text-[11px] ${t.done?"bg-slate-100 text-slate-400 line-through":"bg-emerald-50 font-medium text-emerald-800"}`}>☑️ {t.title}</div>)}

  {mode==="월간" && <div>

     return <div key={d} onClick={()=>onSelectDate(d)} className={`min-h-[78px] cursor-pointer rounded-lg border p-1.5 transition-all ${!inMonth?"bg-slate-50/60 opacity-45":"bg-white"} ${isSel?"ring-2 ring-brand border-brand bg-[#faf8fe]":"border-line hover:bg-paper"}`}>

<script>
function scalePresentation(){const w=document.getElementById('slide-wrapper');const s=Math.min(window.innerWidth/1280,window.innerHeight/720)*0.95;w.style.transform='scale('+s+')';}
window.addEventListener('resize',scalePresentation);scalePresentation();
let currentSlide=0;const slides=document.querySelectorAll('.slide');
const canvas=document.getElementById('drawing-canvas'),ctx=canvas.getContext('2d'),draftCanvas=document.getElementById('draft-canvas'),draftCtx=draftCanvas.getContext('2d');
let isDrawingMode=false,isDrawing=false,drawTool='pen',startX=0,startY=0;
function resizeCanvas(){canvas.width=draftCanvas.width=window.innerWidth;canvas.height=draftCanvas.height=window.innerHeight;}
window.addEventListener('resize',resizeCanvas);resizeCanvas();
function clearCanvas(){ctx.clearRect(0,0,canvas.width,canvas.height);draftCtx.clearRect(0,0,draftCanvas.width,draftCanvas.height);}
function toggleDrawingMode(){isDrawingMode=!isDrawingMode;document.body.classList.toggle('drawing-active',isDrawingMode);const b=document.getElementById('draw-toggle-btn');b.textContent=isDrawingMode?'🚫 판서 끄기':'🖌️ 판서 켜기';b.style.background=isDrawingMode?'#e53e3e':'#3182ce';}
function setDrawTool(t){drawTool=t;}
draftCanvas.addEventListener('mousedown',e=>{if(!isDrawingMode)return;isDrawing=true;startX=e.clientX;startY=e.clientY;ctx.beginPath();ctx.moveTo(startX,startY);});
draftCanvas.addEventListener('mousemove',e=>{if(!isDrawing||!isDrawingMode)return;ctx.lineCap='round';ctx.lineWidth=drawTool==='highlighter'?26:4;ctx.strokeStyle=drawTool==='highlighter'?'rgba(255,235,59,0.45)':'#e53e3e';ctx.lineTo(e.clientX,e.clientY);ctx.stroke();});
window.addEventListener('mouseup',()=>{isDrawing=false;});
function showSlide(i){if(i>=0&&i<slides.length){slides[currentSlide].classList.remove('active');currentSlide=i;slides[currentSlide].classList.add('active');clearCanvas();}}
window.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown','Space','Enter','PageDown'].includes(e.key)||e.code==='Space')showSlide(currentSlide+1);else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key))showSlide(currentSlide-1);});
window.addEventListener('click',e=>{if(isDrawingMode||e.target.closest('#control-widget')||e.target.closest('#widget-toggle-btn')||e.target.closest('#picker-modal')||e.target.closest('.btn-answer')||e.target.closest('.quiz-option'))return;e.clientX>window.innerWidth/2?showSlide(currentSlide+1):showSlide(currentSlide-1);});
function showEmoji(em){const d=document.createElement('div');d.className='reaction-overlay';d.textContent=em;document.body.appendChild(d);requestAnimationFrame(()=>{d.style.transform='translate(-50%,-50%) scale(1)';d.style.opacity='1';});setTimeout(()=>{d.style.opacity='0';setTimeout(()=>d.remove(),400);},1000);}
function beep(ok){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const a=new A(),o=a.createOscillator(),g=a.createGain();o.type=ok?'sine':'sawtooth';o.frequency.setValueAtTime(ok?523.25:280,a.currentTime);if(ok)o.frequency.setValueAtTime(783.99,a.currentTime+0.15);o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(0.3,a.currentTime);g.gain.exponentialRampToValueAtTime(0.01,a.currentTime+0.6);o.start();o.stop(a.currentTime+0.6);}
function checkQuiz(el,ok,btnOnly=false){if(!btnOnly)el.classList.add(ok?'correct':'wrong');showEmoji(ok?'🎉🤩🎉':'😭🌧️');beep(ok);}
function showAnswer(id){const el=document.getElementById(id);if(el)el.style.display='block';}
let timerInterval,timeRemaining=300,defaultTime=300,isRunning=false;
function updateDisplay(){const m=String(Math.floor(timeRemaining/60)).padStart(2,'0'),s=String(timeRemaining%60).padStart(2,'0');document.getElementById('timer-display-mini').textContent=document.getElementById('timer-popup').textContent=m+':'+s;}
function setTimer(min){clearInterval(timerInterval);isRunning=false;defaultTime=timeRemaining=min*60;document.getElementById('btn-start').textContent='시작';document.getElementById('timer-popup').classList.remove('show');updateDisplay();}
function toggleTimer(){const p=document.getElementById('timer-popup'),b=document.getElementById('btn-start');if(isRunning){clearInterval(timerInterval);b.textContent='계속';p.classList.remove('show');}else{b.textContent='일시정지';p.classList.add('show');timerInterval=setInterval(()=>{if(timeRemaining>0){timeRemaining--;updateDisplay();}else{clearInterval(timerInterval);isRunning=false;b.textContent='시작';beep(true);}},1000);}isRunning=!isRunning;}
function resetTimer(){setTimer(defaultTime/60);}
const bgm=document.getElementById('bgm-audio');let bgmOn=false;
function toggleBGM(){const b=document.getElementById('bgm-btn');if(bgmOn){bgm.pause();b.textContent='🎵 배경음악 켜기';}else{bgm.play();b.textContent='⏸ 배경음악 끄기';}bgmOn=!bgmOn;}
const ALL_STUDENTS = ${JSON.stringify(pickerNames)};
let remainingStudents = [...ALL_STUDENTS];
function updatePickerStatus(){const el=document.getElementById('picker-status');if(el)el.textContent='남은 인원: '+remainingStudents.length+' / '+ALL_STUDENTS.length+'명';}
function resetPickerPool(){remainingStudents=[...ALL_STUDENTS];updatePickerStatus();}
function pickRandomStudent(){
 const noDup=document.getElementById('picker-no-dup')?.checked;
 if(noDup && remainingStudents.length===0) remainingStudents=[...ALL_STUDENTS];
 const pool = noDup ? remainingStudents : ALL_STUDENTS;
 if(!pool.length) return;
 const modal=document.getElementById('picker-modal'),txt=document.getElementById('picker-winner-text');
 modal.style.display='flex';
 let ticks=0;
 const spin=setInterval(()=>{
  txt.textContent=ALL_STUDENTS[Math.floor(Math.random()*ALL_STUDENTS.length)];
  ticks++;
  if(ticks>=14){
   clearInterval(spin);
   const winIdx=Math.floor(Math.random()*pool.length);
   const winner=pool[winIdx];
   if(noDup) remainingStudents.splice(winIdx,1);
   txt.textContent=winner;
   updatePickerStatus();
   beep(true);
   showEmoji('🙋‍♂️✨🎉');
  }
 },55);
}
<\/script></body></html>`;
}

function createInitialSwapLogDoc(req, d = initialData()){
 const dayNames = ["일","월","화","수","목","금","토"];
 const fmtShortDate = dStr => {
  if(!validDate(dStr)) return dStr || "";
  const dt = new Date(dStr+"T12:00:00Z");
  return `${dt.getUTCMonth()+1}/${dt.getUTCDate()}(${dayNames[dt.getUTCDay()]})`;
 };
 const parseRoomSubj = rawName => {
  if(!rawName) return {room:"", subj:""};
  const m = rawName.match(/^(\d+-\d+|\d+학년\s*\d+반)\s*(.*)$/);
  if(m) return {room:m[1].trim(), subj:(m[2]||rawName).replace(/[()]/g,"").trim()};
  return {room:rawName, subj:rawName};
 };
 const baseDate = req?.fromDate && validDate(req.fromDate) ? req.fromDate : day();
 const dt = new Date(baseDate+"T12:00:00Z");
 const periodStr = `${dt.getUTCFullYear()}년 ${dt.getUTCMonth()+1}월 ${dt.getUTCDate()}일~ ${dt.getUTCMonth()+1}월 ${dt.getUTCDate()}일 ( 1 )일간`;
 const fromParsed = parseRoomSubj(req?.fromClassName || "");
 const toParsed = parseRoomSubj(req?.toClassName || "");
 const isSub = req?.type === "sub";
 const firstRow = req ? {
  dateDay: req.type==="perm_swap" ? `${req.fromDay||""}요일` : fmtShortDate(req.fromDate),
  room: fromParsed.room || `${d.profile.grade}-${d.profile.classroom}`,
  period: String(req.fromPeriod || ""),
  absentSubject: fromParsed.subj || req.fromClassName || "",
  replaceSubject: isSub ? (fromParsed.subj || "동교과 보강") : (toParsed.subj || req.toClassName || ""),
  replaceTeacher: req.toTeacher || "",
   bogangDateDay: isSub ? fmtShortDate(req.fromDate) : (req.type==="perm_swap" ? `${req.toDay||""}요일` : fmtShortDate(req.toDate)),
  bogangRoom: isSub ? (fromParsed.room || "") : (toParsed.room || fromParsed.room || ""),
  bogangPeriod: isSub ? String(req.fromPeriod || "") : String(req.toPeriod || ""),
  rowNote: isSub ? "동교과 보강" : "수업 교체"
 } : {dateDay:"",room:"",period:"",absentSubject:"",replaceSubject:"",replaceTeacher:"",bogangDateDay:"",bogangRoom:"",bogangPeriod:"",rowNote:""};

 const rows = [firstRow];
 while(rows.length < 6){
  rows.push({dateDay:"",room:"",period:"",absentSubject:"",replaceSubject:"",replaceTeacher:"",bogangDateDay:"",bogangRoom:"",bogangPeriod:"",rowNote:""});
 }
 return {
  reason: req?.reason || "출장",
  periodText: periodStr,
  absentTeacher: req?.fromTeacher || d.profile.teacher || "",
  rows,
  bottomNote: ""
 };
}

function buildExamPaperHTML(examPaper, schoolName="광영고등학교", mode="student"){
 if(!examPaper || !Array.isArray(examPaper.sets) || !examPaper.sets.length) return null;
 const title = examPaper.title || "기출 재구성 모의고사";
 const subject = examPaper.subject || "국어 / 윤리 영역";
 const targetLabel = examPaper.targetClass || "전학년";

 let qCounter = 1;
 const numberedSets = examPaper.sets.map(s => {
  const startNum = qCounter;
  const items = (s.items || []).map(it => ({ ...it, printNum: qCounter++ }));
  const endNum = qCounter - 1;
  return { ...s, startNum, endNum, items };
 });
 const totalQuestions = qCounter - 1;

 const setsHtml = numberedSets.map(s => {
  const rangeStr = s.startNum === s.endNum ? `[${s.startNum}]` : `[${s.startNum}~${s.endNum}]`;
  const passageHtml = hasText(s.passage) ? `
   <div class="exam-passage-group">
    <div class="exam-range-header"><strong>${rangeStr}</strong> 다음 글을 읽고 물음에 답하시오. <span class="exam-source-tag">(${esc(s.year)} ${esc(s.examType)} · ${esc(s.category)})</span></div>
    <div class="exam-passage-box">${nl(s.passage)}</div>
   </div>
  ` : "";
  const itemsHtml = s.items.map(it => {
   const opts = Array.isArray(it.options) ? it.options : [];
   const circled = ["①","②","③","④","⑤"];
   return `
    <div class="exam-item">
     <div class="exam-q-stem"><strong>${it.printNum}.</strong> ${nl(it.question)} ${!hasText(s.passage)?`<span class="exam-source-tag">(${esc(s.year)} ${esc(s.examType)})</span>`:""}</div>
     ${hasText(it.box) ? `<div class="exam-bogi-box"><div class="exam-bogi-title">&lt;보 기&gt;</div>${nl(it.box)}</div>` : ""}
     <div class="exam-options">
      ${opts.map((opt, oi) => {
       const cleanOpt = String(opt||"").replace(/^[①②③④⑤1-5][.)\s]*/,"");
       return `<div class="exam-opt">${circled[oi]||""} ${nl(cleanOpt)}</div>`;
      }).join("")}
     </div>
    </div>
   `;
  }).join("");
  return passageHtml + itemsHtml;
 }).join("");

 const quickAnswerRows = numberedSets.flatMap(s => s.items).map(it => {
  const circled = ["①","②","③","④","⑤"][Number(it.answer)-1] || it.answer;
  return `<tr><th style="text-align:center;background:#f4f2f8">${it.printNum}번</th><td style="text-align:center;font-weight:700;color:#2b6cb0">${esc(circled)}</td><td style="text-align:center;font-size:8.5pt">${esc(it.difficulty||"중")}</td></tr>`;
 }).join("");

 const detailExplainHtml = numberedSets.flatMap(s => s.items.map(it => ({ ...it, setTitle: s.title, year: s.year, examType: s.examType, category: s.category }))).map(it => {
  const circled = ["①","②","③","④","⑤"][Number(it.answer)-1] || it.answer;
  return `<div style="border-bottom:1px solid #ccc;padding:10px 0;break-inside:avoid">
   <div style="font-weight:800;font-size:10.5pt;color:#1a365d">${it.printNum}번 &nbsp;|&nbsp; 정답: <span style="color:#e53e3e">${esc(circled)}</span> <span style="font-size:8.5pt;font-weight:400;color:#555">(${esc(it.year)} ${esc(it.examType)} · ${esc(it.category)} · 난이도 ${esc(it.difficulty||"중")})</span></div>
   <div style="margin-top:4px;font-size:9.5pt;line-height:1.65">${nl(it.explanation || "해설 참조")}</div>
  </div>`;
 }).join("");

 let bodyHtml = "";
 if(mode === "student" || mode === "all"){
  bodyHtml += `<section class="exam-page">
   <div class="exam-header">
    <div class="exam-header-top"><span>${esc(schoolName)} · ${esc(targetLabel)}</span><span>총 ${totalQuestions}문항</span></div>
    <div class="exam-main-title">${esc(title)}</div>
    <div class="exam-sub-bar">
     <span><strong>과목/영역:</strong> ${esc(subject)}</span>
     <span>학년 _____ 반 _____ 번호 _____ 성명 ______________</span>
    </div>
   </div>
   <div class="exam-two-col">${setsHtml}</div>
  </section>`;
 }
 if(mode === "quick" || mode === "all"){
  bodyHtml += `<section class="exam-page" style="${mode==="all"?"break-before:page":""}">
   <div class="exam-header">
    <div class="exam-main-title" style="font-size:18pt">${esc(title)} — 빠른 정답표</div>
   </div>
   <table style="width:100%;border-collapse:collapse;margin-top:12px">
    <thead><tr><th style="border:1px solid #333;padding:6px;width:25%">문항 번호</th><th style="border:1px solid #333;padding:6px;width:45%">정답</th><th style="border:1px solid #333;padding:6px;width:30%">난이도</th></tr></thead>
    <tbody>${quickAnswerRows}</tbody>
   </table>
  </section>`;
 }
 if(mode === "explain" || mode === "all"){
  bodyHtml += `<section class="exam-page" style="${mode==="all"?"break-before:page":""}">
   <div class="exam-header">
    <div class="exam-main-title" style="font-size:18pt">${esc(title)} — 교사용 상세 해설지</div>
   </div>
   <div class="exam-two-col" style="margin-top:14px">${detailExplainHtml}</div>
  </section>`;
 }

 return `<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>${esc(title)}</title><style>
  @page { size: A4 portrait; margin: 11mm 12mm; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #eef0f5; font: 9.5pt/1.55 "함초롬바탕", "바탕", "Noto Serif KR", "Malgun Gothic", serif; color: #111; }
  body { padding: 18px 0; }
  .toolbar { max-width: 210mm; margin: 0 auto 14px auto; padding: 12px 16px; background: #fff; border: 1px solid #dcd3ee; border-radius: 10px; display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; font-family: -apple-system, "Malgun Gothic", sans-serif; }
  .toolbar button { background: #6550bb; border: 0; color: #fff; border-radius: 6px; padding: 10px 16px; cursor: pointer; font-weight: 700; }
  .exam-page { width: 210mm; min-height: 297mm; padding: 12mm 13mm; margin: 0 auto 20px auto; background: #fff; box-shadow: 0 4px 18px rgba(0,0,0,.08); }
  .exam-header { border: 2px solid #111; padding: 10px 14px; margin-bottom: 14px; text-align: center; }
  .exam-header-top { display: flex; justify-content: space-between; font-size: 8.5pt; font-weight: 700; color: #444; margin-bottom: 4px; }
  .exam-main-title { font-size: 20pt; font-weight: 900; letter-spacing: 1px; margin: 4px 0 8px 0; font-family: "Malgun Gothic", sans-serif; }
  .exam-sub-bar { display: flex; justify-content: space-between; border-top: 1px solid #333; padding-top: 6px; font-size: 9.5pt; }
  .exam-two-col { column-count: 2; column-gap: 7mm; column-rule: 0.8px solid #444; text-align: justify; }
  .exam-passage-group { margin-bottom: 10px; }
  .exam-range-header { font-size: 9.5pt; margin-bottom: 5px; font-weight: 700; }
  .exam-source-tag { font-size: 8pt; font-weight: 400; color: #555; }
  .exam-passage-box { border: 1px solid #222; padding: 8px 9px; font-size: 9.2pt; line-height: 1.6; margin-bottom: 10px; background: #fff; }
  .exam-item { break-inside: avoid; margin-bottom: 14px; }
  .exam-q-stem { font-size: 9.5pt; line-height: 1.5; margin-bottom: 6px; }
  .exam-bogi-box { border: 1px solid #333; padding: 7px 9px; margin: 6px 0 8px 0; font-size: 9pt; line-height: 1.55; position: relative; }
  .exam-bogi-title { text-align: center; font-weight: 700; font-size: 9pt; margin-bottom: 4px; }
  .exam-options { display: flex; flex-direction: column; gap: 3px; padding-left: 4px; font-size: 9.2pt; }
  .exam-opt { line-height: 1.45; }
  table th, table td { border: 1px solid #333; padding: 5px 6px; font-size: 9pt; }
  @media print { html, body { background: #fff; padding: 0; } .exam-page { width: 100%; min-height: auto; margin: 0; padding: 0; box-shadow: none; } .toolbar { display: none; } }
 </style></head><body>
 <div class="toolbar"><button onclick="window.print()">🖨️ 모의고사 2단 시험지 인쇄 / PDF 저장</button><span style="font-size:9pt;color:#555">A4 세로 · 2단 다단 조판이 자동 적용되어 있습니다.</span></div>
 ${bodyHtml}
 </body></html>`;
}

 if p_code is null or p_code !~ '^[0-9a-f]{64}$' then raise exception '잘못된 코드'; end if;

 if p_code is null or p_code !~ '^[0-9a-f]{64}$' then raise exception '잘못된 코드'; end if;

  try{
   if(file.size>12*1024*1024)throw Error("PDF는 12MB 이하만 지원합니다.");
   const bytes=new Uint8Array(await file.arrayBuffer());
   let binary="";for(let i=0;i<bytes.length;i+=32768)binary+=String.fromCharCode(...bytes.subarray(i,i+32768));

  }catch(e){setError(e.message);}
 }

 // CSV 파일에서 [과목명, 연번, 학반, 이름, 학생연락처, 보호자연락처, 비고]를 읽어 과목별로 자동 분류·등록하는 함수
 function importSubjectCSVText(text, fallbackSubject=""){
  const rows = text.replace(/^\ufeff/,"").split(/\r?\n/).map(r=>r.trim()).filter(Boolean);
  if(!rows.length){notify("CSV 파일이 비어 있습니다.");return;}
  const header = rows[0].split(",").map(c=>c.replace(/^"|"$/g,"").trim());
  const isHeader = header.some(h=>/과목|수업|이름|성명|번호|연번/.test(h));
  const dataRows = isHeader ? rows.slice(1) : rows;
  const grouped = {};

  dataRows.forEach((line, idx) => {
   const cols = line.split(",").map(c=>c.replace(/^"|"$/g,"").trim());
   if(!cols.length) return;
   let subj="", num=idx+1, dept="", name="", phone="", parentPhone="", memo="";
   if(cols.length >= 4 && !/^\d+$/.test(cols[0])){
    // 양식: 과목명, 연번, 학반, 이름, 학생연락처(선택), 보호자연락처(선택), 비고(선택)
    subj = cols[0] || fallbackSubject || "기본교과";
    num = Number(cols[1]) || (idx+1);
    dept = cols[2] || "";
    name = cols[3] || "";
    phone = cols[4] || "";
    parentPhone = cols[5] || "";
    memo = cols[6] || "";
   } else if(cols.length >= 3 && /^\d+$/.test(cols[0])){
    // 양식: 연번, 학반, 이름, 연락처...
    subj = fallbackSubject || "교과수업반";
    num = Number(cols[0]) || (idx+1);
    dept = cols.length>=4 ? cols[1] : "";
    name = cols.length>=4 ? cols[2] : cols[1];
    phone = cols.length>=4 ? cols[3] : (cols[2]||"");
    parentPhone = cols[4] || "";
    memo = cols[5] || "";
   } else {
    subj = fallbackSubject || "교과수업반";
    name = cols[0] || "";
   }
   if(!name || name==="이름" || name==="성명") return;
   if(!grouped[subj]) grouped[subj] = [];
   grouped[subj].push({id:uid(), number:num, dept, name, phone, parentPhone, memo, submitted:false});
  });

  const subjNames = Object.keys(grouped);
  if(!subjNames.length){notify("인식된 학생 명단이 없습니다. 양식을 확인해 주세요.");return;}

  update(d => {
   const nextClasses = [...(d.subjectClasses||[])];
   subjNames.forEach(sName => {
    const existIdx = nextClasses.findIndex(c => c.id!=="homeroom" && (c.name===sName || c.subject===sName));
    if(existIdx >= 0){
     nextClasses[existIdx] = {...nextClasses[existIdx], name:sName, subject:sName, students:grouped[sName]};
    } else {
     nextClasses.push({id:"cls-"+uid(), name:sName, subject:sName, students:grouped[sName]});
    }
   });
   return {...d, subjectClasses:nextClasses};
  });
  notify(`총 ${subjNames.length}개 과목(${subjNames.join(", ")})의 학생 명단을 자동 인식하여 등록했습니다!`);
 }

 function importCurriculumMatrixText(rawText, allowNonMaster=false){
  if(!allowNonMaster && !["master","subadmin"].includes(currentUser?.role)){
   notify("전교생 선택과목 일괄 업로드는 총괄 마스터 또는 학교 관리자 계정에서 수행할 수 있습니다.");
   return;
  }
  const lines = rawText.replace(/^\ufeff/,"").split(/\r?\n/).map(r=>r.trim()).filter(Boolean);
  if(lines.length < 2){notify("헤더 행과 학생 데이터 행을 포함해 2줄 이상 입력해 주세요.");return;}
  const splitLine = line => line.includes("\t") ? line.split("\t").map(c=>c.trim()) : line.split(",").map(c=>c.replace(/^"|"$/g,"").trim());
  const headerCols = splitLine(lines[0]);

  let idxGrade=-1, idxClass=-1, idxNum=-1, idxStudentId=-1, idxName=-1;
  const slotCols = [];

  headerCols.forEach((h, i) => {
   if(/학번/.test(h)) idxStudentId = i;
   else if(/^학년$/.test(h)) idxGrade = i;
   else if(/^(학반|반)$/.test(h)) idxClass = i;
   else if(/^(번호|연번)$/.test(h)) idxNum = i;
   else if(/^(이름|성명|학생명)$/.test(h)) idxName = i;
   else if(h) slotCols.push({index:i, label:h});
  });

  if(idxName === -1){
   notify("첫 줄(헤더)에 '이름' 또는 '성명' 열이 있어야 합니다. (예: 학반, 번호, 이름, A타임, B타임...)");
   return;
  }

  const rows = [];
  const subjectGroupMap = {};

  lines.slice(1).forEach((line, rIdx) => {
   const cols = splitLine(line);
   const name = cols[idxName] || "";
   if(!name || name==="이름" || name==="성명") return;

   let dept = "";
   let num = rIdx + 1;
   if(idxStudentId !== -1 && cols[idxStudentId]){
    const sid = cols[idxStudentId].replace(/\D/g,"");
    if(sid.length === 5){
     dept = `${Number(sid[0])}-${Number(sid.slice(1,3))}`;
     num = Number(sid.slice(3,5)) || num;
    } else if(sid.length === 4){
     dept = `${Number(sid[0])}-${Number(sid[1])}`;
     num = Number(sid.slice(2,4)) || num;
    } else {
     dept = cols[idxStudentId];
    }
   } else {
    const g = idxGrade !== -1 ? cols[idxGrade]?.replace(/\D/g,"") : String(live.current.profile.grade||1);
    const c = idxClass !== -1 ? cols[idxClass]?.replace(/\D/g,"") : "";
    if(idxClass !== -1 && cols[idxClass]?.includes("-")) dept = cols[idxClass];
    else if(g && c) dept = `${g}-${c}`;
    else if(c) dept = `${live.current.profile.grade||1}-${c}`;
    else dept = `${live.current.profile.grade||1}-${live.current.profile.classroom||1}`;
    if(idxNum !== -1 && Number(cols[idxNum])) num = Number(cols[idxNum]);
   }

   const choices = {};
   slotCols.forEach(sc => {
    const val = cols[sc.index] || "";
    choices[sc.label] = val;
    if(val && val !== "-" && val !== "공강" && val !== "자습"){
     const classKey = `[${sc.label}] ${val}`;
     if(!subjectGroupMap[classKey]) subjectGroupMap[classKey] = {subject:val, slot:sc.label, students:[]};
     subjectGroupMap[classKey].students.push({
      id:uid(),
      number:subjectGroupMap[classKey].students.length + 1,
      dept,
      name,
      phone:"",
      parentPhone:"",
      memo:`원번:${num}번`,
      submitted:false
     });
    }
   });

   rows.push({id:uid(), dept, number:num, name, choices});
  });

  if(!rows.length){notify("인식된 학생 데이터가 없습니다.");return;}

  const myDept = `${live.current.profile.grade}-${live.current.profile.classroom}`;
  const myClassStudents = rows.filter(r => r.dept === myDept).sort((a,b)=>a.number - b.number);

  let updatedSharedPayload = null;
  update(d => {
   const nextClasses = [...(d.subjectClasses||[])];
   Object.entries(subjectGroupMap).forEach(([cName, info]) => {
    const existIdx = nextClasses.findIndex(c => c.id!=="homeroom" && c.name === cName);
    if(existIdx >= 0){
     nextClasses[existIdx] = {...nextClasses[existIdx], subject:info.subject, students:info.students};
    } else {
     nextClasses.push({id:"cls-"+uid(), name:cName, subject:info.subject, students:info.students});
    }
   });
   const nextStudents = myClassStudents.length >= 3
    ? myClassStudents.map(s => {
       const old = d.students.find(x => x.name === s.name);
       return old ? {...old, number:s.number} : {id:uid(), number:s.number, name:s.name, phone:"", parentPhone:"", memo:"", submitted:false};
      })
    : d.students;

   const nextElectiveMatrix = {
    ...(d.electiveMatrix||{}),
    headers: slotCols.map(s=>s.label),
    rows
   };
   updatedSharedPayload = {
    electiveMatrix: nextElectiveMatrix,
    subjectClasses: nextClasses.filter(c => c.id !== "homeroom"),
    periodTimes: d.periodTimes,
    updatedBy: currentUser?.name || d.profile.teacher || "관리자",
    updatedAt: new Date().toISOString()
   };

   return {
    ...d,
    students: nextStudents,
    subjectClasses: nextClasses,
    electiveMatrix: nextElectiveMatrix
   };
  });

  if(updatedSharedPayload){
   setTimeout(() => pushSharedSchoolRoster(updatedSharedPayload), 100);
  }
  notify(`총 ${rows.length}명 분석 완료! 학교 공용 마스터 채널(SCHOOL_SHARED_ROSTER_CODE)을 통해 전교사 화면에 5초 이내 자동 반영됩니다.`);
 }

 function getActiveSwapOverride(dateStr, periodNum){
  const myName = (currentUser?.name || live.current?.profile?.teacher || "").trim();
  if(!myName) return null;
  const approvedList = (swapRequestsRef.current || []).filter(r => r.status === "approved");
  for(let i = approvedList.length - 1; i >= 0; i--){
   const r = approvedList[i];
   if(r.type === "temp_swap"){
    if(r.fromTeacher === myName && r.fromDate === dateStr && Number(r.fromPeriod) === Number(periodNum)){
     return {mode:"일시교체", classId:r.toClassId, className:r.toClassName, students:r.toStudents||[], partner:r.toTeacher, note:`${r.toTeacher} 선생님 수업과 일시 교체됨`};
    }
    if(r.toTeacher === myName && r.toDate === dateStr && Number(r.toPeriod) === Number(periodNum)){
     return {mode:"일시교체", classId:r.fromClassId, className:r.fromClassName, students:r.fromStudents||[], partner:r.fromTeacher, note:`${r.fromTeacher} 선생님 수업과 일시 교체됨`};
    }
   } else if(r.type === "sub"){
    if(r.toTeacher === myName && r.fromDate === dateStr && Number(r.fromPeriod) === Number(periodNum)){
     return {mode:"동교과보강", classId:r.fromClassId, className:r.fromClassName, students:r.fromStudents||[], partner:r.fromTeacher, note:`${r.fromTeacher} 선생님 동교과 보강 대행 중`};
    }
    if(r.fromTeacher === myName && r.fromDate === dateStr && Number(r.fromPeriod) === Number(periodNum)){
     return {mode:"보강위임됨", classId:r.fromClassId, className:r.fromClassName, students:r.fromStudents||[], partner:r.toTeacher, note:`${r.toTeacher} 선생님이 보강 진행 중`};
    }
   }
  }
  return null;
 }

 function detectCurrentClass(d = live.current){
  const now = new Date();
  const dayNames = ["일","월","화","수","목","금","토"];
  const todayName = dayNames[now.getDay()];
  const todayDate = day();
  const hm = String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  const foundPeriod = FIXED_PERIOD_TIMES.find(p => hm >= p.start && hm <= p.end);
  if(foundPeriod){
   setActivePeriod(foundPeriod.period);
   const override = getActiveSwapOverride(todayDate, foundPeriod.period);
   if(override && override.classId){
    setActiveClassId(override.classId);
    return {period:foundPeriod.period, classId:override.classId, auto:true, dayName:todayName, override};
   }
   const scheduledId = d.timetable?.[`${todayName}-${foundPeriod.period}`];
   if(scheduledId && (scheduledId==="homeroom" || (d.subjectClasses||[]).some(c=>c.id===scheduledId))){
    setActiveClassId(scheduledId);
    return {period:foundPeriod.period, classId:scheduledId, auto:true, dayName:todayName};
   }
  }
  return {period:foundPeriod?.period||activePeriod, classId:activeClassId, auto:false, dayName:todayName};
 }

 async function getSchoolChannelCode(schoolNameInput){

  if(!sName || sName === "광영고등학교") return SCHOOL_SHARED_ROSTER_CODE;

 // [이중 채널 2] 학교별 공용 마스터 채널 읽기 (5초 주기 자동 갱신 · 학교별 완벽 분리)
 async function pullSharedSchoolRoster(silent = true, targetSchoolOverride = ""){
  if(sharedLockRef.current) return;
  sharedLockRef.current = true;
  try {
   const cfg = getSupabaseClientConfig();
   const activeSchoolName = targetSchoolOverride || currentUser?.school || selectedSchool || live.current?.profile?.school || "광영고등학교";
   const channelCode = await getSchoolChannelCode(activeSchoolName);
   const r = await rpc(cfg, "read", { p_code: channelCode });
   if(r && r.version && r.version !== sharedVersionRef.current && isObj(r.data)){
    sharedVersionRef.current = r.version;
    const shared = r.data;
    const incomingSwaps = Array.isArray(shared.swapRequests) ? shared.swapRequests : [];
    swapRequestsRef.current = incomingSwaps;
    setSwapRequests(incomingSwaps);
    if(isText(shared.notice)){
     schoolNoticeRef.current = shared.notice;
     setSchoolNotice(shared.notice);
    }

    const myName = cleanMasterLabel(currentUser?.name || live.current?.profile?.teacher || "");

    update(d => {
     const myHomeroom = (d.subjectClasses||[]).find(c => c.id === "homeroom") || {id:"homeroom",name:"우리반 (담임 기본 명렬)",subject:"학급",students:[]};
     const sharedClasses = Array.isArray(shared.subjectClasses) ? shared.subjectClasses.filter(c => c.id !== "homeroom") : [];
     const classMap = new Map();
     (d.subjectClasses||[]).filter(c => c.id !== "homeroom").forEach(c => classMap.set(c.id, c));
     sharedClasses.forEach(c => classMap.set(c.id, c));

     const nextTimetable = {...(d.timetable||{})};
     incomingSwaps.filter(req => req.status === "approved").forEach(req => {
      if(req.fromClassId && req.fromClassId !== "homeroom" && Array.isArray(req.fromStudents) && req.fromStudents.length){
       if(!classMap.has(req.fromClassId)) classMap.set(req.fromClassId, {id:req.fromClassId, name:req.fromClassName||req.fromClassId, subject:"교체·보강", students:req.fromStudents});
      }
      if(req.toClassId && req.toClassId !== "homeroom" && Array.isArray(req.toStudents) && req.toStudents.length){
       if(!classMap.has(req.toClassId)) classMap.set(req.toClassId, {id:req.toClassId, name:req.toClassName||req.toClassId, subject:"교체·보강", students:req.toStudents});
      }
      if(req.type === "perm_swap" && myName && !appliedPermSwapsRef.current.has(req.id)){
       if(req.fromTeacher === myName){
        nextTimetable[`${req.fromDay}-${req.fromPeriod}`] = req.toClassId || "";
        if(req.toDay && req.toPeriod) nextTimetable[`${req.toDay}-${req.toPeriod}`] = req.fromClassId || "";
        appliedPermSwapsRef.current.add(req.id);
       } else if(req.toTeacher === myName){
        if(req.toDay && req.toPeriod) nextTimetable[`${req.toDay}-${req.toPeriod}`] = req.fromClassId || "";
        nextTimetable[`${req.fromDay}-${req.fromPeriod}`] = req.toClassId || "";
        appliedPermSwapsRef.current.add(req.id);
       }
      }
     });

     const nextMatrix = isObj(shared.electiveMatrix) ? shared.electiveMatrix : d.electiveMatrix;
     const myDept = `${d.profile.grade}-${d.profile.classroom}`;
     const myClassStudents = Array.isArray(nextMatrix?.rows) ? nextMatrix.rows.filter(row => row.dept === myDept).sort((a,b)=>a.number - b.number) : [];
     const nextStudents = myClassStudents.length >= 3
      ? myClassStudents.map(s => {
         const old = d.students.find(x => x.name === s.name);
         return old ? {...old, number:s.number} : {id:uid(), number:s.number, name:s.name, phone:"", parentPhone:"", memo:"", submitted:false};
        })
      : d.students;
     const incomingSharedAtt = isObj(shared.sharedPeriodAtt) ? shared.sharedPeriodAtt : {};

     // 학교 공용 문제은행(sharedQuestionSets) 자동 병합
     const sharedQSets = Array.isArray(shared.sharedQuestionSets) ? shared.sharedQuestionSets : [];
     const localQSets = d.questionBank?.sets || [];
     const qSetMap = new Map();
     localQSets.forEach(s => qSetMap.set(s.id, s));
     sharedQSets.forEach(s => qSetMap.set(s.id, s));

     return {
      ...d,
      students: nextStudents,
      subjectClasses: [myHomeroom, ...Array.from(classMap.values())],
      timetable: nextTimetable,
      electiveMatrix: nextMatrix,
      questionBank: {
       ...(d.questionBank || {sets:[], usedHistory:{}}),
       sets: Array.from(qSetMap.values())
      },
      classAttendance: {
       ...(d.classAttendance || {}),
       __sharedPeriod: {
        ...(d.classAttendance?.__sharedPeriod || {}),
        ...incomingSharedAtt
       }
      }
     };
    });
    setSharedSyncStatus(`${activeSchoolName} 공용 채널 연동됨 (v${r.version})`);
    if(!silent) notify(`[${activeSchoolName}] 공용 명단·공지·문제은행 및 수업 교체 현황을 최신 상태로 갱신했습니다.`);
   }
  } catch {
   // 최초에 해당 학교 공용 채널이 아직 생성되지 않은 경우 무시
  } finally {
   sharedLockRef.current = false;
  }
 }

 // [이중 채널 2] 학교별 공용 마스터 채널 쓰기 (충돌 시 최대 3회 자동 재시도 병합 보장)
 async function pushSharedSchoolRoster(customPayload = null, targetSchoolOverride = ""){
  try {
   const cfg = getSupabaseClientConfig();
   const activeSchoolName = targetSchoolOverride || currentUser?.school || selectedSchool || live.current?.profile?.school || "광영고등학교";
   const channelCode = await getSchoolChannelCode(activeSchoolName);

   for(let attempt = 0; attempt < 3; attempt++){
    const cur = live.current;
    let existingShared = {};
    let curVersion = 0;
    try {
     const curServer = await rpc(cfg, "read", { p_code: channelCode });
     existingShared = isObj(curServer?.data) ? curServer.data : {};
     curVersion = curServer.version || 1;
    } catch {}

    const mergedSharedAtt = {
     ...(existingShared.sharedPeriodAtt || {}),
     ...(cur.classAttendance?.__sharedPeriod || {}),
     ...(customPayload?.sharedPeriodAtt || {})
    };

    const payload = {
     ...existingShared,
     schoolName: activeSchoolName,
     notice: customPayload?.notice !== undefined ? customPayload.notice : (schoolNoticeRef.current || existingShared.notice || ""),
     electiveMatrix: cur.electiveMatrix,
     subjectClasses: (cur.subjectClasses || []).filter(c => c.id !== "homeroom"),
     periodTimes: FIXED_PERIOD_TIMES,
     swapRequests: swapRequestsRef.current || existingShared.swapRequests || [],
     sharedPeriodAtt: mergedSharedAtt,
     sharedQuestionSets: customPayload?.sharedQuestionSets !== undefined ? customPayload.sharedQuestionSets : (cur.questionBank?.sets || existingShared.sharedQuestionSets || []),
     ...(customPayload || {}),
     updatedBy: cleanMasterLabel(currentUser?.name || cur.profile.teacher || "교사"),
     updatedAt: new Date().toISOString()
    };

    if(Array.isArray(payload.swapRequests)){
     swapRequestsRef.current = payload.swapRequests;
     setSwapRequests(payload.swapRequests);
    }
    if(isText(payload.notice)){
     schoolNoticeRef.current = payload.notice;
     setSchoolNotice(payload.notice);
    }

    if(curVersion > 0){
     const w = await rpc(cfg, "write", { p_code: channelCode, p_version: curVersion, p_data: payload });
     if(w?.conflict){
      await new Promise(res => setTimeout(res, 180 * (attempt + 1)));
      continue;
     }
     if(w?.version) sharedVersionRef.current = w.version;
     break;
    } else {
     await rpc(cfg, "create", { p_code: channelCode, p_data: payload });
     sharedVersionRef.current = 1;
     break;
    }
   }
   setSharedSyncStatus(`${activeSchoolName} 공용 동기화 완료`);
  } catch(e) {
   setError("학교 공용 채널 서버 반영 실패: " + e.message);
  }
 }

 // 담임교사가 선택한 특정 교시들(예: 1~4교시)에 특정 학생(또는 전체 학생)의 출결을 동시 반영하는 함수
 function applyStudentAttToSelectedPeriods(dateStr, periodsArray, stuList, statusVal, nextHrDayMap){
  const cur = live.current;
  const myDept = `${cur.profile.grade}-${cur.profile.classroom}`;
  const teacherName = cleanMasterLabel(currentUser?.name || cur.profile.teacher || "담임교사");
  const nextSharedByDate = { ...(cur.classAttendance?.__sharedPeriod?.[dateStr] || {}) };
  const nextHomeroomPeriodAtt = { ...(cur.classAttendance?.homeroom || {}) };
  const targetPeriods = Array.isArray(periodsArray) && periodsArray.length > 0 ? periodsArray : [];

  targetPeriods.forEach(p => {
   const rKey = `${dateStr}_${p}교시`;
   const pMap = { ...(nextHomeroomPeriodAtt[rKey] || {}) };
   const sharedPMap = { ...(nextSharedByDate[p] || {}) };
   stuList.forEach(st => {
    pMap[st.id] = statusVal;
    if(statusVal === "미기록"){
     delete sharedPMap[`${myDept}|${st.name}`];
    } else {
     sharedPMap[`${myDept}|${st.name}`] = {
      status: statusVal,
      subject: `담임지정(${p}교시)`,
      teacher: teacherName,
      updatedAt: new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})
     };
    }
   });
   nextHomeroomPeriodAtt[rKey] = pMap;
   nextSharedByDate[p] = sharedPMap;
  });

  update(d => ({
   ...d,
   attendance: { ...d.attendance, [dateStr]: nextHrDayMap },
   classAttendance: {
    ...(d.classAttendance || {}),
    homeroom: nextHomeroomPeriodAtt,
    ...(targetPeriods.length > 0 ? {
     __sharedPeriod: {
      ...(d.classAttendance?.__sharedPeriod || {}),
      [dateStr]: nextSharedByDate
     }
    } : {})
   }
  }));
  if(targetPeriods.length > 0){
   setTimeout(() => pushSharedSchoolRoster({ sharedPeriodAtt: { [dateStr]: nextSharedByDate } }), 120);
  }
 }

    });
    const c = { url: cfg.url, key: cfg.key, code: found.roomCode, version: 1, last: JSON.stringify(initPersonal), active: true };

 // [4번 기능] 수능·모의고사 기출 PDF 업로드 및 AI 지문·문항 세트 자동 분해 추출
 async function readQuestionBankPDF(file){
  if(!file) return;
  try {
   if(file.size > 15 * 1024 * 1024) throw Error("기출 PDF는 15MB 이하만 지원합니다.");
   const bytes = new Uint8Array(await file.arrayBuffer());
   let binary = "";
   for(let i = 0; i < bytes.length; i += 32768) binary += String.fromCharCode(...bytes.subarray(i, i + 32768));
   setQbPdf({ name: file.name, base64: btoa(binary) });
   notify(`[${file.name}] 기출 PDF를 준비했습니다. 아래 [AI 기출 지문·문항 자동 추출] 버튼을 눌러주세요.`);
  } catch(e) {
   setError(e.message);
  }
 }

 // qbPdf 전용 Gemini Vision 직접 호출로 기출 세트 추출 및 학교 공용 문제은행/구글 드라이브 저장
 function runExtractQuestionBankPDF(){
  if(!qbPdf){ setError("먼저 수능·모의고사 기출 PDF 파일을 업로드해 주세요."); return; }
  run("기출 PDF에서 지문 세트 및 5지선다 문항·해설을 AI로 정밀 분해 중...", async(signal, current) => {
   const chosen = models.find(m => m.id === model);
   const gen = {
    temperature: 0.15,
    maxOutputTokens: chosen?.outputLimit ? Math.min(16000, chosen.outputLimit) : 16000,
    responseMimeType: "application/json",
    responseSchema: responseSchema(TEMPLATES.examSet)
   };
   if(model === "gemini-2.5-flash") gen.thinkingConfig = { thinkingBudget: 0 };

   const prompt = `당신은 한국 수능 및 평가원·교육청 모의고사 기출문제 DB 구축 전문가입니다.
첨부된 기출 PDF에서 지문 세트와 문항들을 정밀하게 분해하여 추출하세요.
- 기본 정보: 연도(${qbMeta.year}), 시험명(${qbMeta.examType}), 대상학년(${qbMeta.grade}), 교과(${qbMeta.subject}), 기본영역(${qbMeta.defaultCategory})
- 국어(독서)는 category를 [인문, 사회, 과학, 기술, 예술, 주제통합] 중에서 자동 판별해 태깅하세요.
- 국어(문학)는 category를 [현대시, 고전시가, 현대소설, 고전소설, 극·수필, 갈래복합] 중에서 자동 판별해 태깅하세요.
- 윤리(생활과 윤리, 윤리와 사상)는 category를 단원 핵심 주제로 태깅하세요.
- 지문 공유형 세트 문제는 passage에 지문 전문을 그대로 보존하고 items 배열에 소속 문항들을 모두 담으세요.
- <보기>나 박스 제시문이 있으면 box 필드에 담고, 5지선다 선택지(options 5개), 정답 번호(answer 1~5), 난이도(상/중/하), 상세 해설(explanation)을 빠짐없이 작성하세요.`;

   const parts = [
    { text: prompt },
    { inlineData: { mimeType: "application/pdf", data: qbPdf.base64 } }
   ];
   const r = await fetch(API + "/models/" + encodeURIComponent(model) + ":generateContent", {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-goog-api-key": apiKey.trim() },
    body: JSON.stringify({ contents: [{ role: "user", parts }], generationConfig: gen }),
    signal
   });
   const v = await r.json();
   if(!r.ok) throw Error("기출 PDF AI 분석 실패 (HTTP " + r.status + ")");
   const raw = v.candidates?.[0]?.content?.parts?.filter(p => isText(p.text) && !p.thought).map(p => p.text).join("") || "";
   const parsed = JSON.parse(raw.slice(raw.indexOf("{"), raw.lastIndexOf("}") + 1));
   if(!valid("examSet", parsed)) throw Error("추출된 기출문항 구조 검증에 실패했습니다.");
   if(!current()) return;

   const newSets = parsed.sets.map((s, idx) => ({
    id: `qb-${qbMeta.year}-${Date.now()}-${idx}`,
    year: s.year || qbMeta.year,
    examType: s.examType || qbMeta.examType,
    grade: s.grade || qbMeta.grade,

    category: s.category || qbMeta.defaultCategory,
    title: s.title || `${qbMeta.year} ${qbMeta.examType} ${s.category || ""}`,
    passage: s.passage || "",
    items: (s.items || []).map((it, qi) => ({
     id: `q-${Date.now()}-${idx}-${qi}`,
     num: Number(it.num) || (qi + 1),
     question: it.question || "",
     box: it.box || "",
     options: Array.isArray(it.options) && it.options.length >= 4 ? it.options.slice(0, 5) : ["①","②","③","④","⑤"],
     answer: Number(it.answer) || 1,
     difficulty: it.difficulty || "중",
     explanation: it.explanation || ""
    })),
    createdBy: cleanMasterLabel(currentUser?.name || data.profile.teacher || "교사"),
    createdAt: day()
   }));

   let mergedSets = [];
   update(d => {
    const existing = d.questionBank?.sets || [];
    mergedSets = [...newSets, ...existing];
    return {
     ...d,

      ...(d.questionBank || { usedHistory: {} }),
      sets: mergedSets
     }
    };
   });

   setTimeout(() => pushSharedSchoolRoster({ sharedQuestionSets: mergedSets }), 150);
   setQbTab("generator");
   notify(`총 ${newSets.length}개 지문 세트(${newSets.reduce((a,b)=>a+b.items.length,0)}문항)를 성공적으로 추출하여 문제은행에 적재했습니다!`);

 // [4번 기능] 이미 출력한 문제는 자동으로 제외(비중복)하고 랜덤 시험지를 조합하는 함수
 function generateNonDuplicateExamPaper(){
  const allSets = data.questionBank?.sets || [];
  const usedList = data.questionBank?.usedHistory?.[qbFilter.targetKey] || [];
  const usedSet = new Set(usedList);
  const manualSet = new Set(qbFilter.includeManualIds || []);

  // 1) 수동으로 반드시 포함하도록 체크한 지문 세트
  const forcedSets = allSets.filter(s => manualSet.has(s.id));

  // 2) 조건에 맞는 후보 풀 필터링 (기출제 제외 옵션이 켜져 있으면 usedSet에 없는 문제만 추출)
  const candidatePool = allSets.filter(s => {
   if(manualSet.has(s.id)) return false;
   if(qbFilter.subject !== "전체" && s.subject !== qbFilter.subject) return false;
   if(qbFilter.categories.length > 0 && !qbFilter.categories.includes(s.category)) return false;
   if(qbFilter.excludeUsed && usedSet.has(s.id)) return false;
   return true;
  });

  // 3) 피셔-예이츠 랜덤 셔플
  const shuffled = [...candidatePool];
  for(let i = shuffled.length - 1; i > 0; i--){
   const j = Math.floor(Math.random() * (i + 1));
   [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }

  const needCount = Math.max(0, (Number(qbFilter.setCount) || 2) - forcedSets.length);
  const pickedSets = [...forcedSets, ...shuffled.slice(0, needCount)];

  if(!pickedSets.length){
   notify("조건에 맞는 미출제 문제가 없습니다! 기출제 제외 옵션을 끄거나 출제 이력을 리셋해 주세요.");
   return;
  }

  setGeneratedPaper({
   id: "paper-" + uid(),
   title: qbFilter.paperTitle || `${qbFilter.subject} 실전 기출 모의고사`,
   subject: qbFilter.subject,
   targetClass: qbFilter.targetKey,
   sets: pickedSets,
   createdAt: day(),
   confirmedUsed: false
  });
  notify(`미출제 문제 풀에서 중복 없이 총 ${pickedSets.length}개 세트(${pickedSets.reduce((a,b)=>a+b.items.length,0)}문항)를 랜덤 추출했습니다!`);
 }

 // 시험지 인쇄 확정 시 출제 이력(usedHistory)에 기록하여 다음번 추출 시 중복 방지
 function confirmAndMarkPaperUsed(printMode = "student"){
  if(!generatedPaper) return;
  const targetKey = generatedPaper.targetClass || qbFilter.targetKey || "우리반 (기본)";
  const pickedIds = generatedPaper.sets.map(s => s.id);
  update(d => {
   const prevUsed = d.questionBank?.usedHistory?.[targetKey] || [];
   const nextUsed = Array.from(new Set([...prevUsed, ...pickedIds]));
   return {
    ...d,
    questionBank: {
     ...(d.questionBank || { sets: [] }),
     usedHistory: {
      ...(d.questionBank?.usedHistory || {}),
      [targetKey]: nextUsed
     }
    }
   };
  });
  setGeneratedPaper(prev => prev ? { ...prev, confirmedUsed: true } : prev);
  if(printMode){
   print(buildExamPaperHTML(generatedPaper, data.profile.school, printMode));
  }
  notify(`[${targetKey}] 출제 완료 이력에 ${pickedIds.length}개 세트를 기록했습니다. 다음 랜덤 추출부터 자동 제외됩니다!`);
 }

 // 이메일 인증 기반 무작위 임시 비밀번호 발송 및 초기화
 async function handlePasswordReset(e){
  e.preventDefault();
  if(authBusy) return;
  setAuthBusy(true); setAuthError(""); setAuthNotice("");
  try {
   const fd = new FormData(e.currentTarget);
   const username = String(fd.get("username")||"").trim().toLowerCase();
   const email = String(fd.get("email")||"").trim().toLowerCase();
   if(!username || !email) throw Error("가입 시 등록한 아이디와 이메일 주소를 모두 입력해 주세요.");

   const { version, accounts } = await loadAccountsChannel();
   const idx = accounts.findIndex(a => a.username.toLowerCase() === username && (a.email||"").toLowerCase() === email);
   if(idx === -1) throw Error("입력하신 아이디와 이메일 주소가 일치하는 교사 계정을 찾을 수 없습니다.");

   const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789!@#";
   const randBytes = new Uint8Array(10);
   crypto.getRandomValues(randBytes);
   const tempPassword = Array.from(randBytes, b => chars[b % chars.length]).join("");
   const newHash = await sha256Hex(tempPassword);

   const nextAccounts = accounts.map((a, i) => i === idx ? { ...a, passwordHash: newHash } : a);
   await saveAccountsChannel(nextAccounts, version);

   const targetGas = (gasUrl || DEFAULT_GAS_URL).trim();
   let emailed = false;
   if(targetGas){
    try {
     const res = await fetch(targetGas, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
       action: "sendTempPassword",
       email: accounts[idx].email,
       name: accounts[idx].name,
       username: accounts[idx].username,
       tempPassword
      }),
      redirect: "follow"
     });
     if(res.ok) emailed = true;
    } catch {}
   }
   setAuthMode("login");

 function sanitizeNewsContent(raw, fallbackDate) {
  const c = isObj(raw?.content) ? raw.content : (isObj(raw) ? raw : {});
  const str = (v, d) => hasText(v) ? String(v).trim() : d;
  const rawParas = Array.isArray(c.paragraphs) ? c.paragraphs.map(x => str(x, "")).filter(Boolean) : [];
  const paragraphs = (rawParas.length ? rawParas : ["본문 문단 내용을 확인하세요."]).slice(0, 5);
  const pLen = paragraphs.length;
  const rawNotes = Array.isArray(c.paragraphNotes) ? c.paragraphNotes.map(x => str(x, "")).filter(Boolean) : [];
  const paragraphNotes = Array.from({ length: pLen }, (_, i) => rawNotes[i] || `${i + 1}문단 핵심 중심 생각`);
  const vocabRaw = Array.isArray(c.vocabulary) ? c.vocabulary : [];
  const vocabulary = vocabRaw.map((w, i) => ({
   word: str(w?.word, `핵심어휘 ${i + 1}`),
   hanja: str(w?.hanja, "해당 없음"),
   part: str(w?.part, "명사"),
   definition: str(w?.definition, "문맥 속 의미를 파악해 보세요."),
   context: str(w?.context, "지문에서 사용된 문맥적 의미"),
   example: str(w?.example, "실생활 적용 예시 문장")
  })).slice(0, 8);
  while (vocabulary.length < 4) {
   const idx = vocabulary.length + 1;
   vocabulary.push({ word: `보충어휘 ${idx}`, hanja: "해당 없음", part: "명사", definition: "지문에서 주요 개념어를 찾아 뜻을 적어 보세요.", context: "본문 문맥 참고", example: "예문을 직접 만들어 보세요." });
  }
  const mcqRaw = Array.isArray(c.multipleChoice) ? c.multipleChoice : [];
  const multipleChoice = [0, 1].map(i => {
   const q = mcqRaw[i] || {};
   const opts = Array.isArray(q.options) ? q.options.map((o, j) => str(o, `선택지 ${j + 1}`)) : [];
   while (opts.length < 4) opts.push(`선택지 ${opts.length + 1}`);
   const ans = Number(q.answer);
   return {
    type: str(q.type, i === 0 ? "사실적 이해" : "추론적·비판적 이해"),
    question: str(q.question, `지문의 핵심 내용과 관련하여 물음에 답하시오. (문항 ${i + 1})`),
    options: opts.slice(0, 4),
    answer: Number.isInteger(ans) && ans >= 1 && ans <= 4 ? ans : 1,
    explanation: str(q.explanation, "본문 근거를 바탕으로 정답과 오답의 이유를 확인하세요."),
    evidence: str(q.evidence, `${Math.min(i + 1, pLen)}문단 참조`),
    intent: str(q.intent, "핵심 논지 및 세부 정보 파악")
   };
  });
  const w = isObj(c.written) ? c.written : {};
  const written = {
   question: str(w.question, "이 글의 핵심 쟁점에 대한 자신의 입장을 본문 근거를 들어 서술하시오."),
   hint: str(w.hint, "핵심 개념어를 포함하여 두 문장 이상으로 작성하세요."),
   sample: str(w.sample, "제시문의 논거를 바탕으로 자신의 관점과 대안을 구체적으로 서술한 예시 답안입니다."),
   criteria: Array.isArray(w.criteria) && w.criteria.length ? w.criteria.map(x => str(x, "핵심 개념 활용")) : ["핵심 개념어 포함 여부", "본문 근거와의 논리적 연결성"],
   evidence: str(w.evidence, "본문 전체 논지")
  };
  return {
   title: str(c.title, "시사 문해력 탐구 활동지"),
   newsTitle: str(c.newsTitle, str(c.title, "원기사 제목")),
   publisher: str(c.publisher, "시사·학술 매체"),
   articleDate: validDate(c.articleDate) ? c.articleDate : fallbackDate,
   selectionReason: str(c.selectionReason, "고등학교 교과 연계 및 심화 독해력 함양을 위해 선정한 주제입니다."),
   paragraphs,
   concepts: Array.isArray(c.concepts) && c.concepts.length ? c.concepts.map(x => str(x, "핵심개념")) : ["비판적 읽기", "시사 쟁점"],
   paragraphNotes,
   logic: str(c.logic, "문제 제기 → 핵심 원리 및 쟁점 분석 → 다각적 검토 및 시사점 도출"),
   vocabulary,
   multipleChoice,
   written,
   summary: str(c.summary, str(paragraphs[0], "핵심 요약 내용입니다.")),
   teacherNote: str(c.teacherNote, "학생들이 지문의 근거를 찾아 자신의 언어로 재구성하도록 지도해 주세요."),
   warnings: Array.isArray(c.warnings) && c.warnings.length ? c.warnings.map(x => str(x, "사실관계 및 시점 확인")) : ["수업 배포 전 기사 발행일과 최신 통계를 확인하세요."]
  };
 }

 async function fetchFromDrive(silent = false) {
  const targetUrl = gasUrl.trim();
  if(!targetUrl) {
   if(!silent) { setShowDriveConfig(true); setError("구글 앱스 스크립트 웹 앱 URL을 먼저 입력해 주세요."); }
   return;
  }
  setBusy("구글 드라이브 '문해력_창고' 폴더에서 활동지를 동기화하는 중입니다...");
  setError("");
  try {
   const sep = targetUrl.includes("?") ? "&" : "?";
   const r = await fetch(`${targetUrl}${sep}t=${Date.now()}`, { method: "GET", redirect: "follow" });
   if(!r.ok) throw Error(`서버 응답 오류 (HTTP ${r.status})`);
   const v = await r.json();
   if(v.error) throw Error(v.error);
   if(!Array.isArray(v.items)) throw Error("올바른 활동지 목록 형식(items 배열)이 아닙니다.");

   const existingMap = new Map((live.current.liveLiteracy?.items || []).map(x => [x.id, x]));
   const parsedItems = [];

   for(const item of v.items) {
    if(!isObj(item)) continue;
    const rawName = String(item.name || "").replace(/\.json$/i, "").trim();
    const parts = rawName.split("_").map(s => s.trim());

    let itemDate = day();
    const dateMatch = (parts[0] || "").match(/^(\d{4})[-.]?(\d{2})[-.]?(\d{2})$/);
    if(dateMatch) {
     const dStr = `${dateMatch[1]}-${dateMatch[2]}-${dateMatch[3]}`;
     if(validDate(dStr)) itemDate = dStr;
    } else if(validDate(item.date)) {
     itemDate = item.date;
    } else if(validDate(item.content?.articleDate)) {
     itemDate = item.content.articleDate;
    }

    const foundLevel = parts.find(p => LEVELS.includes(p)) || (LEVELS.includes(item.level) ? item.level : (LEVELS.includes(item.content?.level) ? item.content.level : "고등"));
    const foundCat = parts.find(p => CATEGORIES.includes(p)) || item.category || item.content?.category || parts[3] || "사회";

    const cleanContent = sanitizeNewsContent(item.content || item, itemDate);
    if(parts[1] && cleanContent.title === "시사 문해력 탐구 활동지") cleanContent.title = parts[1];
    if(!valid("news", cleanContent)) continue;

    const id = String(item.id || rawName || uid());
    const prev = existingMap.get(id);
    const rawSources = Array.isArray(item.sources) ? item.sources : (Array.isArray(item.content?.sources) ? item.content.sources : []);
    const cleanSources = rawSources.filter(s => isObj(s) && safeURL(s.url)).map(s => ({ title: hasText(s.title) ? s.title : "원문·참고 링크", url: safeURL(s.url) }));

    parsedItems.push({
     id,
     fileName: item.name || `${itemDate}_${cleanContent.title}_${foundLevel}_${foundCat}.json`,
     date: itemDate,
     level: foundLevel,
     category: foundCat,
     range: { start: itemDate, end: itemDate },
     content: cleanContent,
     sources: cleanSources,
     checks: prev && Array.isArray(prev.checks) && prev.checks.length === 4 ? prev.checks : [false, false, false, false],
     model: item.model || "Gemini (문해력_창고 연동)"
    });
   }

 async function readPDF(file){
  if(!file)return;const id=++fileSeq.current;setFileBusy(true);setPdf(null);setPdfConsent(false);
  try{
   if(file.size>12*1024*1024)throw Error("PDF는 12MB 이하만 지원합니다.");
   const bytes=new Uint8Array(await file.arrayBuffer());if(!new TextDecoder().decode(bytes.slice(0,1024)).includes("%PDF-"))throw Error("유효한 PDF가 아닙니다.");
   let binary="";for(let i=0;i<bytes.length;i+=32768)binary+=String.fromCharCode(...bytes.subarray(i,i+32768));
   if(id===fileSeq.current)setPdf({name:file.name,base64:btoa(binary)});
  }catch(e){setError(e.message);}finally{if(id===fileSeq.current)setFileBusy(false);}
 }

 async function connect(create){
  if(cloudBusy||syncLock.current||aiLock.current)return;setCloudBusy(true);setCloudError("");

   if(u.protocol!=="https:"||!u.hostname.endsWith(".supabase.co"))throw Error("Supabase HTTPS 프로젝트 URL을 입력하세요.");
   if(!key||key.startsWith("sb_secret_"))throw Error("공개 키만 사용할 수 있습니다.");
   if(key.split(".").length===3){let claims;try{const p=key.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");claims=JSON.parse(atob(p.padEnd(Math.ceil(p.length/4)*4,"=")));}catch{}if(claims?.role==="service_role")throw Error("service_role 비밀 키는 사용하지 마세요.");}
   let secret=code.trim().toLowerCase();
   if(create){const b=new Uint8Array(32);crypto.getRandomValues(b);secret=Array.from(b,x=>x.toString(16).padStart(2,"0")).join("");}

    const r=await rpc(c,"create",{p_code:secret,p_data:live.current});c.version=r.version;c.last=serialized;

   try{localStorage.setItem("gyomusil-cloud-config",JSON.stringify({url:c.url,key}));}catch{}
  }catch(e){setCloudError(e.message);}finally{setCloudBusy(false);}
 }
 async function syncTick(){
  const c=cloud.current;if(!c?.active||c.conflict||syncLock.current||aiLock.current)return;syncLock.current=true;
  try{
   const serialized=JSON.stringify(live.current);
   if(serialized!==c.last){
    if(Date.now()-editTime.current<1200)return;
    if(new Blob([serialized]).size>2900000)throw Error("동기화 용량 초과입니다. 백업 후 자료를 줄이세요.");
    const r=await rpc(c,"write",{p_code:c.code,p_version:c.version,p_data:live.current});if(cloud.current!==c)return;
    if(r.conflict){c.conflict=true;setConflict(true);setCloudStatus("동시 수정 확인 필요");return;}c.version=r.version;c.last=serialized;
   }else{
    const r=await rpc(c,"read",{p_code:c.code});if(cloud.current!==c)return;
    if(r.version!==c.version){if(aiLock.current||JSON.stringify(live.current)!==c.last)return;const v=normalize(r.data);c.version=r.version;c.last=JSON.stringify(v);live.current=v;setData(v);}
   }
   setCloudStatus("개인 사물함 최신 연결됨");setCloudError("");
  }catch(e){if(cloud.current===c){setCloudStatus("연결 확인 필요 · 로컬 보관");setCloudError(e.message);}}
  finally{syncLock.current=false;}
 }

 return <div className="min-h-screen">
 {drawer&&<button type="button" aria-label="메뉴 닫기" onClick={()=>setDrawer(false)} className="fixed inset-0 z-30 bg-slate-900/30 lg:hidden"/>}

  <div className="flex min-h-[64px] flex-col justify-center border-t border-line px-5 text-left text-xs text-slate-600">

  </div>
 </aside>
 <div className="lg:ml-[238px]">
  <header className="sticky top-0 z-20 flex min-h-[66px] items-center justify-between gap-2 border-b border-line bg-white px-4 md:px-7"><div className="flex min-w-0 items-center gap-2"><button type="button" aria-label="메뉴 열기" aria-expanded={drawer} onClick={()=>setDrawer(true)} className="p-2 lg:hidden"><Menu className="h-5 w-5"/></button><p className="truncate text-xs text-slate-500"><span className="hidden sm:inline">{currentUser?.school || data.profile.school} <ChevronRight className="mx-1 inline h-3 w-3"/></span><span className="text-ink font-semibold">{page}</span></p></div><div className="flex shrink-0 flex-wrap items-center gap-2">
   {(()=>{

     {currentUser.role==="master"?"👑":"🏫"} <span className="hidden sm:inline">{currentUser.role==="master"?"총괄 마스터 관리":`${currentUser.school} 관리`}</span>
    </Button>
   )}
   <Button aria-label="앱으로 설치" className="!px-2.5 border-[#dcd3ee] bg-[#faf8fe] text-brand" onClick={async()=>{if(deferredPrompt){deferredPrompt.prompt();const {outcome}=await deferredPrompt.userChoice;if(outcome==="accepted")setDeferredPrompt(null);}else{setModal({type:"install"});}}}><Monitor className="h-4 w-4"/><span className="hidden sm:inline">📲 앱 설치</span></Button>

   {currentUser && <Button className="!px-2.5 text-xs text-slate-500" onClick={handleLogout}>로그아웃</Button>}

   {saveError&&<div className="mb-4"><Note error>{saveError}</Note></div>}

   <div className="mb-6 flex flex-wrap justify-between gap-4"><div><p className="mb-2 flex items-center gap-2 text-[11px] text-slate-500"><span className="h-1.5 w-1.5 rounded-full bg-brand"/>{page==="매일 문해력"?"고등 심화 비문학 · 1~5문단(1,500~2,000자) · 문해력_창고 연동":page==="과정안·학습지"?"사실에서 개념으로, 개념에서 새로운 맥락으로":dateLabel(day())}</p><h1 className="text-[25px] font-bold tracking-tight md:text-[28px]">{page==="오늘의 교무실"?"선생님, 오늘도 반갑습니다.":page==="과정안·학습지"?"AI 개념기반 수업 설계실":page==="매일 문해력"?"구글 드라이브 '문해력_창고' 보관소":page}</h1><p className="mt-2 max-w-3xl text-[13px] leading-7 text-slate-500">{wc?wc.intro:page==="매일 문해력"?"앱스 스크립트를 통해 구글 드라이브 '문해력_창고' 폴더에 고등 수준(1~5문단, 1,500~2,000자) 활동지를 자동 적재하고 불러옵니다.":page==="과정안·학습지"?"교사용 PDF를 분석하고, 개념·일반화·탐구·전이·평가가 연결된 과정안과 학생 활동지를 설계합니다.":"수업부터 학급 운영까지, 오늘 필요한 일을 한곳에서."}</p></div>{page==="오늘의 교무실"&&<Button primary onClick={()=>go("과정안·학습지")}><Sparkles className="h-4 w-4"/>AI 수업 설계 시작</Button>}</div>
   {errorView}{busyView}

   {page==="오늘의 교무실"&&(()=>{
    const todayStr = day();
    const todayAttMap = data.attendance?.[todayStr] || {};
    const totalStu = data.students.length;
    const presentCnt = data.students.filter(st => todayAttMap[st.id] === "출석").length;
    const issueStus = data.students.filter(st => todayAttMap[st.id] && !["출석","미기록"].includes(todayAttMap[st.id]));
    const unrecordedCnt = data.students.filter(st => !todayAttMap[st.id] || todayAttMap[st.id] === "미기록").length;
    const submittedCnt = data.students.filter(st => st.submitted).length;
    const todayEvents = data.events.filter(e => e.date === todayStr).sort((a,b)=>String(a.time).localeCompare(String(b.time)));

    // 현재 선택된 대시보드 교시(dashPeriod)의 교과담당 선생님 입력 출결 조회
    const myDept = `${data.profile.grade}-${data.profile.classroom}`;
    const sharedPeriodMap = data.classAttendance?.__sharedPeriod?.[todayStr]?.[dashPeriod] || {};
    const localPeriodKey = `${todayStr}_${dashPeriod}교시`;
    const localHomeroomPeriodMap = data.classAttendance?.homeroom?.[localPeriodKey] || {};

    const periodStudentRows = data.students.map(st => {
     const sharedRec = sharedPeriodMap[`${myDept}|${st.name}`];
     let subjStatus = sharedRec?.status || localHomeroomPeriodMap[st.id] || "";
     let subjMeta = sharedRec ? `${sharedRec.subject||"교과"} (${sharedRec.teacher||"교과교사"})` : "";
     if(!subjStatus){
      for(const cls of (data.subjectClasses||[]).filter(c=>c.id!=="homeroom")){
       const matchedStu = (cls.students||[]).find(s => s.name === st.name && (!s.dept || s.dept === myDept));
       if(matchedStu){
        const stVal = data.classAttendance?.[cls.id]?.[localPeriodKey]?.[matchedStu.id];
        if(stVal && stVal !== "미기록"){
         subjStatus = stVal;
         subjMeta = cls.name;
         break;
        }
       }
      }
     }
     const hrSt = todayAttMap[st.id] || "미기록";
     const sbSt = subjStatus || "미체크";
     // 담임 출결과 교과담임 출결이 모두 기록되어 있는데 서로 다른 경우 불일치로 판정
     const isMismatch = hrSt !== "미기록" && sbSt !== "미체크" && hrSt !== sbSt;
     return {
      ...st,
      homeroomStatus: hrSt,
      subjectStatus: sbSt,
      subjectMeta: subjMeta,
      isMismatch
     };
    });
    const periodCheckedCnt = periodStudentRows.filter(r => r.subjectStatus !== "미체크").length;
    const periodIssueRows = periodStudentRows.filter(r => !["출석","미체크"].includes(r.subjectStatus));
    const periodMismatchRows = periodStudentRows.filter(r => r.isMismatch);

    // 학기 중 누가출결(결석·인정결석·지각·조퇴) 증빙서류 미제출 건수 집계
    const missingProofs = [];
    Object.entries(data.attendance || {}).sort(([a],[b])=>b.localeCompare(a)).forEach(([dStr, dayMap]) => {
     if(!isObj(dayMap)) return;

     {[2,3,4,5].includes(step)&&(()=>{const kind=KINDS[step-2],v=out[kind];return <div>{lesson&&<div className="mb-5 rounded-lg bg-paper p-4"><p className="text-xs text-brand">{lesson.session}차시 · {s.subject}</p><h3 className="mt-2 font-semibold">{lesson.title}</h3><p className="mt-2 text-xs leading-7 text-slate-500">{lesson.goal}</p></div>}
      {kind==="plan"&&<div className="mb-5"><Note><strong>AI가 설계하는 내용</strong><p>거시·미시 개념 → 일반화 → 세 유형의 탐구 질문 → 도입·전개·정리의 실제 발문과 학생 활동 → 새로운 상황의 전이 → 목표와 연결된 평가·피드백</p></Note></div>}

    {classTab==="🪑 자리배치·모둠" && (()=>{
     const st = data.seating || {};
     const students = data.students || [];

     const pairMode = st.pairMode || "pair"; // "pair"(2명씩 짝꿍), "single"(짝 없이 1인 1열), "group4"(4인 모둠)
     const pairBundan = Number(st.pairBundan) || 3; // 짝꿍 모드일 때 분단 수 (1분단=2열)
     const singleCols = Number(st.singleCols) || 5; // 1인 1열 모드일 때 가로 열 수
     const cols = pairMode === "pair" ? pairBundan * 2 : pairMode === "group4" ? 4 : singleCols;
     const frontMaxRow = Number(st.frontMaxRow) || 1; // 앞자리 배려 줄 수 (1줄 또는 2줄)
     const frontRules = isObj(st.frontRules) ? st.frontRules : {}; // { [studentId]: "center" | "side" | "any" }

     // 좌석 인덱스(0 ~ totalSeats-1)가 중앙 앞자리인지, 사이드 앞자리인지 판별
     const isCenterCol = c => {
      if(cols <= 2) return true;
      return c > 0 && c < cols - 1;
     };
     const isSideCol = c => c === 0 || c === cols - 1;

     const shuffle = arr => {
      const a = [...arr];
      for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
      return a;
     };

     const shuffleSeats = () => {
      const avoidRules = (st.avoidPairs||"").split(",").map(p=>p.trim().split(/[-~·/\s]+/).map(x=>x.trim()).filter(Boolean)).filter(p=>p.length>=2);

      const centerFrontStus = students.filter(s => frontRules[s.id] === "center");
      const sideFrontStus = students.filter(s => frontRules[s.id] === "side");
      const anyFrontStus = students.filter(s => frontRules[s.id] === "any");
      const normalStus = students.filter(s => !frontRules[s.id]);

      let bestSeats = Array(totalSeats).fill(null);

      for(let attempt=0; attempt<60; attempt++){
       const candidate = Array(totalSeats).fill(null);
       const frontCenterIdxs = [];
       const frontSideIdxs = [];
       const otherIdxs = [];

       for(let idx=0; idx<totalSeats; idx++){
        const r = Math.floor(idx / cols);
        const c = idx % cols;
        if(r < frontMaxRow){
         if(isSideCol(c)) frontSideIdxs.push(idx);
         else if(isCenterCol(c)) frontCenterIdxs.push(idx);
        } else {
         otherIdxs.push(idx);
        }
       }

       const sCenter = shuffle(frontCenterIdxs);
       const sSide = shuffle(frontSideIdxs);
       const usedIdxs = new Set();

       // 1) 중앙 앞자리 배정
       shuffle(centerFrontStus).forEach(stu => {
        const target = sCenter.find(i => !usedIdxs.has(i)) ?? sSide.find(i => !usedIdxs.has(i));
        if(target !== undefined){ candidate[target] = stu; usedIdxs.add(target); }
       });
       // 2) 사이드(양끝) 앞자리 배정
       shuffle(sideFrontStus).forEach(stu => {
        const target = sSide.find(i => !usedIdxs.has(i)) ?? sCenter.find(i => !usedIdxs.has(i));
        if(target !== undefined){ candidate[target] = stu; usedIdxs.add(target); }
       });
       // 3) 앞자리(위치 무관) 배정
       const remainFront = shuffle([...sCenter, ...sSide].filter(i => !usedIdxs.has(i)));
       shuffle(anyFrontStus).forEach(stu => {
        const target = remainFront.find(i => !usedIdxs.has(i));
        if(target !== undefined){ candidate[target] = stu; usedIdxs.add(target); }
       });
       // 4) 아직 배정 못 받은 앞자리 희망자 + 일반 학생을 남은 앞자리부터 차례로 배정
       const placedIds = new Set(candidate.filter(Boolean).map(s=>s.id));
       const unplacedFront = [...centerFrontStus, ...sideFrontStus, ...anyFrontStus].filter(s=>!placedIds.has(s.id));
       const allRemainingPool = [...shuffle(unplacedFront), ...shuffle(normalStus)];

       const restSeatIdxs = [];
       for(let idx=0; idx<totalSeats; idx++){
        if(!usedIdxs.has(idx)) restSeatIdxs.push(idx);
       }
       // 앞쪽 빈자리를 먼저 채우되, 일반 학생은 무작위로 앉힘
       const activeSeatIdxs = restSeatIdxs.slice(0, allRemainingPool.length);
       const shuffledActiveIdxs = shuffle(activeSeatIdxs);
       allRemainingPool.forEach((stu, i) => {
        const seatIdx = shuffledActiveIdxs[i];
        if(seatIdx !== undefined) candidate[seatIdx] = stu;
       });

       // 기피 학생 인접 검사
       const violated = avoidRules.some(([n1,n2]) => {
        const idx1 = candidate.findIndex(s=>s && (s.name===n1 || String(s.number)===n1));
        const idx2 = candidate.findIndex(s=>s && (s.name===n2 || String(s.number)===n2));
        if(idx1===-1 || idx2===-1) return false;
        const r1 = Math.floor(idx1 / cols), c1 = idx1 % cols;
        const r2 = Math.floor(idx2 / cols), c2 = idx2 % cols;
        return Math.abs(r1-r2)<=1 && Math.abs(c1-c2)<=1;
       });

       bestSeats = candidate;
       if(!violated) break;
      }

      update(d=>({...d,seating:{...st,totalSeats,pairMode,pairBundan,singleCols,frontMaxRow,frontRules,arrangement:bestSeats.map(s=>s?s.id:"")}}));
      notify("짝꿍/단독 설정 및 앞자리(중앙·사이드·줄수)·분리 조건을 반영하여 자리를 배치했습니다!");
     };

     // 현재 좌석 배열 구성
     const seatList = Array.from({length:totalSeats}, (_, idx) => {
      if(Array.isArray(st.arrangement) && st.arrangement.length > 0){

     });

        <table style="border-spacing:6px;border-collapse:separate">${tableRows}</table>

            }}
           >

    {classTab==="🧹 1인1역·청소순환" && (()=>{
     const rc = data.rolesClean || {roles:[],zones:[],rotationOffset:0,lastRotated:day()};
     const students = data.students || [];

     const shuffle = arr => {
      const a = [...arr];
      for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
      return a;
     };

     // 1인 1역할: 고정(🔒)된 학생은 유지하고 나머지 역할만 랜덤 배정
     const shuffleRolesWithLock = () => {
      const lockedStuIds = new Set((rc.roles||[]).filter(r=>r.locked && r.studentId).map(r=>r.studentId));
      const availablePool = shuffle(students.filter(s => !lockedStuIds.has(s.id)));
      let poolIdx = 0;
      const nextRoles = (rc.roles||[]).map(r => {
       if(r.locked && r.studentId) return r;
       const picked = availablePool[poolIdx % Math.max(1, availablePool.length)];
       poolIdx++;
       return {...r, studentId: picked?.id || ""};
      });
      update(d=>({...d,rolesClean:{...rc,roles:nextRoles}}));
      notify("🔒 고정된 역할 담당자는 유지하고, 나머지 1인 1역할을 랜덤으로 배정했습니다!");
     };

     // 청소구역별 현재 배정 명단 계산 (assignedIds가 있으면 우선 사용, 없으면 순환 오프셋 기반 초기 계산)
     const rotatedStudents = students.length
      ? students.map((_, idx) => students[(idx + (rc.rotationOffset||0)) % students.length])
      : [];

     let cursor = 0;
     const zoneAssignments = (rc.zones||[]).map(z => {
      const cnt = Number(z.count)||3;
      const lockedSet = new Set(Array.isArray(z.lockedIds) ? z.lockedIds : []);
      let assigned = [];
      if(Array.isArray(z.assignedIds) && z.assignedIds.length > 0){
       assigned = z.assignedIds.map(id => students.find(s=>s.id===id)).filter(Boolean);
      } else {
       assigned = rotatedStudents.slice(cursor, cursor + cnt);
       cursor += cnt;
      }
      return {...z, assigned, lockedSet};
     });
     if(cursor > 0 && cursor < rotatedStudents.length && zoneAssignments.length){
      zoneAssignments[zoneAssignments.length-1].assigned.push(...rotatedStudents.slice(cursor));
     }

     // 청소구역: 고정(🔒)된 학생은 해당 구역에 그대로 두고 나머지 학생만 랜덤 추첨
     const shuffleZonesWithLock = () => {
      const lockedMap = {};
      const allLockedIds = new Set();
      zoneAssignments.forEach(z => {
       const lockedList = (z.lockedIds||[]).filter(id => students.some(s=>s.id===id));
       lockedMap[z.id] = lockedList;
       lockedList.forEach(id => allLockedIds.add(id));
      });
      const freeStudents = shuffle(students.filter(s => !allLockedIds.has(s.id)));
      let fCursor = 0;
      const nextZones = (rc.zones||[]).map((z, idx) => {
       const targetCount = Number(z.count)||3;
       const keepIds = lockedMap[z.id] || [];
       const needMore = Math.max(0, targetCount - keepIds.length);
       const addedIds = freeStudents.slice(fCursor, fCursor + needMore).map(s=>s.id);
       fCursor += needMore;
       return {...z, assignedIds:[...keepIds, ...addedIds], lockedIds:keepIds};
      });
      if(fCursor < freeStudents.length && nextZones.length){
       const last = nextZones[nextZones.length-1];
       last.assignedIds = [...last.assignedIds, ...freeStudents.slice(fCursor).map(s=>s.id)];
      }
      update(d=>({...d,rolesClean:{...rc,zones:nextZones,lastRotated:day()}}));
      notify("🔒 고정된 청소 당번은 유지하고, 나머지 학생들을 청소구역에 랜덤 배정했습니다!");
     };

     // 청소구역: 고정(🔒)된 학생은 유지하고 나머지 학생들을 다음 구역으로 한 칸씩 순환
     const rotateZonesWithLock = () => {
      const allLockedIds = new Set();
      zoneAssignments.forEach(z => (z.lockedIds||[]).forEach(id => allLockedIds.add(id)));
      const nextOffset = ((rc.rotationOffset||0) + 2) % Math.max(1, students.length);
      const freeRotated = students
       .map((_, idx) => students[(idx + nextOffset) % students.length])
       .filter(s => !allLockedIds.has(s.id));

      let fCursor = 0;
      const nextZones = (rc.zones||[]).map(z => {
       const targetCount = Number(z.count)||3;
       const keepIds = (z.lockedIds||[]).filter(id => students.some(s=>s.id===id));
       const needMore = Math.max(0, targetCount - keepIds.length);
       const addedIds = freeRotated.slice(fCursor, fCursor + needMore).map(s=>s.id);
       fCursor += needMore;
       return {...z, assignedIds:[...keepIds, ...addedIds], lockedIds:keepIds};
      });
      if(fCursor < freeRotated.length && nextZones.length){
       const last = nextZones[nextZones.length-1];
       last.assignedIds = [...last.assignedIds, ...freeRotated.slice(fCursor).map(s=>s.id)];
      }
      update(d=>({...d,rolesClean:{...rc,zones:nextZones,rotationOffset:nextOffset,lastRotated:day()}}));
      notify("🔒 고정된 학생을 제외하고 다음 주 청소구역을 순환 배정했습니다!");
     };

     const toggleZoneStudentLock = (zoneIdx, stuId) => {
      const nextZones = zoneAssignments.map((z, i) => {
       if(i !== zoneIdx) return {id:z.id, name:z.name, count:z.count, assignedIds:z.assigned.map(s=>s.id), lockedIds:z.lockedIds||[]};
       const curLocks = Array.isArray(z.lockedIds) ? z.lockedIds : [];
       const nextLocks = curLocks.includes(stuId) ? curLocks.filter(id=>id!==stuId) : [...curLocks, stuId];
       return {id:z.id, name:z.name, count:z.count, assignedIds:z.assigned.map(s=>s.id), lockedIds:nextLocks};
      });
      update(d=>({...d,rolesClean:{...rc,zones:nextZones}}));
     };

     const printRolesCleanHTML = () => {
      const roleRows = (rc.roles||[]).map((r,i)=>{
       const stu = students.find(s=>s.id===r.studentId) || students[i];
       return `<tr><td style="text-align:center;width:12%">${i+1}</td><td style="font-weight:700;width:28%">${esc(r.role)}</td><td style="text-align:center;width:22%">${stu?`${stu.number}번 ${esc(stu.name)}${r.locked?" (고정)":""}`:"미배정"}</td><td>${esc(r.desc||"")}</td></tr>`;
      }).join("");
      const zoneRows = zoneAssignments.map(z=>`<tr><th style="width:28%">${esc(z.name)} (${z.assigned.length}명)</th><td>${z.assigned.map(s=>`${s.number}번 ${esc(s.name)}${z.lockedSet.has(s.id)?"(고정)":""}`).join(", &nbsp; ")}</td></tr>`).join("");
      return printDocument(`${className} 1인1역할 및 청소구역 배정표`, `<section class="doc">
       <div>
        <p class="small" style="font-weight:700">${esc(data.profile.school)} · ${esc(className)} 학급 자치 운영표</p>
        <h1>${esc(className)} 1인 1역할 및 청소구역 배정표</h1>
        <div class="meta">적용 기준일: ${esc(dateLabel(rc.lastRotated||day()))} · 순환 회차: ${(rc.rotationOffset||0)+1}주차 적용</div>
        <h2>1. 학급 1인 1역할 분담표</h2>
        <table><thead><tr><th style="width:12%">연번</th><th style="width:28%">역할명</th><th style="width:22%">담당 학생</th><th>세부 실천 내용</th></tr></thead><tbody>${roleRows}</tbody></table>
        <h2>2. 주간 청소구역 배정표</h2>
        <table><thead><tr><th style="width:28%">청소 구역명</th><th>담당 학생 명단</th></tr></thead><tbody>${zoneRows}</tbody></table>
       </div>
       <p class="small" style="text-align:right">담임교사: ${esc(data.profile.teacher||"")} (확인)</p>
      </section>`);
     };

     return <div className="space-y-6">
      <div className="grid gap-5 xl:grid-cols-2">
       {/* 좌측: 1인 1역할 사전 세팅 · 개별 고정(🔒) · 랜덤 돌리기 */}
       <section className={`${PANEL} p-5 space-y-4`}>
        <div className="flex flex-wrap items-center justify-between gap-2 border-b border-line pb-3">
         <div>
          <Tag>사전 역할 세팅 · 🔒 개별 고정 · 🎲 랜덤 추첨</Tag>
          <h2 className="mt-1.5 text-base font-bold">🙋‍♂️ 우리 반 1인 1역할 배정 및 관리</h2>
          <p className="mt-0.5 text-[11px] text-slate-500">역할을 미리 세팅해 두고, 고정할 학생은 [🔒고정]을 누른 뒤 랜덤 배정을 실행하세요.</p>
         </div>
         <div className="flex flex-wrap gap-1.5">
          <Button primary onClick={shuffleRolesWithLock}>🎲 고정 제외 랜덤 배정</Button>
          <Button onClick={()=>{
           const nextRoles = (rc.roles||[]).map((r,i)=>r.locked?r:({...r,studentId:students[i%Math.max(1,students.length)]?.id||""}));
           update(d=>({...d,rolesClean:{...rc,roles:nextRoles}}));
           notify("고정된 역할을 제외하고 번호순으로 자동 매칭했습니다.");
          }}>번호순 배정</Button>
         </div>
        </div>

        <div className="space-y-2.5">
         {(rc.roles||[]).map((r, idx) => (
          <div key={r.id} className={`grid gap-2 rounded-xl border p-3 sm:grid-cols-[1fr_135px_auto_1fr_auto] items-center ${r.locked?"border-brand bg-[#faf8fe]":"border-line bg-paper"}`}>
           <input className={INPUT+" !py-1.5 font-semibold"} value={r.role} onChange={e=>{
            const next = rc.roles.map((x,i)=>i===idx?{...x,role:e.target.value}:x);
            update(d=>({...d,rolesClean:{...rc,roles:next}}));
           }} placeholder="역할명"/>
           <select className={INPUT+" !py-1.5"} value={r.studentId||""} onChange={e=>{
            const next = rc.roles.map((x,i)=>i===idx?{...x,studentId:e.target.value}:x);
            update(d=>({...d,rolesClean:{...rc,roles:next}}));

           <button

            onClick={()=>{
             const next = rc.roles.map((x,i)=>i===idx?{...x,locked:!x.locked}:x);
             update(d=>({...d,rolesClean:{...rc,roles:next}}));
            }}
            className={`rounded-lg border px-2.5 py-1.5 text-xs font-bold transition-colors ${r.locked?"border-brand bg-brand text-white":"border-line bg-white text-slate-500 hover:text-ink"}`}
            title="체크 시 랜덤 배정에서도 이 학생이 고정됩니다"

           <input className={INPUT+" !py-1.5 !text-xs"} value={r.desc||""} onChange={e=>{
            const next = rc.roles.map((x,i)=>i===idx?{...x,desc:e.target.value}:x);
            update(d=>({...d,rolesClean:{...rc,roles:next}}));
           }} placeholder="활동 설명"/>
           <button type="button" className="p-1.5 text-slate-400 hover:text-red-600" onClick={()=>{
            update(d=>({...d,rolesClean:{...rc,roles:rc.roles.filter((_,i)=>i!==idx)}}));
           }}><Trash2 className="h-4 w-4"/></button>

          <h2 className="mt-1.5 text-base font-bold">🧹 청소구역 랜덤·순환 배정기</h2>
          <p className="mt-0.5 text-[11px] text-slate-500">배정된 학생 이름 배지를 클릭하면 <strong>🔒고정</strong>되어 랜덤/순환 시에도 그 구역에 남습니다.</p>
         </div>

         </div>

        <div className="space-y-3">
         {zoneAssignments.map((z, idx) => (
          <div key={z.id} className="rounded-xl border border-line bg-white p-4 space-y-2.5">
           <div className="flex flex-wrap items-center justify-between gap-2">
            <input className={INPUT+" !py-1 font-bold text-brand !w-[200px]"} value={z.name} onChange={e=>{
             const next = rc.zones.map((x,i)=>i===idx?{...x,name:e.target.value}:x);

            <div className="flex items-center gap-1.5 text-xs">

             <span>명</span>

              className={`inline-flex items-center gap-1 rounded-lg border px-2.5 py-1 text-xs font-medium transition-colors ${isLocked?"border-brand bg-[#eee9fa] text-brand font-bold":"border-line bg-paper text-slate-700 hover:border-brand"}`}
              title="클릭하여 이 청소구역에 학생 고정 / 해제"

             notify(`${acc.name} 선생님의 권한을 변경했습니다.`);
            }}>
             <option value="teacher">👨‍🏫 일반 교사</option>
             <option value="subadmin">🏫 학교 관리자 (Sub-Admin)</option>
             <option value="master">👑 총괄 마스터</option>
            </select>
           ) : (
            <span className="font-semibold">{acc.role==="master"?"👑 총괄마스터":acc.role==="subadmin"?"🏫 학교관리자":"👨‍🏫 일반교사"}</span>
           )}
          </td>
          <td className="p-2.5 text-center">
           <span className={`rounded-full px-2.5 py-0.5 text-[11px] font-bold ${acc.approved?"bg-emerald-100 text-emerald-800":"bg-amber-100 text-amber-800"}`}>
            {acc.approved ? "승인 완료" : "승인 대기"}
           </span>
          </td>
          <td className="p-2.5 text-center">
           {acc.role === "master" && !isSuperMaster ? (
            <span className="text-slate-400">-</span>
           ) : (
            <div className="flex justify-center gap-1.5">
             <Button className="!min-h-[30px] !px-2.5 !py-1 !text-xs" primary={!acc.approved} onClick={async()=>{
              const next = accountsList.map((a,i)=>i===realIdx?{...a,approved:!a.approved}:a);
              await saveAccountsChannel(next);
              notify(`${acc.name} 선생님 계정을 ${!acc.approved?"승인":"대기 전환"}했습니다.`);
             }}>
              {acc.approved ? "승인 취소" : "✓ 즉시 승인"}
             </Button>
             <Button className="!min-h-[30px] !px-2.5 !py-1 !text-xs" onClick={async()=>{
              const tempPw = "gyo" + Math.floor(1000 + Math.random()*9000) + "!";
              const newHash = await sha256Hex(tempPw);
              const next = accountsList.map((a,i)=>i===realIdx?{...a,passwordHash:newHash}:a);
              await saveAccountsChannel(next);
              prompt(`${acc.name}(${acc.username}) 선생님의 임시 비밀번호가 초기화되었습니다. 아래 비밀번호를 복사해 전달해 주세요:`, tempPw);
             }}>
              비번 초기화
             </Button>
            </div>
           )}
          </td>
         </tr>;
        })}
       </tbody>
      </table>
     </div>
    </section>
   </div>
  </Dialog>;
 })()}

 {toast&&<div role="status" aria-live="polite" className="fixed bottom-5 left-1/2 z-[70] flex w-[calc(100%-32px)] max-w-md -translate-x-1/2 items-start gap-2 rounded-xl bg-[#302847] px-4 py-3 text-xs leading-6 text-white shadow-lg"><CheckCircle className="mt-1 h-4 w-4 shrink-0"/><span className="min-w-0 flex-1">{toast}</span><button type="button" aria-label="알림 닫기" onClick={()=>setToast("")} className="p-1"><X className="h-4 w-4"/></button></div>}
 </div>;
}

class ErrorBoundary extends React.Component{
 constructor(props){super(props);this.state={error:null};}
 static getDerivedStateFromError(error){return {error};}
 render(){
  if(this.state.error)return <main className="mx-auto max-w-xl px-6 py-16"><h1 className="text-xl font-bold">화면 구성 중 오류가 발생했습니다.</h1><p className="mt-4 text-sm leading-7 text-slate-600">저장 자료를 지우지 말고 원본부터 백업하세요. 아래 문구를 알려주시면 원인 확인에 도움이 됩니다.</p><pre className="mt-4 rounded-lg border border-red-200 bg-red-50 p-4 text-xs text-red-800">{String(this.state.error.message||this.state.error)}</pre><div className="mt-5 flex flex-wrap gap-2"><Button onClick={()=>{try{download("교무실_원본저장자료.json",localStorage.getItem(STORE)||"{}","application/json");}catch{alert("저장소에 접근하지 못했습니다.");}}}>원본 자료 다운로드</Button><Button primary onClick={()=>location.reload()}>새로고침</Button></div></main>;
  return this.props.children;
 }
}
ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
